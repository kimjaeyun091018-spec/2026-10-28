<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>종이 접는 용사</title>
<style>
  html,body{margin:0;height:100%;background:#2a2723;overflow:hidden;
    font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
// =====================================================================
//  종이 접는 용사 (가제) — 첫 프로토타입
//  · 접기: 종이를 실제 기하로 접는다 (접힌 쪽은 접는 선에 대해 반사, 위로 쌓임, 뒷면은 흰색)
//  · 도안의 점선과 플레이어가 접은 선이 얼마나 맞는지로 도구 성능이 정해진다
// =====================================================================
const W = 960, H = 540;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
}
addEventListener('resize', resize); resize();
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}

// ---------- 벡터·행렬 ----------
const P = a => ({ x: a[0], y: a[1] });
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const mul = (a, k) => ({ x: a.x * k, y: a.y * k });
const dot = (a, b) => a.x * b.x + a.y * b.y;
const cross = (a, b) => a.x * b.y - a.y * b.x;
const len = a => Math.hypot(a.x, a.y);
const norm = a => { const l = len(a) || 1; return { x: a.x / l, y: a.y / l }; };
const lerpP = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// 행렬 [a,b,c,d,e,f]: x' = a x + c y + e, y' = b x + d y + f
const mApply = (m, p) => ({ x: m[0] * p.x + m[2] * p.y + m[4], y: m[1] * p.x + m[3] * p.y + m[5] });
const mMul = (A, B) => [ // B 다음 A
  A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1],
  A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3],
  A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]];
const mInv = m => { const d = m[0] * m[3] - m[1] * m[2];
  return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d]; };
const mDet = m => m[0] * m[3] - m[1] * m[2];
function reflM(p, n) { const k = 2 * dot(p, n);
  return [1 - 2 * n.x * n.x, -2 * n.x * n.y, -2 * n.x * n.y, 1 - 2 * n.y * n.y, k * n.x, k * n.y]; }
const reflectPt = (q, p, n) => sub(q, mul(n, 2 * dot(sub(q, p), n)));

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 종이 기하 ----------
// 면(face): w = 지금 화면(종이 좌표)에서의 꼭짓점, l = 펼친 종이 위에서의 꼭짓점, M = l→w 변환, z = 층
function clipHalf(poly, p, n, sign) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = sign * dot(sub(a, p), n), db = sign * dot(sub(b, p), n);
    if (da >= 0) out.push(a);
    if ((da >= 0) !== (db >= 0)) { const t = da / (da - db); if (t > 1e-9 && t < 1 - 1e-9) out.push(lerpP(a, b, t)); else if (da < 0) out.push(lerpP(a, b, t)); }
  }
  const c = [];
  for (const q of out) { const l = c[c.length - 1]; if (!l || Math.abs(l.x - q.x) + Math.abs(l.y - q.y) > 1e-6) c.push(q); }
  if (c.length > 1) { const a = c[0], l = c[c.length - 1]; if (Math.abs(l.x - a.x) + Math.abs(l.y - a.y) < 1e-6) c.pop(); }
  return c;
}
function area(poly) { let s = 0; for (let i = 0; i < poly.length; i++) s += cross(poly[i], poly[(i + 1) % poly.length]); return Math.abs(s) / 2; }
function inPoly(pt, poly, eps = 0.01) {
  let pos = 0, neg = 0;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const e = sub(b, a), c = cross(e, sub(pt, a)) / (len(e) || 1);
    if (c > eps) pos++; else if (c < -eps) neg++;
  }
  return !(pos && neg);
}
// 실제 종이접기처럼 색면을 아래로 두고 시작 → 접어 넘긴 면에 색이 보임
function initFaces() {
  const sq = [P([-100, -100]), P([100, -100]), P([100, 100]), P([-100, 100])];
  return [{ w: sq, l: sq.map(p => ({ x: -p.x, y: p.y })), M: [-1, 0, 0, 1, 0, 0], z: 0 }];
}
// 접기: n 쪽(양수)에 있는 종이를 선 너머로 넘김 (골접기, 넘어간 종이가 위로)
function fold(faces, p, n) {
  let L = -Infinity; for (const f of faces) L = Math.max(L, f.z);
  const R = reflM(p, n), out = [];
  for (const f of faces) {
    const keep = clipHalf(f.w, p, n, -1), mov = clipHalf(f.w, p, n, 1);
    if (keep.length >= 3 && area(keep) > 0.2) out.push({ w: keep, M: f.M, z: f.z });
    if (mov.length >= 3 && area(mov) > 0.2) out.push({ w: mov.map(q => mApply(R, q)), M: mMul(R, f.M), z: 2 * L + 1 - f.z });
  }
  const zs = [...new Set(out.map(f => f.z))].sort((a, b) => a - b);
  for (const f of out) { f.z = zs.indexOf(f.z); const inv = mInv(f.M); f.l = f.w.map(q => mApply(inv, q)); }
  return out.sort((a, b) => a.z - b.z);
}
function toLocal(faces, pt) { for (let i = faces.length - 1; i >= 0; i--) if (inPoly(pt, faces[i].w)) return mApply(mInv(faces[i].M), pt); return { ...pt }; }
function toWorld(faces, lp) { for (let i = faces.length - 1; i >= 0; i--) if (inPoly(lp, faces[i].l)) return mApply(faces[i].M, lp); return null; }
function onPaper(faces, pt) { return faces.some(f => inPoly(pt, f.w, 0.5)); }
function lineSeg(faces, a, b) { // 선이 종이 윤곽 안에 걸치는 구간
  const d = sub(b, a); let tmin = Infinity, tmax = -Infinity;
  for (const f of faces) { const w = f.w;
    for (let i = 0; i < w.length; i++) {
      const e0 = w[i], e = sub(w[(i + 1) % w.length], e0), den = cross(d, e);
      if (Math.abs(den) < 1e-9) continue;
      const t = cross(sub(e0, a), e) / den, u = cross(sub(e0, a), d) / den;
      if (u >= -1e-6 && u <= 1 + 1e-6) { tmin = Math.min(tmin, t); tmax = Math.max(tmax, t); }
    } }
  if (tmin === Infinity) return [a, b];
  return [add(a, mul(d, tmin)), add(a, mul(d, tmax))];
}
function lineFrom(a, b, m) { const dir = norm(sub(b, a)); let n = { x: -dir.y, y: dir.x }; if (dot(sub(m, a), n) < 0) n = mul(n, -1); return { p: a, n }; }
function bbox(faces) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const f of faces) for (const q of f.w) { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 }; }

// ---------- 도안 ----------
// 각 단계: a·b = 점선(이상적으로 접었을 때의 좌표), m = 넘어가는 쪽의 한 점, t = 설명
const DESIGNS = {
  sword: { name: '종이 칼', short: '칼', color: '#c4524a', back: '#f5eedf', kind: 'weapon',
    desc: '가까이 있는 적을 벱니다.',
    steps: [
      { a: [-100, 0], b: [100, 0], m: [0, 60], t: '아래 반을 위로 반 접어요' },
      { a: [-100, -50], b: [100, -50], m: [0, -20], t: '한 번 더 아래 반을 위로 접어요' },
      { a: [75, -100], b: [100, -75], m: [95, -95], t: '오른쪽 위 모서리를 비스듬히 접어요' },
      { a: [75, -50], b: [100, -75], m: [95, -55], t: '오른쪽 아래 모서리도 접어 칼끝을 세워요' },
      { a: [-70, -100], b: [-70, -50], m: [-88, -75], t: '왼쪽 끝을 접어 손잡이를 만들어요' }] },
  plane: { name: '종이비행기', short: '비행기', color: '#d9a531', back: '#f5eedf', kind: 'passive',
    desc: '공중에서 점프를 누르고 있으면 천천히 활공합니다.',
    steps: [
      { a: [0, -100], b: [-100, 0], m: [-85, -85], t: '왼쪽 위 모서리를 가운데 선에 맞춰 접어요' },
      { a: [0, -100], b: [100, 0], m: [85, -85], t: '오른쪽 위 모서리도 가운데로 접어요' },
      { a: [0, -100], b: [-82.84, 100], m: [-90, 60], t: '왼쪽 비스듬한 변을 가운데 선에 맞춰 접어요' },
      { a: [0, -100], b: [82.84, 100], m: [90, 60], t: '오른쪽 비스듬한 변도 가운데로 접어요' },
      { a: [0, -100], b: [0, 100], m: [-20, 60], t: '가운데 선을 따라 반으로 접어요' }] },
  star: { name: '종이 표창', short: '표창', color: '#3f6ea6', back: '#f5eedf', kind: 'weapon',
    desc: '마우스 쪽으로 던집니다. 높은 곳의 과녁도 맞힐 수 있어요.',
    steps: [
      { a: [-100, -100], b: [100, 100], m: [-70, 70], t: '왼쪽 아래 모서리를 오른쪽 위로, 대각선으로 접어요' },
      { a: [100, -100], b: [0, 0], m: [70, 40], t: '아래 꼭짓점을 왼쪽 꼭짓점에 맞춰 반으로 접어요' },
      { a: [-100, 0], b: [0, -100], m: [-80, -90], t: '왼쪽 꼭짓점을 아래 꼭짓점에 맞춰 접어요' },
      { a: [0, -100], b: [100, 0], m: [80, -90], t: '오른쪽 꼭짓점도 아래 꼭짓점에 맞춰 접어요' }] },
  shield: { name: '종이 방패', short: '방패', color: '#5a8a58', back: '#f5eedf', kind: 'weapon',
    desc: 'K 또는 오른쪽 클릭을 누르고 있으면 앞에서 오는 공격을 막아요.',
    steps: [
      { a: [-100, 0], b: [0, -100], m: [-85, -85], t: '왼쪽 위 모서리를 한가운데로 접어요' },
      { a: [0, -100], b: [100, 0], m: [85, -85], t: '오른쪽 위 모서리도 한가운데로' },
      { a: [100, 0], b: [0, 100], m: [85, 85], t: '오른쪽 아래 모서리도 한가운데로' },
      { a: [0, 100], b: [-100, 0], m: [-85, 85], t: '마지막으로 왼쪽 아래 모서리도 한가운데로' }] },
};
// 이상적으로 접어 가며, 각 단계의 점선을 '펼친 종이 위의 점'으로 기억한다.
// 그래서 앞 단계를 비뚤게 접으면 다음 점선도 종이를 따라 비뚤어진다 (실제 종이접기처럼).
for (const d of Object.values(DESIGNS)) {
  let faces = initFaces(); d.anch = [];
  for (const s of d.steps) {
    const a = P(s.a), b = P(s.b), m = P(s.m), { p, n } = lineFrom(a, b, m);
    const seg = lineSeg(faces, a, b);
    d.anch.push({ A: toLocal(faces, lerpP(seg[0], seg[1], 0.06)), B: toLocal(faces, lerpP(seg[0], seg[1], 0.94)), m: toLocal(faces, m) });
    faces = fold(faces, p, n);
  }
  d.ideal = faces;
}
const GRADES = [[0.93, 'S', '#b8862b'], [0.82, 'A', '#4f7f4a'], [0.68, 'B', '#3f6ea6'], [0.5, 'C', '#8a6a4a'], [0, 'D', '#9a4a42']];
const gradeOf = q => GRADES.find(g => q >= g[0]);
function toolStats(kind, q) {
  switch (kind) {
    case 'sword': return { dmg: 1 + 2 * q, reach: 22 + 30 * q,
      rows: [['공격력', q, (1 + 2 * q).toFixed(1)], ['사거리', q, Math.round(22 + 30 * q) + 'px']] };
    case 'star': return { dmg: 0.8 + 1.2 * q, range: 190 + 330 * q, spread: (1 - q) * 14,
      rows: [['위력', q, (0.8 + 1.2 * q).toFixed(1)], ['사거리', q, Math.round(190 + 330 * q) + 'px'], ['곧게 날기', q, '±' + ((1 - q) * 14).toFixed(1) + '°']] };
    case 'plane': return { fall: 150 - 120 * q, boost: 1 + 0.35 * q,
      rows: [['활공', q, '낙하 ' + Math.round(150 - 120 * q)], ['속도', q, '×' + (1 + 0.35 * q).toFixed(2)]] };
    case 'shield': { const n = 2 + Math.round(6 * q); return { blocks: n, rows: [['막기 횟수', q, n + '번']] }; }
  }
}

// ---------- 공용: 종이 텍스처 ----------
const grain = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), r = rng(3);
  for (let i = 0; i < 1400; i++) { g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,.18)' : 'rgba(80,60,40,.07)';
    g.fillRect(r() * 128, r() * 128, 1 + r() * 1.5, 0.6 + r()); }
  for (let i = 0; i < 40; i++) { g.strokeStyle = 'rgba(90,70,50,.06)'; g.lineWidth = 0.6; g.beginPath();
    const x = r() * 128, y = r() * 128; g.moveTo(x, y); g.lineTo(x + (r() - .5) * 24, y + (r() - .5) * 6); g.stroke(); }
  return ctx.createPattern(c, 'repeat');
})();
function polyPath(c, pts) { c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.closePath(); }
function drawFaces(c, faces, d, o = {}) {
  const lw = o.lw || 1;
  for (const f of faces) {
    polyPath(c, f.w);
    if (o.shadow) { c.save(); c.translate(o.shadow, o.shadow * 1.3); c.fillStyle = 'rgba(40,28,16,.16)'; c.fill(); c.restore(); }
    const front = mDet(f.M) > 0;
    c.fillStyle = front ? d.color : d.back; c.fill();
    if (o.grain) { c.save(); c.globalAlpha = 0.5; c.fillStyle = grain; c.fill(); c.restore(); }
    c.strokeStyle = front ? 'rgba(40,24,14,.55)' : 'rgba(110,90,70,.55)'; c.lineWidth = lw; c.lineJoin = 'round'; c.stroke();
  }
}
// 만든 도구를 그림으로 (게임 안에서 손에 드는 모양 = 실제로 접은 모양 그대로)
function makeToolImage(faces, d, px) {
  const b = bbox(faces), k = px * 3, pad = 4;
  const c = document.createElement('canvas'); c.width = Math.ceil(b.w * k + pad * 2); c.height = Math.ceil(b.h * k + pad * 2);
  const g = c.getContext('2d'); g.translate(pad, pad); g.scale(k, k); g.translate(-b.x0, -b.y0);
  drawFaces(g, faces, d, { lw: 2.2 / k });
  return { img: c, w: c.width / 3, h: c.height / 3 };
}

// ---------- 상태 ----------
const G = { state: 'title', t: 0, tools: {}, equip: null, toast: null, cam: 0, check: 80, shieldLeft: 0, startT: 0 };
let F = null; // 접기 화면
let player, enemies, cannons, blobs, stars, parts, gate;

const GROUND = 440;
const LEVEL_W = 4050;
const DESKS = [
  { x: 250, kind: 'sword' }, { x: 1010, kind: 'plane' }, { x: 1530, kind: 'star' }, { x: 2860, kind: 'shield' }];
const GOAL = { x: 3900 };
const BASE_SOLIDS = [
  { x: -400, y: 0, w: 400, h: 640 },               // 왼쪽 끝
  { x: -10, y: GROUND, w: 710, h: 200 },           // 시작 땅
  { x: 770, y: GROUND, w: 330, h: 200 },           // 작은 틈 뒤
  { x: 1400, y: GROUND, w: 1020, h: 200 },         // 잉크 웅덩이(300) 건너편
  { x: 2640, y: GROUND, w: 1410, h: 200 },         // 병풍 앞 웅덩이(220) 건너편 ~ 끝
  { x: 1880, y: 372, w: 120, h: 18 }, { x: 2060, y: 312, w: 110, h: 18 },
  { x: 3080, y: 370, w: 130, h: 18 },
  { x: LEVEL_W, y: 0, w: 400, h: 640 }];
const PITS = [[700, 770], [1100, 1400], [2420, 2640]];

function newGame() {
  G.tools = {}; G.equip = null; G.check = 80; G.startT = G.t; G.shieldLeft = 0;
  for (const d of DESKS) d.got = false;
  player = { x: 80, y: GROUND, vx: 0, vy: 0, w: 18, h: 40, face: 1, sx: 1, onGround: false, coyote: 0, jumpBuf: 0,
    hp: 5, inv: 0, atk: 0, atkCd: 0, atkAng: 0, walkT: 0, gliding: false, shielding: false };
  enemies = [550, 960, 1720, 2120, 2300, 3050, 3420, 3700].map(x => ({ x, y: GROUND - 40, vx: 0, vy: 0, hp: 3, rot: 0, hit: 0, stun: 0, seed: x }));
  cannons = [{ x: 3330, y: GROUND, hp: 4, cd: 1, burst: 0, hit: 0 }, { x: 3640, y: GROUND, hp: 4, cd: 2, burst: 0, hit: 0 }];
  blobs = []; stars = []; parts = [];
  gate = { x: 2640, w: 40, h: 300, open: 0, opening: false, target: { x: 2636, y: GROUND - 228, r: 13 } };
  G.state = 'play';
  toast('A·D 이동, 스페이스 점프 — 오른쪽 책상에 도안이 있어요');
}
function solids() {
  const s = BASE_SOLIDS.slice();
  if (gate.open <= 0) s.push({ x: gate.x, y: GROUND - gate.h, w: gate.w, h: gate.h });
  else if (gate.open >= 1) s.push({ x: gate.x - gate.h, y: GROUND, w: gate.h, h: 16 }); // 쓰러져 다리가 됨
  return s;
}
function toast(text, dur = 3.2) { G.toast = { text, t: dur }; }

// ---------- 입력 ----------
const keys = {}; const mouse = { x: W / 2, y: H / 2, down: false, right: false };
addEventListener('keydown', e => {
  if (e.repeat) { if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); return; }
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  onKey(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = mouse.right = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (G.state === 'title') { newGame(); return; }

function update(dt) {

  const plane = G.tools.plane;

  p.gliding = gliding;
  let spd = 190 * (p.shielding ? 0.45 : 1) * (gliding ? plane.stats.boost : 1);

  if (!(keys.Space || keys.KeyW || keys.ArrowUp) && p.vy < -200) p.vy = -200;
  p.vy += 1450 * dt; if (gliding) p.vy = Math.min(p.vy, plane.stats.fall);

  if (p.onGround && Math.abs(p.vx) > 10) p.walkT += dt * Math.abs(p.vx) / 18;
  if (p.y > H + 60) { p.hp -= 1; scraps(p.x, H, '#4f8fa6', 4); const hpLeft = p.hp; respawn(); if (hpLeft > 0) { p.hp = hpLeft; toast('잉크에 젖었어요! (체력 -1)'); } else toast('흠뻑 젖어 버렸어요… 다시 접혀 나왔어요'); }

  // 표창

    if (s.d > s.max) { s.dead = true; scraps(s.x, s.y, DESIGNS.star.color, 2); continue; }
    if (!gate.opening && Math.hypot(s.x - gate.target.x, s.y - gate.target.y) < gate.target.r + 5) {
      s.dead = true; gate.opening = true; scraps(gate.target.x, gate.target.y, '#c4524a', 12); toast('과녁 명중! 병풍이 쓰러져 다리가 돼요'); continue; }

    e.rot += e.vx * dt / 12;

// ---------- 배경 (종이를 겹친 디오라마) ----------

  const bob = d.got ? 0 : Math.sin(G.t * 3) * 2;
  ctx.fillStyle = '#f5eedf'; ctx.fillRect(x - 14, y - 36 + bob, 28, 10);
  ctx.fillStyle = des.color; ctx.fillRect(x - 16, y - 37 + bob, 4, 12); ctx.fillRect(x + 12, y - 37 + bob, 4, 12);
  ctx.strokeStyle = 'rgba(40,30,30,.6)'; ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(x - 10, y - 31 + bob); ctx.lineTo(x + 10, y - 31 + bob); ctx.stroke(); ctx.setLineDash([]);
  const near = player && Math.abs(player.x - d.x) < 60;
  if (!d.got) { ctx.fillStyle = '#d9a531'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', x, y - 46 + bob); }
  else if (near) { ctx.fillStyle = 'rgba(58,44,32,.85)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`E: ${des.name} 다시 접기`, x, y - 46); }
}
function drawGoal() {
  const x = GOAL.x, y = GROUND - 44 + Math.sin(G.t * 2) * 4;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(217,165,49,.25)'; ctx.beginPath(); ctx.arc(0, 0, 34 + Math.sin(G.t * 3) * 3, 0, 7); ctx.fill();
  // 종이학
  const wing = Math.sin(G.t * 4) * 6;
  ctx.fillStyle = '#e9b949'; ctx.beginPath(); ctx.moveTo(-6, 4); ctx.lineTo(0, -24 - wing); ctx.lineTo(8, 4); ctx.fill();
  ctx.fillStyle = '#d29a2a'; ctx.beginPath(); ctx.moveTo(-26, -2); ctx.lineTo(-6, 4); ctx.lineTo(8, 4); ctx.lineTo(26, -14); ctx.lineTo(4, 12); ctx.lineTo(-4, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f0c95c'; ctx.beginPath(); ctx.moveTo(26, -14); ctx.lineTo(30, -10); ctx.lineTo(8, 4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-26, -2); ctx.lineTo(-30, -14); ctx.lineTo(-22, -2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(58,44,32,.8)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('황금 종이학', x, GROUND - 92);
}
function drawCannon(c) {
  if (c.hp <= 0) { ctx.fillStyle = '#3a3f52'; ctx.beginPath(); ctx.ellipse(c.x, c.y - 3, 22, 4, 0, 0, 7); ctx.fill(); return; }
  ctx.save(); ctx.translate(c.x, c.y);
  ctx.fillStyle = c.hit > 0 ? '#fff' : '#3a4560'; roundRect(-16, -38, 32, 38, 6); ctx.fill();
  ctx.fillStyle = c.hit > 0 ? '#fff' : '#2a3247'; ctx.fillRect(-28, -30, 14, 10);
  ctx.fillStyle = '#e9dcc0'; ctx.fillRect(-12, -26, 24, 12);
  ctx.fillStyle = '#26324a'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('INK', 0, -17);
  ctx.fillStyle = '#8c6b4c'; ctx.fillRect(-9, -44, 18, 7);
  ctx.restore();
}
function drawCrumple(e) { // 구김이: 구겨진 종이 뭉치
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(40,30,20,.15)'; ctx.beginPath(); ctx.ellipse(0, 13, 12, 3, 0, 0, 7); ctx.fill();
  ctx.rotate(e.rot);
  const r = rng(e.seed), pts = [];
  for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, rr = 11 + r() * 4; pts.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr }); }
  ctx.fillStyle = e.hit > 0 ? '#ffffff' : '#ece2cb'; polyPath(ctx, pts); ctx.fill();
  ctx.strokeStyle = 'rgba(90,70,50,.6)'; ctx.lineWidth = 1; ctx.stroke();
  for (let i = 0; i < 9; i += 2) { ctx.fillStyle = 'rgba(120,95,70,.18)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(pts[i].x, pts[i].y); ctx.lineTo(pts[(i + 1) % 9].x, pts[(i + 1) % 9].y); ctx.fill(); }
  ctx.strokeStyle = 'rgba(90,70,50,.35)'; ctx.beginPath(); for (let i = 0; i < 9; i += 3) { ctx.moveTo(0, 0); ctx.lineTo(pts[i].x * 0.9, pts[i].y * 0.9); } ctx.stroke();
  ctx.rotate(-e.rot);
  const look = Math.sign(player.x - e.x) || 1;
  ctx.fillStyle = '#2b2420'; ctx.beginPath(); ctx.arc(look * 3 - 3, -2, 1.8, 0, 7); ctx.arc(look * 3 + 3, -2, 1.8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2b2420'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(look * 3 - 6, -6); ctx.lineTo(look * 3 - 1, -4.5); ctx.moveTo(look * 3 + 6, -6); ctx.lineTo(look * 3 + 1, -4.5); ctx.stroke();
  ctx.restore();
}
function drawPlayer() {
  const p = player; if (p.inv > 0 && Math.floor(p.inv * 14) % 2 && p.inv < 1) return;
  ctx.save(); ctx.translate(Math.round(p.x), Math.round(p.y));
  ctx.fillStyle = 'rgba(40,30,20,.18)'; ctx.beginPath(); ctx.ellipse(0, 0, 11, 3, 0, 0, 7); ctx.fill();
  const flipBack = Math.abs(p.sx) < 0.35; // 돌아설 때 종이 뒷면이 잠깐 보임
  ctx.scale(Math.max(0.08, Math.abs(p.sx)) * Math.sign(p.sx || 1), 1);
  const walk = p.onGround && Math.abs(p.vx) > 10 ? Math.sin(p.walkT) : 0, bob = Math.abs(walk) * 1.5;
  const body = flipBack ? '#f5eedf' : '#4f8fa6', bodyD = flipBack ? '#e2d8c2' : '#3d778d';
  // 다리 (접은 종이 띠)
  ctx.fillStyle = flipBack ? '#e2d8c2' : '#2f5f70';
  const lg = p.onGround ? walk * 6 : 3;
  ctx.save(); ctx.translate(-3, -12); ctx.rotate(lg * 0.07); ctx.fillRect(-2, 0, 4, 12); ctx.restore();
  ctx.save(); ctx.translate(3, -12); ctx.rotate(-lg * 0.07); ctx.fillRect(-2, 0, 4, 12); ctx.restore();
  ctx.translate(0, -bob);
  // 활공: 비행기를 머리 위로
  if (p.gliding && G.tools.plane) { const t = G.tools.plane; ctx.save(); ctx.translate(0, -52); ctx.rotate(Math.PI / 2 + 0.12); ctx.drawImage(t.img, -t.w / 2, -t.h / 2, t.w, t.h); ctx.restore();
    ctx.strokeStyle = bodyD; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-6, -24); ctx.lineTo(-4, -46); ctx.moveTo(6, -24); ctx.lineTo(4, -46); ctx.stroke(); }
  // 몸통: 가운데 접은 선을 두고 두 면
  ctx.fillStyle = body; ctx.beginPath(); ctx.moveTo(-3, -28); ctx.lineTo(0, -28); ctx.lineTo(0, -10); ctx.lineTo(-11, -10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = bodyD; ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(3, -28); ctx.lineTo(11, -10); ctx.lineTo(0, -10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.moveTo(-11, -10); ctx.lineTo(11, -10); ctx.lineTo(8, -13); ctx.lineTo(-8, -13); ctx.fill();
  // 머리: 접은 마름모
  ctx.fillStyle = flipBack ? '#e9dfca' : '#f4ecd9'; ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(-10, -36); ctx.lineTo(0, -27); ctx.closePath(); ctx.fill();
  ctx.fillStyle = flipBack ? '#d9cdb5' : '#e3d6bd'; ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(10, -36); ctx.lineTo(0, -27); ctx.closePath(); ctx.fill();
  ctx.fillStyle = flipBack ? '#d2c4a8' : '#c4524a'; ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(-6, -40); ctx.lineTo(0, -41); ctx.lineTo(6, -40); ctx.closePath(); ctx.fill(); // 접어 올린 모자 끝
  ctx.strokeStyle = 'rgba(80,60,40,.35)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(0, -27); ctx.stroke();
  if (!flipBack) { ctx.fillStyle = '#2b2420'; ctx.fillRect(2.5, -37, 2, 3); ctx.fillRect(6, -37, 2, 3); }
  // 도구
  if (p.shielding && G.tools.shield) { const t = G.tools.shield; ctx.drawImage(t.img, 6, -42, t.w * 0.8, t.h * 0.8 * 1.1); }
  else if (G.equip === 'sword' && G.tools.sword && !p.gliding) {
    const t = G.tools.sword; const a = p.atk > 0 ? (-1.9 + (1 - p.atk / 0.22) * 2.6) : -0.5;
    ctx.save(); ctx.translate(6, -19); ctx.rotate(a); ctx.drawImage(t.img, -3, -t.h / 2, t.w, t.h); ctx.restore();
    if (p.atk > 0.06) { const st = G.tools.sword.stats; ctx.strokeStyle = `rgba(255,250,235,${p.atk * 3})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(6, -19, st.reach * 0.9, -1.4, a); ctx.stroke(); }
  } else if (G.equip === 'star' && G.tools.star && !p.gliding && p.atk <= 0) {
    const t = G.tools.star; ctx.drawImage(t.img, 6, -24, t.w * 0.8, t.h * 0.8);
  }
  if (G.tools.shield && !p.shielding && G.shieldLeft > 0 && !p.gliding) { const t = G.tools.shield; ctx.save(); ctx.globalAlpha = 0.95; ctx.drawImage(t.img, -14, -28, t.w * 0.55, t.h * 0.55); ctx.restore(); }
  ctx.restore();
}

// ---------- HUD ----------
function drawHUD() {
  for (let i = 0; i < 5; i++) paperHeart(26 + i * 28, 26, i < player.hp);
  // 도구 칸
  const order = ['sword', 'star', 'plane', 'shield'], keyL = { sword: '1', star: '2', plane: '활공', shield: 'K' };
  order.forEach((k, i) => {
    const x = W / 2 - 112 + i * 58, y = 10, t = G.tools[k], sel = G.equip === k;
    ctx.fillStyle = sel ? 'rgba(244,236,217,.95)' : 'rgba(244,236,217,.6)'; roundRect(x, y, 50, 50, 8); ctx.fill();
    if (sel) { ctx.strokeStyle = '#d9a531'; ctx.lineWidth = 2.5; roundRect(x, y, 50, 50, 8); ctx.stroke(); }
    if (t) {
      const s = Math.min(34 / t.w, 34 / t.h, 1.6); ctx.drawImage(t.img, x + 25 - t.w * s / 2, y + 25 - t.h * s / 2, t.w * s, t.h * s);
      ctx.fillStyle = t.g[2]; ctx.font = 'bold 13px Georgia,serif'; ctx.textAlign = 'right'; ctx.fillText(t.g[1], x + 46, y + 46);
      if (k === 'shield') { for (let j = 0; j < t.stats.blocks; j++) { ctx.fillStyle = j < G.shieldLeft ? DESIGNS.shield.color : 'rgba(0,0,0,.15)'; ctx.fillRect(x + 4 + j * 5.2, y + 52, 4, 4); } }
    } else { ctx.fillStyle = 'rgba(90,70,50,.35)'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', x + 25, y + 32); }
    ctx.fillStyle = 'rgba(58,44,32,.7)'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(keyL[k], x + 4, y + 13);
  });
  ctx.textAlign = 'left'; ctx.font = '12px sans-serif'; ctx.fillStyle = 'rgba(58,44,32,.7)';
  ctx.fillText('A·D 이동  스페이스 점프  J·클릭 공격  K·우클릭 방패  E 다시 접기  F 전체 화면', 16, H - 14);
  if (G.toast) {
    ctx.globalAlpha = clamp(G.toast.t * 2, 0, 1); ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    const tw = ctx.measureText(G.toast.text).width;
    ctx.fillStyle = 'rgba(40,30,22,.82)'; roundRect(W / 2 - tw / 2 - 16, 78, tw + 32, 32, 16); ctx.fill();
    ctx.fillStyle = '#fff6df'; ctx.fillText(G.toast.text, W / 2, 99); ctx.globalAlpha = 1;
  }
}
function paperHeart(x, y, full) {
  ctx.save(); ctx.translate(x, y);
  const c1 = full ? '#d2584e' : 'rgba(120,100,80,.25)', c2 = full ? '#b2443c' : 'rgba(120,100,80,.18)';
  ctx.fillStyle = c1; ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(-11, -1); ctx.lineTo(-6, -8); ctx.lineTo(0, -3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = c2; ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(11, -1); ctx.lineTo(6, -8); ctx.lineTo(0, -3); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---------- 타이틀·클리어 ----------
function drawTitle() {
  G.cam = (G.t * 30) % (LEVEL_W - W);
  drawBackground();
  ctx.fillStyle = 'rgba(244,236,217,.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#3a2c20';
  ctx.font = 'bold 54px sans-serif'; ctx.fillText('종이 접는 용사', W / 2, 190);
  ctx.font = '15px sans-serif'; ctx.fillStyle = '#8a7258'; ctx.fillText('(가제) · 첫 프로토타입', W / 2, 218);
  ctx.font = '18px sans-serif'; ctx.fillStyle = '#5a4634';
  ctx.fillText('종이로 된 세계. 도안을 모아 점선대로 접으면 도구가 됩니다.', W / 2, 280);
  ctx.fillText('점선에 정확히 맞춰 접을수록 도구가 강해져요.', W / 2, 308);
  // 장식: 이상적인 네 도구
  ['sword', 'star', 'plane', 'shield'].forEach((k, i) => {
    const d = DESIGNS[k], b = bbox(d.ideal), s = Math.min(60 / b.w, 60 / b.h, 0.5);
    ctx.save(); ctx.translate(W / 2 - 165 + i * 110, 380 + Math.sin(G.t * 2 + i) * 4); ctx.rotate(Math.sin(G.t + i) * 0.1); ctx.scale(s, s); ctx.translate(-b.cx, -b.cy);
    drawFaces(ctx, d.ideal, d, { lw: 1.2 / s, shadow: 3 }); ctx.restore();
  });
  ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = `rgba(58,44,32,${0.6 + 0.4 * Math.sin(G.t * 3)})`; ctx.fillText('클릭해서 시작', W / 2, 470);
}
function drawClear() {
  drawWorld(); ctx.fillStyle = 'rgba(244,236,217,.85)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#3a2c20'; ctx.font = 'bold 44px sans-serif'; ctx.fillText('황금 종이학을 찾았어요!', W / 2, 150);
  ctx.font = '16px sans-serif'; ctx.fillStyle = '#5a4634'; ctx.fillText(`걸린 시간 ${Math.floor(G.clearT / 60)}분 ${Math.floor(G.clearT % 60)}초`, W / 2, 184);
  ['sword', 'star', 'plane', 'shield'].forEach((k, i) => {
    const t = G.tools[k], x = W / 2 - 240 + i * 160, y = 290;
    ctx.fillStyle = 'rgba(255,255,255,.6)'; roundRect(x - 65, y - 70, 130, 160, 10); ctx.fill();
    ctx.fillStyle = '#3a2c20'; ctx.font = 'bold 15px sans-serif'; ctx.fillText(DESIGNS[k].name, x, y - 46);
    if (t) { const s = Math.min(70 / t.w, 60 / t.h, 2.4); ctx.drawImage(t.img, x - t.w * s / 2, y - t.h * s / 2, t.w * s, t.h * s);
      ctx.fillStyle = t.g[2]; ctx.font = 'bold 30px Georgia,serif'; ctx.fillText(t.g[1], x, y + 64); ctx.font = '12px sans-serif'; ctx.fillStyle = '#5a4634'; ctx.fillText(Math.round(t.q * 100) + '%', x, y + 82); }
    else { ctx.fillStyle = '#a8957e'; ctx.font = '13px sans-serif'; ctx.fillText('안 만듦', x, y + 10); }
  });
  ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#5a4634'; ctx.fillText('클릭하면 처음 화면으로', W / 2, 460);
}

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now; G.t += dt;
  update(dt);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  if (G.state === 'title') drawTitle();
  else if (G.state === 'fold') drawFold(dt);
  else if (G.state === 'clear') drawClear();
  else { drawWorld(); drawHUD(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { DESKS, G, DESIGNS, get F() { return F; }, get player() { return player; }, fold, FV, pap2scr: p => pap2scr(p), newGame, openFold };
</script>
