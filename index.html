<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12170f">
<title>민둥산 창세기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 신의 작업대 — 위에 내려다본 산(살아 움직이는 지도), 바로 아래 신의 도구, 그 아래 생태계 기록과 창조 일지. */
:root{
  --ground:#12170f; --panel:#1a2117; --line:#2b3627; --ink:#e8ecdc; --muted:#98a48d;
  --leaf:#9cc65b; --water:#6db2d4; --divine:#e9c46a; --life:#dc6a5a; --bark:#b08559;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.sub b{color:var(--divine);font-weight:400}
.hbtns{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--divine);outline-offset:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:var(--muted);font-size:.85rem}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.ghost.on{color:var(--leaf);border-color:var(--leaf)}
.ghost.warn{color:var(--life);border-color:var(--life)}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#20281c;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{display:block;width:100%;aspect-ratio:960/600;max-width:100%}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(18,23,15,.72);color:var(--ink);font-size:1.15rem;line-height:1}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(18,23,15,.88);border:1px solid var(--divine);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:.85rem;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .4s}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-family:var(--f-display);font-size:.95rem;color:var(--muted)}
.tool:hover{color:var(--ink)}
.tool[aria-pressed="true"]{color:#1d1708;background:var(--divine);border-color:var(--divine);font-weight:700}
.tbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.tbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:34px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.84rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip small{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--divine);background:rgba(233,196,106,.1)}
.opts .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.power{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
.power .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.power i{display:block;height:100%;background:linear-gradient(90deg,#b8923c,var(--divine));border-radius:4px;transition:width .3s}
.power span:last-child{font-variant-numeric:tabular-nums;color:var(--ink);min-width:7.5em;text-align:right}
.info{margin:0;font-size:.88rem;color:var(--muted);min-height:3em}
.info b{color:var(--ink);font-weight:400}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:6px}
h2{font-family:var(--f-display);font-size:1.05rem;margin:0 0 8px;font-weight:700}
h2 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem;margin-left:8px}
.stat{display:grid;grid-template-columns:5.2em 3.2em minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.stat .k{display:flex;align-items:center;gap:6px;color:var(--muted)}
.stat .k i{width:8px;height:8px;border-radius:50%}
.stat .v{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:700}
.stat svg{width:100%;height:24px;display:block}
.ms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-bottom:10px}
.ms div{font-size:.8rem;padding:5px 9px;border-radius:6px;border:1px dashed var(--line);color:var(--muted)}
.ms div.done{border-style:solid;border-color:#5b4d26;color:var(--ink);background:#26241a}
.ms div.done::before{content:"✦ ";color:var(--divine)}
.log{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto;border-top:1px solid var(--line)}
.log li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem;display:grid;grid-template-columns:4.6em 1fr;gap:8px}
.log li .d{color:var(--muted);font-size:.74rem;padding-top:2px;font-variant-numeric:tabular-nums}
.log li.good span:last-child{color:#cfe3ad}
.log li.bad span:last-child{color:#f0a89c}
.log li.story span:last-child{font-family:var(--f-display);color:#f1e3b8}
.modal{position:fixed;inset:0;background:rgba(8,10,6,.74);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:20}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.card h3{font-family:var(--f-display);font-size:1.45rem;margin:0}
.card p{margin:0;color:var(--muted)}
.card ul{margin:0;padding-left:1.1em;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.card b{color:var(--ink);font-weight:400}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.primary{background:var(--divine);color:#1d1708;border:0;border-radius:6px;padding:9px 16px;font-weight:700}
@media (max-width:700px){
  h1{font-size:1.55rem}
  .cols{grid-template-columns:1fr}
  .tool{padding:6px 10px;font-size:.88rem}
}
@media (prefers-reduced-motion:reduce){.toast,.power i{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>민둥산 창세기</h1>
      <div class="sub" id="when">1년째 · 봄</div>
    </div>
    <div class="hbtns">
      <button class="ghost" id="snd" aria-pressed="false">소리 켜기</button>
      <button class="ghost" id="reset">새 세상</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="위에서 내려다본 민둥산과 강. 신의 도구로 비를 내리고 씨앗과 생명을 보낼 수 있어요."></canvas>
    <div class="zoom"><button id="zin" aria-label="확대">+</button><button id="zout" aria-label="축소">−</button></div>
    <div class="toast" id="toast" style="opacity:0"></div>
  </div>

  <div class="bar">
    <div class="seg" id="tools" role="toolbar" aria-label="신의 도구"></div>
    <div class="seg" id="time" role="group" aria-label="시간 흐름"></div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="power"><span>신력</span><div class="track"><i id="pw"></i></div><span id="pwn"></span></div>
  <p class="info" id="info"></p>

  <div class="cols">
    <section>
      <h2>생태계<small id="eco-sub"></small></h2>
      <div id="stats"></div>
    </section>
    <section>
      <h2>창조 일지</h2>
      <div class="ms" id="ms"></div>
      <ul class="log" id="log"></ul>
    </section>
  </div>
</main>

<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>

<script>
(function(){
'use strict';
/* ====================== 기본 ====================== */
const GW=160,GH=100,CS=6,W=GW*CS,H=GH*CS,NC=GW*GH;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)*1.15;
const cellAt=(x,y)=>{const cx=Math.floor(x),cy=Math.floor(y);return cx<0||cy<0||cx>=GW||cy>=GH?-1:cy*GW+cx;};
function hash(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s){let t=0,a=.5,f=1;for(let o=0;o<5;o++){t+=a*vnoise(x*f,y*f,s+o*17);a*=.5;f*=2;}return t/.97;}

/* ====================== 세계의 층 ====================== */
const L={h:new Float32Array(NC),rock:new Float32Array(NC),soil:new Float32Array(NC),water:new Float32Array(NC),
  grass:new Float32Array(NC),flower:new Float32Array(NC),lichen:new Float32Array(NC),cover:new Float32Array(NC),pond:new Uint8Array(NC)};
const tmp=new Float32Array(NC),cellNoise=new Float32Array(NC),flowerHue=new Uint8Array(NC);
const treeAt=new Int32Array(NC).fill(-1);
let LAND=1;

const SEASONS=[
  {n:'봄',grow:1,evap:1,rain:1.25},
  {n:'여름',grow:1.25,evap:1.6,rain:1},
  {n:'가을',grow:.45,evap:.9,rain:.85},
  {n:'겨울',grow:0,evap:.35,rain:.6}
];
const SEASON_LEN=120;
const SP={
  birch:{n:'자작나무',w0:.2,w1:.78,soil:.08,grow:.032,life:420,maxR:2.0,shade:.25,seed:15,dist:6,c:[150,190,96],ca:[232,198,72],ever:false},
  pine:{n:'소나무',w0:.13,w1:.72,soil:.05,grow:.017,life:950,maxR:2.4,shade:.45,seed:22,dist:4.5,c:[48,94,60],ca:[48,94,60],ever:true},
  oak:{n:'참나무',w0:.27,w1:.86,soil:.26,grow:.015,life:1400,maxR:3.2,shade:.7,seed:28,dist:3,c:[78,128,56],ca:[188,110,46],ever:false},
  willow:{n:'버드나무',w0:.48,w1:1.01,soil:.08,grow:.03,life:620,maxR:2.8,shade:.3,seed:17,dist:4,c:[152,194,112],ca:[204,188,92],ever:false}
};
const SPK=['birch','pine','oak','willow'];
const DAY=SEASON_LEN/30;                         // 한 계절 = 30일
const DOOM={birch:70,pine:110,oak:140,willow:90}; // 병든 뒤 쓰러지기까지(초)
const PEST_SEASON=[.6,1.6,.8,0];                 // 계절별 병충해 발생
const SPREAD_SEASON=[.7,1.2,.6,0];               // 계절별 옆 나무로 번짐
const BLIGHT_LEN=SEASON_LEN*4;                   // 병든 자리에 같은 나무가 못 자라는 기간(1년)
const SEASON_INFO=[
  ['봄','씨앗이 가장 잘 싹트고, 동물들이 새끼를 낳아요.'],
  ['여름','가장 빨리 자라지만 땅이 빨리 마르고, 벌레가 가장 많아요.'],
  ['가을','나무가 씨앗을 떨구고, 낙엽이 흙을 기름지게 해요.'],
  ['겨울','모든 것이 멈춰요. 지금 뿌린 씨앗은 잠들었다가 봄에 깨어나요.']
];
const AT={
  rabbit:{n:'토끼',cap:300,life:220,adult:30,drain:.032,repro:1.6,cost:.7,rp:.09,col:'#d9cdb4'},
  deer:{n:'사슴',cap:80,life:480,adult:70,drain:.024,repro:1.8,cost:.8,rp:.035,col:'#a8743f'},
  fox:{n:'여우',cap:50,life:460,adult:60,drain:.013,repro:1.6,cost:.7,rp:.1,col:'#dd7a2c'},
  bird:{n:'새',cap:160,life:320,adult:40,drain:.028,repro:1.4,cost:.5,rp:.08,col:'#e9c46a'},
  beaver:{n:'비버',cap:10,life:650,adult:80,drain:.015,repro:1.5,cost:.6,rp:.05,col:'#7a4e2c'}
};
const ATK=['rabbit','deer','fox','bird','beaver'];
const BIRDK=['tit','varied','oriole','redstart','pecker'];
const BIRDC={tit:['#7f9a52','#1b1b1b','#ece6cc'],varied:['#7d8796','#2a2a2a','#c8743e'],oriole:['#e9bf2a','#e9bf2a','#f4d64a'],redstart:['#3a3a40','#9aa0a8','#e07a3a'],pecker:['#1f1f1f','#d8373a','#f0ece0']};
const BIRDN={tit:'박새',varied:'곤줄박이',oriole:'꾀꼬리',redstart:'딱새',pecker:'오색딱따구리'};

/* ====================== 상태 ====================== */
let G,trees=[],animals=[],dams=[],logs=[],clouds=[];
const counts={rabbit:0,deer:0,fox:0,bird:0,beaver:0};
let uid=1,crumbled=0;
function riverY(x,s){return GH*(.8+.055*Math.sin(x*.055+s*.7)+.025*Math.sin(x*.16+s));}
function genWorld(seed){
  const s=seed%997;
  L.rock.fill(0);L.soil.fill(0);L.water.fill(0);L.grass.fill(0);L.flower.fill(0);L.lichen.fill(0);L.cover.fill(0);L.pond.fill(0);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x,nx=x/GW,ny=y/GH;
    const m=Math.exp(-((nx-.56)**2/.04+(ny-.36)**2/.045))*.9+Math.exp(-((nx-.24)**2/.018+(ny-.28)**2/.025))*.45+Math.exp(-((nx-.86)**2/.02+(ny-.24)**2/.03))*.35;
    let hh=m+(fbm(nx*4.5,ny*4.5,s)-.5)*.32+.1;
    const ry=riverY(x,s),d=Math.abs(y+.5-ry),wd=1.2+nx*1.5;
    hh=lerp(.03,hh,Math.pow(clamp((d-wd)/16,0,1),.8));
    L.h[i]=clamp(hh,0,1);
    cellNoise[i]=hash(x,y,s+99);flowerHue[i]=Math.floor(hash(x,y,s+7)*4);
    if(d<wd){L.pond[i]=1;L.water[i]=1;L.h[i]=.01;continue;}
    let r=clamp((L.h[i]-.34)*3.2+(fbm(nx*10,ny*10,s+5)-.5)*1.3,0,1);
    if(hash(x,y,s+3)<.02&&L.h[i]>.12)r=Math.max(r,.7+hash(x,y,s+4)*.3);
    if(r<.22)r=0;L.rock[i]=r;
    L.soil[i]=r>0?0:clamp(.2-L.h[i]*.22+(fbm(nx*6,ny*6,s+11)-.5)*.16,.03,.3);
    if(r===0&&d<6&&hash(x,y,s+21)<.25)L.grass[i]=.08+hash(x,y,s+22)*.25;
  }
  LAND=0;for(let i=0;i<NC;i++)if(!L.pond[i])LAND++;
  for(let k=0;k<260;k++)stepWater(1,0);
}
function fresh(seed){
  G={v:1,seed,time:0,energy:60,speed:1,ms:{},log:[],eaten:0,hunted:0,sound:false,started:false,wind:1.1,hist:{},alive:{},blight:{},dormant:[],pestDead:0};
  trees=[];animals=[];dams=[];logs=[];clouds=[];uid=1;crumbled=0;for(const k in counts)counts[k]=0;
  genWorld(seed);
  // 강가 바위틈의 묘목 하나
  const s=seed%997;let best=-1;
  for(let x=Math.floor(GW*.3);x<GW*.42&&best<0;x++){const ry=riverY(x,s);for(let dy=4;dy<9;dy++){const y=Math.floor(ry-dy),i=y*GW+x;if(!L.pond[i]&&L.rock[i]===0){best=i;break;}}}
  if(best<0)best=Math.floor(GH*.7)*GW+50;
  L.rock[best]=0;L.soil[best]=Math.max(L.soil[best],.24);
  addTree('oak',best%GW,Math.floor(best/GW),.06,true);
  rebuildOcc();computeCover();
}
function season(){return Math.floor(G.time/SEASON_LEN)%4;}
function year(){return Math.floor(G.time/(SEASON_LEN*4))+1;}

/* ====================== 물 · 흙 · 풀 ====================== */
function stepWater(dt,se){
  const w=L.water,t=tmp,ev=SEASONS[se].evap*.016,k=Math.min(.24,dt);
  for(let y=0;y<GH;y++){const row=y*GW;for(let x=0;x<GW;x++){const i=row+x;
    if(L.pond[i]){t[i]=1;continue;}
    const l=x>0?w[i-1]:w[i],r=x<GW-1?w[i+1]:w[i],u=y>0?w[i-GW]:w[i],dn=y<GH-1?w[i+GW]:w[i];
    let v=w[i]+((l+r+u+dn)*.25-w[i])*k;
    const keep=1-.62*Math.min(1,L.cover[i])-.2*L.grass[i];
    v-=v*ev*(L.rock[i]>0?1.5:1)*keep*dt;
    t[i]=v<0?0:v>1?1:v;}}
  w.set(t);
}
function nb4(i){const r=(Math.random()*4)|0;return r===0?i-1:r===1?i+1:r===2?i-GW:i+GW;}
function stepCells(dt,se){
  const sg=SEASONS[se].grow,g=L.grass,f=L.flower,li=L.lichen,ro=L.rock,so=L.soil,w=L.water,cv=L.cover,pd=L.pond;
  for(let y=1;y<GH-1;y++){const row=y*GW;for(let x=1;x<GW-1;x++){const i=row+x;
    if(pd[i])continue;
    const wi=w[i];
    if(ro[i]>0){
      if(li[i]>0){
        li[i]=Math.min(1,li[i]+.04*li[i]*(1-li[i])*clamp((wi-.06)*5,0,1)*(sg+.25)*dt);
        ro[i]-=.0055*li[i]*(.4+wi)*dt;
        if(li[i]>.35&&Math.random()<.06*li[i]*dt){const n=nb4(i);if(!pd[n]&&li[n]===0)li[n]=.04;}
        if(ro[i]<=.06){ro[i]=0;so[i]=Math.max(so[i],.12+li[i]*.08);g[i]=Math.max(g[i],.05);li[i]=0;crumbled++;}
      }
      continue;}
    const suit=clamp((wi-.1)/.3,0,1)*clamp(.3+so[i]*2.5,0,1)*(cv[i]>.95?.35:1);
    if(g[i]>0){
      if(sg>0)g[i]+=.07*g[i]*(1-g[i])*suit*sg*dt;
      if(wi<.08)g[i]-=.03*dt;
      if(g[i]<.01)g[i]=0;
    }else if(sg>0&&suit>.05){const nb=g[i-1]+g[i+1]+g[i-GW]+g[i+GW];if(nb>0&&Math.random()<nb*.06*suit*sg*dt)g[i]=.05;}
    if(f[i]>0){if(g[i]>.35&&sg>0)f[i]+=.045*f[i]*(1-f[i])*suit*sg*dt;else if(sg>0||g[i]<.2)f[i]-=.015*dt;if(f[i]<.01)f[i]=0;}
    else if(g[i]>.5&&sg>0){const nb=f[i-1]+f[i+1]+f[i-GW]+f[i+GW];if(nb>0&&Math.random()<nb*.045*suit*dt)f[i]=.05;}
    so[i]+=(.002*g[i]+.0015*f[i]+.0032*Math.min(1,cv[i])*(se===2?2.2:1))*(1-so[i])*dt;
  }}
}
function addRain(cx,cy,r,amt){
  const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(GW-1,Math.ceil(cx+r)),y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(GH-1,Math.ceil(cy+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const d=Math.hypot(x+.5-cx,y+.5-cy);if(d>r)continue;const i=y*GW+x;if(L.pond[i])continue;
    L.water[i]=Math.min(1,L.water[i]+amt*(1-d/r)*(1+L.h[i]*.6));}
}

/* ====================== 나무 ====================== */
function addTree(sp,x,y,size,first){
  const i=y*GW+x;const t={id:uid++,x,y,jx:(hash(x,y,3)-.5)*.6,jy:(hash(x,y,5)-.5)*.6,sp,size,age:0,hp:1,pest:0,fruit:SP[sp].seed*rand(.6,1.2),
    life:SP[sp].life*rand(.8,1.25)*(first?3:1),first:!!first,same:0,dead:false,doom:0,doomMax:0,guard:0};
  trees.push(t);treeAt[i]=trees.length-1;if(G&&G.blight&&G.blight[i])G.blight[i].stump=0;return t;
}
function rebuildOcc(){treeAt.fill(-1);for(let k=0;k<trees.length;k++)treeAt[trees[k].y*GW+trees[k].x]=k;}
function treeFit(sp,i){const S=SP[sp],w=L.water[i],s=L.soil[i];
  const wf=w<S.w0?Math.pow(w/S.w0,2):w>S.w1?Math.max(0,1-(w-S.w1)*4):1;const sf=s>=S.soil?1:.3+.7*s/S.soil;return wf*sf;}
function dropSeed(sp,fx,fy,germ,wake){
  const x=Math.round(fx),y=Math.round(fy);if(x<1||y<1||x>=GW-1||y>=GH-1)return'out';
  const i=y*GW+x;if(L.pond[i])return'물';if(L.rock[i]>.1)return'바위';if(treeAt[i]>=0)return'자리';if(trees.length>=2200)return'가득';
  const b=G.blight[i];if(b&&b.sp===sp&&G.time<b.until)return'병든 자리';
  if(season()===3&&!wake){if(G.dormant.length<600&&!G.dormant.some(d=>d[1]===x&&d[2]===y)){G.dormant.push([SPK.indexOf(sp),x,y,germ]);return'잠듦';}return'자리';}
  if(L.cover[i]>1.5&&SP[sp].shade<.6&&!(b&&b.stump))return'그늘'; // 쓰러진 나무 자리는 빛이 든다
  const fit=treeFit(sp,i);if(Math.random()<germ*fit*(season()===0?1.25:1)*(b&&b.stump?1.3:1)){addTree(sp,x,y,.03,false);return'ok';}
  return fit<.25?(L.water[i]<SP[sp].w0?'메마름':L.soil[i]<SP[sp].soil*.5?'척박':'안맞음'):'실패';
}
function killTree(t,why){
  if(t.dead)return;t.dead=true;const i=t.y*GW+t.x;if(treeAt[i]>=0&&trees[treeAt[i]]===t)treeAt[i]=-1;
  if(t.size>.3&&why!=='beaver')logs.push({x:t.x+.5+t.jx,y:t.y+.5+t.jy,sp:t.sp,size:t.size,t:0,a:Math.random()*Math.PI});
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const c=cellAt(t.x+dx,t.y+dy);if(c>=0&&!L.pond[c]&&L.rock[c]===0)L.soil[c]=Math.min(1,L.soil[c]+.08*t.size);}
  if(why==='pest'||why==='cut'){const sick=why==='pest'||t.pest>0;G.blight[i]={sp:t.sp,until:sick?G.time+BLIGHT_LEN:0,stump:1,sick:sick?1:0,at:G.time};}
  if(why==='pest')G.pestDead++;
  if(t.first&&G.started)log(why==='old'?'처음의 묘목, 어미나무가 천수를 다하고 쓰러졌다. 그 씨앗들이 숲이 되었다.':why==='pest'?'어미나무가 끝내 병으로 쓰러졌다. 그루터기 곁에 새 생명을 심어 주자.':'처음의 묘목, 어미나무가 쓰러졌다.','story');
}
function countSame(t){let n=0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){if(!dx&&!dy)continue;const c=cellAt(t.x+dx,t.y+dy);if(c<0)continue;const k=treeAt[c];if(k>=0&&trees[k].sp===t.sp&&trees[k].size>.25)n++;}return n;}
function infectNear(t){for(let tries=0;tries<6;tries++){const c=cellAt(t.x+Math.round(gauss()*2.2),t.y+Math.round(gauss()*2.2));if(c<0)continue;const k=treeAt[c];
  if(k>=0){const o=trees[k];if(!o.dead&&o.pest===0&&o.size>.15&&(o.sp===t.sp||Math.random()<.25)){infect(o);return;}}}}
function infect(t){if(t.pest>0||t.dead)return;t.pest=.05;t.doomMax=t.doom=DOOM[t.sp]*rand(.85,1.15)*(t.first?1.5:1);
  if(t.first&&G.started)log(`어미나무가 병들었다. 약 ${Math.round(t.doom/DAY)}일 뒤 쓰러진다. 옆 나무로 번지지 않게 지켜 주자.`,'bad');}
function stepTrees(dt,se){
  const sg=SEASONS[se].grow;
  for(let k=0;k<trees.length;k++){const t=trees[k];if(t.dead)continue;const i=t.y*GW+t.x,S=SP[t.sp];
    if(L.pond[i]&&t.sp!=='willow'){killTree(t,'drown');continue;}
    const fit=treeFit(t.sp,i);
    const comp=Math.max(0,L.cover[i]-t.size*.85-S.shade);
    if(sg>0&&!t.pest)t.size=Math.min(1,t.size+S.grow*fit*sg*(1-Math.min(.92,comp*1.3))*(1-.5*t.size)*dt);
    if(fit<.3)t.hp-=(.3-fit)*.05*dt;else t.hp=Math.min(1,t.hp+.03*dt);
    if(comp>.55&&t.size<.3)t.hp-=.012*dt;
    if(Math.random()<dt/3)t.same=countSame(t);
    if(t.pest>0){ // 병든 나무는 낫지 않는다: 정해진 날이 지나면 쓰러진다
      t.doom-=dt;t.pest=Math.min(1,.05+.95*(1-t.doom/t.doomMax));if(t.guard>0)t.guard-=dt;
      if(t.guard<=0&&t.pest>.25&&Math.random()<.02*SPREAD_SEASON[se]*t.pest*dt)infectNear(t);
      if(t.doom<=0){killTree(t,'pest');continue;}}
    else if(t.size>.3&&Math.random()<.00006*PEST_SEASON[se]*(1+Math.pow(t.same,1.5))/(1+counts.bird/25)*dt)infect(t);
    t.age+=dt;
    if(t.size>.5&&se!==3&&!t.pest){t.fruit-=dt*(se===2?1.5:1);if(t.fruit<=0){t.fruit=S.seed*rand(.7,1.4);
      dropSeed(t.sp,t.x+gauss()*S.dist+G.wind*1.5,t.y+gauss()*S.dist,.55);}}
    if(t.hp<=0)killTree(t,'dry');else if(t.age>t.life)killTree(t,'old');
  }
}
function compact(){let j=0;for(let k=0;k<trees.length;k++)if(!trees[k].dead)trees[j++]=trees[k];trees.length=j;rebuildOcc();
  let a=0;for(let k=0;k<animals.length;k++)if(!animals[k].dead)animals[a++]=animals[k];animals.length=a;}
function computeCover(){const c=L.cover,win=season()===3;c.fill(0);
  for(const t of trees){const S=SP[t.sp],r=.5+S.maxR*t.size,ri=Math.ceil(r),wgt=(.3+.7*t.size)*(win&&!S.ever?.35:1);
    for(let dy=-ri;dy<=ri;dy++){const y=t.y+dy;if(y<0||y>=GH)continue;for(let dx=-ri;dx<=ri;dx++){const x=t.x+dx;if(x<0||x>=GW)continue;
      const d=Math.sqrt(dx*dx+dy*dy);if(d>r)continue;c[y*GW+x]+=(1-d/(r+.5))*wgt;}}}}

/* ====================== 동물 ====================== */
function spawnAnimal(type,x,y){
  if(counts[type]>=AT[type].cap)return null;
  const a={id:uid++,type,x,y,tx:x,ty:y,energy:1,age:0,t:rand(0,2),dir:1,dead:false,state:'',life:AT[type].life*rand(.8,1.2),hop:Math.random()*6,
    kind:type==='bird'?BIRDK[Math.floor(Math.random()*BIRDK.length)]:'',carry:null,dam:-1,tree:-1,note:0};
  animals.push(a);counts[type]++;return a;
}
function moveTo(a,sp,dt,swim){const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d<.05)return 0;
  const st=Math.min(d,sp*dt),nx=a.x+dx/d*st,ny=a.y+dy/d*st;
  if(!swim){const c=cellAt(nx,ny);if(c<0||L.pond[c]){a.tx=a.x;a.ty=a.y;return -1;}}
  else{const c=cellAt(nx,ny);if(c<0){a.tx=a.x;a.ty=a.y;return 0;}}
  a.x=nx;a.y=ny;if(Math.abs(dx)>.01)a.dir=dx>0?1:-1;return d-st;}
function seek(a,radius,score){let best=-1e9,bx=a.x,by=a.y;
  for(let k=0;k<9;k++){const x=a.x+rand(-radius,radius),y=a.y+rand(-radius,radius),c=cellAt(x,y);if(c<0||L.pond[c])continue;const s=score(c)-Math.hypot(x-a.x,y-a.y)*.01;if(s>best){best=s;bx=x;by=y;}}
  a.tx=bx;a.ty=by;return best;}
function nearest(type,a,r){let best=null,bd=r;for(const o of animals){if(o.type!==type||o.dead)continue;const d=Math.hypot(o.x-a.x,o.y-a.y);if(d<bd){bd=d;best=o;}}return best;}
function die(a){if(a.dead)return;a.dead=true;counts[a.type]--;}
function breed(a,dt,ok){const T=AT[a.type];if(ok&&a.energy>T.repro&&a.age>T.adult&&counts[a.type]<T.cap&&Math.random()<T.rp*dt){
  a.energy-=T.cost;const b=spawnAnimal(a.type,a.x+rand(-.6,.6),a.y+rand(-.6,.6));if(b){b.energy=.6;b.dam=a.dam;if(a.type==='bird')b.kind=Math.random()<.7?a.kind:BIRDK[Math.floor(Math.random()*5)];}}}

function upRabbit(a,dt,se){
  a.energy-=AT.rabbit.drain*(se===3?1.35:1)*dt;
  if(Math.random()<dt*2)a.fox=nearest('fox',a,5);
  if(a.fox&&!a.fox.dead){const dx=a.x-a.fox.x,dy=a.y-a.fox.y,d=Math.hypot(dx,dy)||1;if(d<5){a.tx=a.x+dx/d*4+rand(-1.5,1.5);a.ty=a.y+dy/d*4+rand(-1.5,1.5);moveTo(a,3.6,dt);return;}}
  const i=cellAt(a.x,a.y),left=moveTo(a,2.4,dt);
  if(left<.05){
    if(L.grass[i]>.1){const e=Math.min(L.grass[i]-.04,.045*dt);L.grass[i]-=e;a.energy+=e*2.4;
      if(L.flower[i]>0){const ef=Math.min(L.flower[i],.03*dt);L.flower[i]-=ef;a.energy+=ef*3;}
      const k=treeAt[i];if(k>=0&&trees[k].size<.1&&Math.random()<.2*dt)killTree(trees[k],'eaten');}
    a.t-=dt;if(a.t<=0||L.grass[i]<.12){a.t=rand(1.5,4);seek(a,L.grass[i]<.12?8:2,c=>L.grass[c]+L.flower[c]*.5-L.cover[c]*.1);}
  }
  breed(a,dt,se<3);
}
function upDeer(a,dt,se){
  a.energy-=AT.deer.drain*(se===3?1.3:1)*dt;
  const i=cellAt(a.x,a.y),left=moveTo(a,1.9,dt);
  if(left<.05){
    if(L.grass[i]>.1){const e=Math.min(L.grass[i]-.04,.05*dt);L.grass[i]-=e;a.energy+=e*2;}
    const k=treeAt[i];if(k>=0){const t=trees[k];if(t.size<.4){t.size=Math.max(.02,t.size-.04*dt);t.hp-=.03*dt;a.energy+=.035*dt;}}
    a.t-=dt;if(a.t<=0){a.t=rand(2,5);
      let cx=0,cy=0,n=0;for(const o of animals){if(o.type==='deer'&&o!==a&&!o.dead&&Math.abs(o.x-a.x)<10&&Math.abs(o.y-a.y)<10){cx+=o.x;cy+=o.y;n++;}}
      seek(a,7,c=>L.grass[c]+(treeAt[c]>=0&&trees[treeAt[c]].size<.4?.4:0));
      if(n>0){a.tx=lerp(a.tx,cx/n,.35);a.ty=lerp(a.ty,cy/n,.35);}}
  }
  breed(a,dt,se<2);
}
function upFox(a,dt,se){
  a.energy-=AT.fox.drain*(se===3?1.3:1)*dt;
  a.t-=dt;
  if(a.t<=0){a.t=.5;a.prey=a.energy<(a.prey?1.6:1.15)?nearest('rabbit',a,a.energy<.8?45:14):null;if(!a.prey&&Math.hypot(a.tx-a.x,a.ty-a.y)<.2)seek(a,a.energy<1?20:8,c=>Math.random()+(L.grass[c]>.3?.6:0));}
  if(a.prey&&!a.prey.dead){a.tx=a.prey.x;a.ty=a.prey.y;const left=moveTo(a,4.6,dt);
    if(left<0){a.prey=null;a.t=2;seek(a,8,c=>Math.random());}
    else if(left<.6){die(a.prey);a.energy+=.85;G.hunted++;a.prey=null;a.t=rand(2,4);a.tx=a.x;a.ty=a.y;
      if(!G.ms.chain)ms('chain','여우가 토끼를 잡았다. 이 산에 먹이사슬이 생겼다.');}}
  else moveTo(a,1.7,dt);
  breed(a,dt,se<2);
}
function pickPerch(a){
  let cand=null,cn=0,inf=null,near=null,nd=1e9;
  for(let n=0;n<40;n++){const t=trees[(Math.random()*trees.length)|0];if(!t||t.dead||t.size<.3)continue;const d=Math.hypot(t.x-a.x,t.y-a.y);
    if(d<nd){nd=d;near=t;}if(d>24)continue;
    if(t.pest>0&&!inf)inf=t;if(!cand||Math.random()<1/(++cn))cand=t;}
  const t=inf&&Math.random()<.6?inf:(cand||near);
  if(t){a.tree=t.id;a.tx=t.x+.5+t.jx;a.ty=t.y+.5+t.jy;}else{a.tree=-1;a.tx=clamp(a.x+rand(-15,15),1,GW-2);a.ty=clamp(a.y+rand(-10,10),1,GH-2);}
}
function upBird(a,dt,se){
  a.energy-=AT.bird.drain*(trees.length<6?3:1)*(se===3?1.1:1)*dt;a.note=Math.max(0,a.note-dt);
  if(a.state==='perch'){const k=treeAt[cellAt(a.x,a.y)],t=k>=0?trees[k]:null;
    if(!t||t.dead){a.state='';pickPerch(a);return;}
    if(t.pest>0){t.guard=12;a.energy+=.06*dt*(a.kind==='pecker'?1.5:1);G.eaten+=.05*dt;}
    if(t.size>.3)a.energy+=(se===3?.03:.05)*dt;
    a.t-=dt;if(a.t<=0){if(t.size>.6&&Math.random()<.3)a.carry=t.sp;a.state='fly';pickPerch(a);}
  }else{
    const left=moveTo(a,7,dt,true);
    if(left<.15){if(a.carry){dropSeed(a.carry,a.x+gauss()*2,a.y+gauss()*2,.45);a.carry=null;}
      const k=treeAt[cellAt(a.x,a.y)];if(k>=0&&!trees[k].dead){a.state='perch';a.t=rand(2,7);}else pickPerch(a);}
  }
  breed(a,dt,se<2&&counts.bird<trees.length/5);
}
function damLevel(d){return L.h[d.y*GW+d.x]+.03+d.r*.012;}
function growPond(d){
  const nr=Math.min(8,Math.floor(d.sticks/4));if(nr<=d.r)return;d.r=nr;const lvl=damLevel(d);let made=0;
  for(let dy=-d.r;dy<=d.r;dy++)for(let dx=-d.r;dx<=d.r;dx++){if(dx*dx+dy*dy>d.r*d.r)continue;const c=cellAt(d.x+dx,d.y+dy);if(c<0||L.pond[c]||L.rock[c]>0)continue;
    if(L.h[c]<lvl){L.pond[c]=2;L.water[c]=1;L.grass[c]=0;L.flower[c]=0;made++;const k=treeAt[c];if(k>=0&&trees[k].sp!=='willow')killTree(trees[k],'drown');}}
  if(made){LAND-=made;log(`비버 댐이 물을 막아 연못이 ${made}칸 넓어졌다.`,'good');}
  let pc=0;for(let i=0;i<NC;i++)if(L.pond[i]===2)pc++;if(pc>=8)ms('pond','비버 댐이 강을 막아 연못이 생겼다. 물가 땅이 촉촉해진다.');
}
function upBeaver(a,dt,se){
  a.energy-=AT.beaver.drain*dt;
  if(a.dam<0||!dams[a.dam]){
    let bi=-1,bd=16;dams.forEach((d,k)=>{const dd=Math.hypot(d.x-a.x,d.y-a.y);if(dd<bd){bd=dd;bi=k;}});
    if(bi>=0)a.dam=bi;else{let best=null,bdd=10;for(let n=0;n<160;n++){const x=Math.floor(a.x+rand(-10,10)),y=Math.floor(a.y+rand(-10,10)),c=cellAt(x,y);if(c>=0&&L.pond[c]===1){const dd=Math.hypot(x-a.x,y-a.y);if(dd<bdd){bdd=dd;best=[x,y];}}}
      if(best){dams.push({x:best[0],y:best[1],sticks:0,r:0});a.dam=dams.length-1;}else{a.tx=a.x+rand(-3,3);a.ty=a.y+rand(-3,3);moveTo(a,1.4,dt,true);return;}}
  }
  const d=dams[a.dam],swim=true;
  if(a.state==='chew'){a.t-=dt;const k=treeAt[cellAt(a.tx,a.ty)];const t=k>=0?trees[k]:null;
    if(!t||t.dead){a.state='';return;}
    if(a.t<=0){killTree(t,'beaver');a.carry=true;a.energy+=.6;a.state='home';a.tx=d.x+.5;a.ty=d.y+.5;}return;}
  if(a.state==='home'){const left=moveTo(a,1.6,dt,swim);if(left<.3){a.carry=null;d.sticks++;a.state='';growPond(d);}return;}
  if(a.state==='go'){const left=moveTo(a,1.5,dt,swim);if(left<.4){a.state='chew';a.t=rand(3,5);}return;}
  if(L.pond[cellAt(a.x,a.y)]&&se!==3)a.energy+=.012*dt;
  a.t-=dt;if(a.t>0){if(Math.hypot(a.tx-a.x,a.ty-a.y)<.2){a.tx=d.x+.5+rand(-3,3);a.ty=d.y+.5+rand(-2,2);}moveTo(a,.9,dt,swim);return;}
  a.t=rand(2,5);
  let best=null,bs=-1;for(let dy=-11;dy<=11;dy++)for(let dx=-11;dx<=11;dx++){const c=cellAt(d.x+dx,d.y+dy);if(c<0)continue;const k=treeAt[c];if(k<0)continue;const t=trees[k];if(t.dead||t.size<.2||t.first)continue;
    const s=(t.sp==='willow'||t.sp==='birch'?2:1)*t.size-Math.hypot(dx,dy)*.05;if(s>bs){bs=s;best=t;}}
  if(best){a.state='go';a.tx=best.x+.5;a.ty=best.y+.5;}
  breed(a,dt,se<2&&d.sticks>=10);
}

function stepAnimals(dt,se){
  for(let k=0;k<animals.length;k++){const a=animals[k];if(a.dead)continue;a.age+=dt;
    if(a.type==='rabbit')upRabbit(a,dt,se);else if(a.type==='deer')upDeer(a,dt,se);else if(a.type==='fox')upFox(a,dt,se);else if(a.type==='bird')upBird(a,dt,se);else upBeaver(a,dt,se);
    if(a.energy>2.2)a.energy=2.2;
    if(a.energy<=0||a.age>a.life)die(a);}
}

/* ====================== 날씨 ====================== */
let rainNow=0;
function stepWeather(dt,se,green){
  if(Math.random()<dt/40)G.wind=clamp(G.wind+rand(-.4,.4),.5,1.8);
  const chance=(.035+green*.09)*SEASONS[se].rain;
  if(clouds.length<9&&Math.random()<chance*dt){const r=rand(6,14);clouds.push({x:-r-2,y:rand(4,GH-4),r,rain:Math.random()<.32+green*.4,vy:rand(-.15,.15),seed:Math.random()*1000});}
  rainNow=0;
  for(const c of clouds){c.x+=G.wind*dt;c.y+=c.vy*dt;if(c.rain){addRain(c.x,c.y,c.r,.16*dt);rainNow+=c.r/30;}}
  clouds=clouds.filter(c=>c.x<GW+c.r+3);
}

const MILESTONES=[

let logDirty=true,toastT=0;
function josa(w,a,b){const c=w.charCodeAt(w.length-1)-44032;return w+(c>=0&&c<11172&&c%28?a:b);}
function stamp(){const se=season();return `${year()}년 ${SEASONS[se].n}`;}
function log(t,k){G.log.unshift({t,k:k||'',d:stamp()});if(G.log.length>120)G.log.length=120;logDirty=true;}

const warnAt={};
function warn(key,text,cool){if(warnAt[key]!=null&&G.time-warnAt[key]<(cool||180))return;warnAt[key]=G.time;log(text,'bad');}

const C={};
function census(){
  let grassC=0,green=0,forest=0,wsum=0,fl=0,li=0;
  for(let i=0;i<NC;i++){if(L.pond[i])continue;const g=L.grass[i]>.3,cv=L.cover[i]>.45;if(g)grassC++;if(g||cv)green++;if(cv)forest++;wsum+=L.water[i];if(L.flower[i]>.2)fl++;if(L.lichen[i]>0)li++;}
  let big=0,inf=0,spSet={},summit=false,full=false;
  for(const t of trees){if(t.dead)continue;if(t.size>.3){big++;spSet[t.sp]=1;}if(t.pest>0)inf++;if(t.size>.95)full=true;if(t.size>.5&&L.h[t.y*GW+t.x]>.62)summit=true;}
  C.trees=trees.length;C.big=big;C.inf=inf;C.grassPct=grassC/LAND;C.green=green/LAND;C.forest=forest/LAND;C.water=wsum/LAND;C.flower=fl;C.lichen=li;
  for(const k of ATK)C[k]=counts[k];
  C.div=(li>0?1:0)+(grassC>20?1:0)+(fl>10?1:0)+Object.keys(spSet).length+ATK.filter(k=>counts[k]>0).length;
  if(crumbled>0)ms('moss','이끼가 처음으로 바위를 흙으로 바꿨다. 돌 틈에서 흙냄새가 난다.');
  if(grassC>=400)ms('meadow','산자락에 풀밭이 펼쳐졌다.');
  if(full)ms('grown','첫 나무가 다 자라 산에 그늘을 드리웠다.');
  if(big>=60)ms('grove','나무 예순 그루, 작은 숲이 생겼다.');
  if(counts.bird>0)ms('song','숲에 첫 새소리가 울렸다.');
  if(summit)ms('summit','민둥산 꼭대기에 나무가 섰다.');
  if(G.eaten>=5)ms('balance','새들이 병든 나무의 벌레를 쪼아 번지는 것을 막기 시작했다. 숲이 스스로를 지킨다.');
  if(C.div>=10)ms('diverse','열 가지 넘는 생명이 어울려 산다.');
  if(C.green>=.7)ms('forest','민둥산이 푸른 산이 되었다.');
  const se=season();
  if(counts.rabbit>80&&C.grassPct<.12)warn('rabbit','토끼가 풀을 다 먹어 치우고 있어요. 여우가 있으면 균형이 잡혀요.');
  if(C.trees>25&&C.inf/C.trees>.2)warn('pest','병이 숲에 번지고 있어요. 병든 나무는 살릴 수 없어요. 새를 부르거나, 병든 나무를 일찍 베어 번지는 걸 막으세요. 같은 나무만 모여 있으면 더 잘 번져요.');
  if(G.pestDead>0&&G.time-(G.pestLogT||-99)>40){log(`병든 나무 ${G.pestDead}그루가 쓰러졌다. 그루터기 자리엔 다른 종류의 나무를 심어 보세요.`,'bad');G.pestDead=0;G.pestLogT=G.time;}
  for(const k in G.blight)if(G.time-G.blight[k].at>BLIGHT_LEN)delete G.blight[k];
  if(se===1&&C.water<.2&&C.trees>5)warn('dry','여름 가뭄이에요. 땅이 메말라 나무가 시들어요.',240);
  if(counts.deer>30&&C.grassPct<.1)warn('deer','사슴이 너무 많아 어린나무까지 뜯어 먹고 있어요.');
  for(const k of ATK){if(G.alive[k]&&counts[k]===0)log(`마지막 ${josa(AT[k].n,'이','가')} 사라졌다.`,'bad');G.alive[k]=counts[k]>0;}
  const hk={trees:C.big,grass:Math.round(C.grassPct*100),rabbit:counts.rabbit,deer:counts.deer,fox:counts.fox,bird:counts.bird,beaver:counts.beaver,pest:C.inf};
  for(const k in hk){const h=G.hist[k]||(G.hist[k]=[]);h.push(hk[k]);if(h.length>120)h.shift();}
}
function maxEnergy(){return 120+(C.div||0)*10;}

let censusT=0,coverT=0;
function step(dt){
  const se=season(),before=se;
  G.time+=dt;
  stepWeather(dt,se,C.green||0);
  stepWater(dt,se);
  stepCells(dt,se);
  stepTrees(dt,se);
  stepAnimals(dt,se);
  for(const l of logs)l.t+=dt;logs=logs.filter(l=>l.t<150);
  compact();
  coverT+=dt;if(coverT>.5){coverT=0;computeCover();}
  G.energy=Math.min(maxEnergy(),G.energy+(.5+C.big*.004+(C.div||0)*.1)*dt);
  censusT+=dt;if(censusT>1.5){censusT=0;census();}
  if(season()!==before){const s=season();banner={s,t:4};
    if(s===0&&G.dormant.length){let ok=0;const ds=G.dormant;G.dormant=[];for(const d of ds)if(dropSeed(SPK[d[0]],d[1],d[2],Math.max(.85,d[3]),true)==='ok')ok++;if(ok)log(`겨울에 뿌린 씨앗 ${ok}개가 싹을 틔웠다.`,'good');}
    const txt=['눈이 녹고 봄이 왔다. 풀과 나무가 깨어난다.','여름이다. 햇살이 강하고 땅이 빨리 마른다.','가을이다. 잎이 물들고 나무들이 씨앗을 떨군다.','겨울이다. 모든 것이 잠든다. 동물들은 배고픔을 견뎌야 한다.'][s];
    log(s===0?`${year()}년째 봄. `+txt:txt,'');if(s===3||s===0)computeCover();}
}

  if(tool==='rain'){if(!spend(3*dt))return false;addRain(cx,cy,brush*2.2,.6*dt);godRain={x:cx,y:cy,r:brush*2.2};return true;}

      const ok=why.ok||0;if(ok)fx(`${SP[seedK].n} 싹`,'#cfe3ad',cx*CS,cy*CS-8);else{const bad=Object.keys(why).sort((a,b)=>why[b]-why[a])[0];fx({'메마름':'너무 메말라요','척박':'흙이 척박해요','바위':'바위라 안 돼요','물':'물 위예요','자리':'자리가 없어요','그늘':'너무 그늘져요','안맞음':'땅이 안 맞아요','실패':'싹이 안 텄어요','병든 자리':'같은 나무는 병이 남아 못 자라요','잠듦':'겨울잠, 봄에 싹터요'}[bad]||'안 됐어요',bad==='잠듦'?'#cfe3ad':'#f0a89c',cx*CS,cy*CS-8);}
    }else{let n=0;forBrush(cx,cy,r,i=>{if(L.pond[i])return;

      if(seedK==='grass'&&L.rock[i]===0&&L.grass[i]<.06&&Math.random()<.5){L.grass[i]=.06;n++;}

    for(let k=0;k<(reduceMotion?1:4);k++)parts.push({x:(cx+rand(-r,r))*CS,y:(cy+rand(-r,r))*CS-14,vx:rand(-.3,.3),vy:rand(.4,.9),c:S.c,l:20});

    const s=AC.createBufferSource();s.buffer=buf;s.loop=true;const f=AC.createBiquadFilter();f.type=cut?'highpass':'lowpass';f.frequency.value=cut?1800:800;const g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(master);s.start();return g;};

const KEY='mindungsan-genesis-v1';

function packF(a){const u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=Math.round(clamp(a[i],0,1)*255);return b64(u);}
function unpackF(str,a){const u=unb64(str);for(let i=0;i<a.length;i++)a[i]=u[i]/255;}
function save(){if(!G||!G.started)return;try{
  const data={G,crumbled,uid,layers:{rock:packF(L.rock),soil:packF(L.soil),water:packF(L.water),grass:packF(L.grass),flower:packF(L.flower),lichen:packF(L.lichen)},pond:b64(L.pond),
    trees:trees.map(t=>[t.x,t.y,SPK.indexOf(t.sp),+t.size.toFixed(3),Math.round(t.age),+t.hp.toFixed(2),+t.pest.toFixed(2),t.first?1:0,Math.round(t.life),+t.doom.toFixed(1),+t.doomMax.toFixed(1)]),
    animals:animals.filter(a=>!a.dead).map(a=>[ATK.indexOf(a.type),+a.x.toFixed(1),+a.y.toFixed(1),+a.energy.toFixed(2),Math.round(a.age),Math.round(a.life),BIRDK.indexOf(a.kind),a.dam]),
    dams,logs:logs.map(l=>[+l.x.toFixed(1),+l.y.toFixed(1),+l.size.toFixed(2),Math.round(l.t),+l.a.toFixed(2)])};
  localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return false;const d=JSON.parse(s);if(!d.G||d.G.v!==1)return false;
  G=d.G;if(!G.blight)G.blight={};if(!G.dormant)G.dormant=[];if(G.pestDead==null)G.pestDead=0;genWorld(G.seed);for(const k in d.layers)unpackF(d.layers[k],L[k]);const pu=unb64(d.pond);for(let i=0;i<NC;i++)L.pond[i]=pu[i];
  LAND=0;for(let i=0;i<NC;i++)if(!L.pond[i])LAND++;
  crumbled=d.crumbled||0;uid=d.uid||1;trees=[];treeAt.fill(-1);
  for(const r of d.trees){const t=addTree(SPK[r[2]],r[0],r[1],r[3],!!r[7]);t.age=r[4];t.hp=r[5];t.pest=r[6];t.life=r[8];t.doom=r[9]||0;t.doomMax=r[10]||0;if(t.pest>0&&!t.doomMax)t.doomMax=t.doom=DOOM[t.sp];}

  dams=d.dams||[];logs=(d.logs||[]).map(r=>({x:r[0],y:r[1],size:r[2],t:r[3],a:r[4]}));
  rebuildOcc();computeCover();return true;}catch(e){return false;}}

/* ====================== 모달 · 시작 ====================== */
function openModal(h){$('card').innerHTML=h;$('modal').hidden=false;const b=$('card').querySelector('.primary');b&&b.focus();}
function closeModal(){$('modal').hidden=true;}
$('card').addEventListener('click',e=>{const b=e.target.closest('[data-start]');if(b){G.started=true;closeModal();if(b.dataset.start==='sound')setSound(true);renderTools();save();}});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&G.started)closeModal();});
function showIntro(){openModal(`<h3>민둥산 창세기</h3>
<p>오래전 숲이 사라진 산. 남은 것은 바위와 마른 흙, 산 아래 흐르는 강, 그리고 강가에 돋은 묘목 하나.</p>
<p>너는 이 산의 신이다. 모든 것은 눈앞에서 실시간으로 자라고, 먹고, 번지고, 죽는다.</p>
<ul>
<li><b>비</b>를 내려 땅을 적시고, <b>이끼</b>로 바위를 흙으로 바꾸고, <b>풀씨</b>와 <b>나무</b>를 뿌려요.</li>
<li>나무가 자라면 스스로 씨앗을 날려 숲이 번져요. 같은 나무만 모이면 <b>병충해</b>가 퍼져요. 병든 나무는 낫지 않고, 남은 날이 지나면 쓰러져요. 그 자리엔 <b>다른 나무</b>를 심어야 해요.</li>
<li><b>계절</b>마다 할 수 있는 일이 달라요. 봄엔 싹이 잘 트고, 여름엔 벌레가 많고, 가을엔 씨앗이 떨어지고, 겨울에 뿌린 씨앗은 봄에 깨어나요.</li>
<li><b>생명</b>을 보내 보세요. 토끼는 풀을, 여우는 토끼를, 새는 벌레를 먹고, 비버는 강을 막아 연못을 만들어요.</li>
<li>살아 있는 것이 다양할수록 <b>신력</b>이 빨리 차요.</li>
<li>휠이나 두 손가락, 오른쪽 아래 버튼으로 확대해 가까이 지켜볼 수 있어요.</li>
</ul>
<div class="row"><button class="ghost" data-start="quiet">조용히 시작</button><button class="primary" data-start="sound">자연의 소리와 함께</button></div>`);}
let armed=false,armT;
$('reset').addEventListener('click',()=>{const b=$('reset');
  if(!armed){armed=true;b.textContent='정말 새 세상을?';b.classList.add('warn');clearTimeout(armT);armT=setTimeout(()=>{armed=false;b.textContent='새 세상';b.classList.remove('warn')},3000);return;}
  armed=false;b.textContent='새 세상';b.classList.remove('warn');const snd=G.sound;fresh(Math.floor(Math.random()*1e6));G.sound=snd;G.started=true;
  for(const k of ATK)counts[k]=0;census();log('새로운 민둥산이 생겨났다. 강가에 묘목 하나.','story');sel=null;cam.x=cam.y=0;cam.z=1;renderTools();save();});
$('snd').addEventListener('click',()=>setSound(!G.sound));

/* ====================== 루프 ====================== */
let last=performance.now(),acc=0,uiT=0,saveT=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
  if(G.started&&G.speed>0&&!document.hidden){
    acc+=rdt*G.speed;
    if(drag&&drag.tool&&['rain','seed','rock','cut'].includes(tool)){toolAcc+=rdt;const every=tool==='rain'?0:tool==='seed'?.12:.25;
      if(tool==='rain')useTool(drag.x,drag.y,false,rdt);else if(toolAcc>=every){toolAcc=0;useTool(drag.x,drag.y,false,every);}}
    let n=0;while(acc>=.1&&n<3){const d=Math.min(.5,acc);step(d);acc-=d;n++;}
    if(acc>2)acc=0;
  }else if(G.started&&drag&&drag.tool&&tool==='rain')useTool(drag.x,drag.y,false,rdt);
  // 새소리
  if(G.started&&G.speed>0){songT-=rdt;if(songT<=0){const bs=animals.filter(a=>a.type==='bird'&&!a.dead);
    if(bs.length){const b=bs[(Math.random()*bs.length)|0];b.note=1.2;sing(b.kind);}songT=bs.length?rand(2.5,8)/Math.pow(bs.length,.3):3;}}
  if(G.sound&&AC&&rainG){rainG.gain.setTargetAtTime(Math.min(.14,rainNow*.05+(godRain?.08:0)),AC.currentTime,.4);}
  stepAmbient(rdt);if(banner&&banner.t>0)banner.t-=rdt;
  frameDraw(t);
  if(toastT>0){toastT-=rdt;if(toastT<=0)$('toast').style.opacity=0;}
  if(infoLock>0)infoLock-=rdt;
  uiT+=rdt;if(uiT>.5){uiT=0;renderPanels();updateHint(false);}
  saveT+=rdt;if(saveT>20){saveT=0;save();}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();last=performance.now();});
window.addEventListener('pagehide',save);

if(!load()){fresh(Math.floor(Math.random()*1e6));log('바람이 멎은 새벽, 민둥산 강가 바위틈에서 묘목 하나가 고개를 들었다.','story');census();showIntro();}
else{census();for(const k of ATK)G.alive[k]=counts[k]>0;if(G.sound){$('snd').textContent='소리 끄기';$('snd').classList.add('on');const once=()=>{setSound(true);window.removeEventListener('pointerdown',once,true);};window.addEventListener('pointerdown',once,true);}}
if(location.hash==='#debug')window.__eco={infect,get G(){return G},L,get trees(){return trees},get animals(){return animals},step,census,counts,spawnAnimal,dropSeed,addRain,get C(){return C}};
resize();renderTools();renderPanels();updateHint(true);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
