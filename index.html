<meta charset="utf-8">
<title>뿌리 아래로</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&display=swap">
<style>
/* 레이아웃: 화면 가운데에 픽셀 게임 화면 하나, 아래에 조작 안내. 게임 세계에 맞춘 어두운 단일 테마 */
:root {
  --night: #0b1517;
  --moss: #79b85d;
  --moss-dim: #3f6b40;
  --sap: #e9d78a;
  --ink: #d8e4d4;
  --ink-dim: #8aa293;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--sans);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
#wrap { position: relative; max-width: 100%; }
#wrap:fullscreen { display: flex; align-items: center; justify-content: center; background: #000; max-width: none; }
canvas { display: block; aspect-ratio: 16 / 9; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; max-width: 100%; }
#stage { position: relative; outline: 2px solid var(--moss-dim); }
#c { position: relative; }
/* 3D 배경 캔버스: 게임 캔버스 바로 뒤에 같은 크기로 겹침 */
#c3 { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#stage:focus-within { outline-color: var(--moss); }
canvas:focus-visible { outline: none; }
#banner {
  position: absolute; left: 0; right: 0; top: 14%; text-align: center; pointer-events: none;
  font-weight: 800; letter-spacing: 0.08em; color: var(--ink); text-shadow: 0 2px 0 #000;
  opacity: 0; transition: opacity .5s;
}
#banner small { display: block; font-weight: 500; color: var(--ink-dim); font-size: 0.6em; letter-spacing: 0.2em; }
#overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: rgba(8, 16, 14, 0.78); text-align: center;
}
#overlay h1 { margin: 0; font-size: clamp(22px, 4vw, 38px); font-weight: 800; letter-spacing: 0.04em; color: var(--sap); text-wrap: balance; }
#overlay p { margin: 0; color: var(--ink-dim); max-width: 34ch; line-height: 1.6; }
#overlay[hidden] { display: none !important; }
#err { color: #e9a08a; font-size: 12px; max-width: 40ch; word-break: break-all; }
#overlay button {
  font: inherit; font-weight: 800; padding: 10px 22px; border: 2px solid var(--moss); background: var(--moss-dim); color: var(--ink); cursor: pointer;
}
#overlay button:hover { background: var(--moss); color: var(--night); }
#overlay button:focus-visible { outline: 2px solid var(--sap); outline-offset: 3px; }
#death {
  --term: #7dfbc0; --term-dim: #3f9a78; --term-red: #ff6a5a;
  position: absolute; inset: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center;
  padding: 4% 7%; box-sizing: border-box;
  background: rgba(3, 9, 7, 0.93); color: var(--term);
  font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", "Noto Sans KR", monospace;
  font-size: clamp(11px, 1.55vw, 18px); line-height: 1.55; text-shadow: 0 0 6px rgba(125, 251, 192, 0.55);
  animation: termOn .35s steps(6) both, termFlicker 4s infinite;
}
#death[hidden] { display: none !important; }
/* CRT 주사선 + 가장자리 어둡게 */
#death::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.28) 2px 3px),
              radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
}
#term { margin: 0; white-space: pre-wrap; font: inherit; }
#term .dim { color: var(--term-dim); text-shadow: none; }
#term .lost { color: var(--term-red); text-shadow: 0 0 6px rgba(255, 106, 90, 0.6); animation: termBlink 0.9s steps(2) infinite; }
#term .cur { animation: termBlink 1s steps(2) infinite; }
#termCmds { display: flex; flex-wrap: wrap; gap: 0.4em 2em; margin-top: 0.6em; }
#termCmds[hidden] { display: none; }
.tbtn { font: inherit; color: var(--term); background: none; border: none; padding: 0.1em 0.3em; margin-left: -0.3em; cursor: pointer; text-shadow: inherit; }
.tbtn:hover, .tbtn:focus-visible { background: var(--term); color: #031009; text-shadow: none; outline: none; }
@keyframes termOn { from { transform: scaleY(0.02); filter: brightness(3); } to { transform: none; filter: none; } }
@keyframes termFlicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: 0.85; } 98% { opacity: 1; } 99% { opacity: 0.9; } }
@keyframes termBlink { to { visibility: hidden; } }
#keys { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; color: var(--ink-dim); font-size: 13px; }
#keys b { color: var(--ink); font-weight: 800; }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="c3" width="640" height="360" aria-hidden="true"></canvas>
    <canvas id="c" width="640" height="360" tabindex="0" aria-label="게임 화면"></canvas>
  </div>
  <div id="banner"></div>
  <div id="overlay">
    <h1>뿌리 아래로</h1>
    <p>식물이 삼킨 도시. 덩굴과 씨앗으로 길을 열어, 온실 깊은 곳의 세계수 씨앗까지 가세요.</p>
    <button id="start" type="button">시작 (Enter)</button>
    <p id="err" hidden></p>
  </div>
  <!-- 쓰러졌을 때 화면: 방독 마을 관제 단말기(BANGDOK-OS)가 모스의 신호가 끊긴 것을 한 줄씩 기록 (CMD 화면 느낌) -->
  <div id="death" hidden role="dialog" aria-label="쓰러짐 기록">
    <pre id="term"></pre>
    <div id="termCmds" hidden>
      <button id="respawn" class="tbtn" type="button">[Enter] 다시 일어나기</button>
      <button id="restartBtn" class="tbtn" type="button">[R] 처음부터</button>
    </div>
  </div>
</div>
<div id="keys">
  <span><b>A D</b> 이동</span>
  <span><b>W · Space</b> 점프</span>
  <span><b>왼쪽 클릭</b> 무기</span>
  <span><b>오른쪽 클릭</b> 기술 1 (처음: 덩굴 갈고리)</span>
  <span><b>E · Shift</b> 기술 2 (처음: 씨앗 순간이동)</span>
  <span><b>Tab</b> 가방 (장착 바꾸기)</span>
  <span><b>F</b> 전체 화면</span>
</div>

<script>
(() => {
// 게임 논리는 320×180 화면·16px 타일 단위. 그리기만 RS배(640×360)로 해서 주인공 도트를 제 해상도로 그림
const VW = 320, VH = 180, T = 16, RS = 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const bannerEl = document.getElementById('banner');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');

// ---------- 화면 크기: 창(또는 전체 화면)에 꽉 맞춤, 16:9 유지 ----------
const wrapEl = document.getElementById('wrap');
function fit() {
  const full = document.fullscreenElement === wrapEl;
  const bs = getComputedStyle(document.body);
  const padX = parseFloat(bs.paddingLeft) + parseFloat(bs.paddingRight);
  const keysH = document.getElementById('keys').offsetHeight + 36;   // 아래 조작 안내 + 여백
  const availW = full ? window.innerWidth : document.body.clientWidth - padX;
  const availH = full ? window.innerHeight : window.innerHeight - keysH;
  const s = Math.max(0.25, Math.min(availW / VW, availH / VH));
  cv.style.width = Math.floor(VW * s) + 'px';
  bannerEl.style.fontSize = Math.max(14, 7 * s) + 'px';
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (wrapEl.requestFullscreen) wrapEl.requestFullscreen().catch(() => {});
}
document.addEventListener('fullscreenchange', fit);
window.addEventListener('resize', fit); fit();

// ---------- 맵 ----------
const W = 96, H = 56;
let map;
function buildMap() {
  map = [];
  for (let y = 0; y < H; y++) map.push(new Array(W).fill('#'));
  const carve = (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) map[j][i] = '.'; };
  const plat = (x, y, w, c = '#') => { for (let i = x; i < x + w; i++) map[y][i] = c; };
  // 1. 이끼 덮인 지하철
  carve(2, 40, 34, 12);
  plat(10, 48, 4); plat(19, 45, 5); plat(27, 48, 4);
  for (let y = 40; y < 44; y++) { map[y][15] = '#'; map[y][24] = '#'; }
  // 2. 무너진 환기구 (세로 갱도)
  carve(36, 10, 10, 42);
  plat(36, 47, 3); plat(43, 43, 3); plat(36, 39, 3); plat(43, 35, 3);
  plat(36, 31, 3); plat(43, 27, 3); plat(36, 23, 3); plat(43, 19, 3);
  plat(41, 51, 5, '^');
  // 3. 가시덤불 도심 (윗길)
  carve(46, 10, 34, 8);
  plat(52, 17, 4, '^'); plat(64, 17, 4, '^'); plat(73, 17, 2, '^');
  plat(57, 13, 2); plat(69, 14, 2);
  // 4. 식충식물 온실 (아래로)
  carve(80, 10, 14, 40);
  plat(80, 18, 4); plat(88, 22, 4); plat(82, 28, 4); plat(88, 34, 4); plat(81, 40, 4);
  plat(84, 49, 3, '^');
}
const SPAWNS = [
  { t: 'blob', x: 17, y: 51 }, { t: 'blob', x: 30, y: 51 },
  { t: 'flower', x: 44, y: 34 },
  { t: 'flower', x: 61, y: 17 }, { t: 'blob', x: 59, y: 17 }, { t: 'blob', x: 70, y: 17 },
  { t: 'flower', x: 83, y: 27 }, { t: 'flower', x: 89, y: 33 }, { t: 'blob', x: 89, y: 49 },
];
const CHECKS = [{ x: 4, y: 51 }, { x: 38, y: 51 }, { x: 47, y: 17 }, { x: 82, y: 17 }];
const GOAL = { x: 91, y: 49 };
const ZONES = [
  { until: 36, name: '이끼 덮인 지하철', sub: '1구역', base: '#4b5049', deep: '#1d2431', top: '#6aa13c' },
  { until: 46, name: '무너진 환기구', sub: '덩굴을 걸어 올라가세요', base: '#303c3f', deep: '#192124', top: '#5d9a4a' },
  { until: 80, name: '가시덤불 도심', sub: '2구역', base: '#3f3236', deep: '#21191c', top: '#6f8f3e' },
  { until: 99, name: '식충식물 온실', sub: '3구역', base: '#2e3a47', deep: '#171e26', top: '#4f9a6a' },
];
const zoneOf = tx => ZONES.find(z => tx < z.until) || ZONES[ZONES.length - 1];

const tileAt = (tx, ty) => (tx < 0 || ty < 0 || tx >= W || ty >= H) ? '#' : map[ty][tx];
const solidT = (tx, ty) => tileAt(tx, ty) === '#';
const solidP = (px, py) => solidT(Math.floor(px / T), Math.floor(py / T));
function hitBox(x, y, w, h, ch = '#') {
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.01) / T);
  const y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileAt(tx, ty) === ch) return true;
  return false;
}
function hash(x, y) {
  let n = (x * 374761393 + y * 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

// 축별 이동 + 충돌
function move(e, dt) {
  let dx = e.vx * dt, dy = e.vy * dt;
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6) || 1;
  dx /= steps; dy /= steps;
  e.onGround = false; e.hitWall = 0;
  for (let s = 0; s < steps; s++) {
    e.x += dx;
    if (hitBox(e.x, e.y, e.w, e.h)) {
      if (dx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w - 0.01;
      else e.x = (Math.floor(e.x / T) + 1) * T + 0.01;
      e.hitWall = Math.sign(dx); e.vx = 0; dx = 0;
    }
    e.y += dy;
    if (hitBox(e.x, e.y, e.w, e.h)) {
      if (dy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h - 0.01; e.onGround = true; }
      else e.y = (Math.floor(e.y / T) + 1) * T + 0.01;
      e.vy = 0; dy = 0;
    }
  }
  if (!e.onGround && e.vy >= 0 && hitBox(e.x, e.y + e.h + 0.5, e.w, 0.5)) e.onGround = true;
}

// ---------- 입력 ----------
const keys = {};
const mouse = { x: VW / 2, y: VH / 2, left: false, right: false, leftPressed: false };
let jumpPressed = false, seedPressed = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['w', ' ', 'arrowup'].includes(k) && !keys[k]) jumpPressed = true;
  if (['e', 'shift'].includes(k) && !keys[k]) seedPressed = true;
  if (k === 'r' && state === 'clear') start();
  if (k === 'f' && !e.repeat) toggleFullscreen();
  if (state === 'dead') {
    if (k === 'enter') { respawn(); e.preventDefault(); }
    if (k === 'r') restartFromDeath();
    return;
  }
  if (k === 'tab') { e.preventDefault(); if (state === 'play') openBag(); else if (state === 'bag') closeBag(); return; }
  if (state === 'bag') {
    if (k === 'escape') closeBag();
    if (k === '1' || k === '2') bag.sel = Number(k) - 1;
    return;
  }
  if ((k === 'enter' || (k === ' ' && state === 'title')) && (state === 'title' || state === 'clear')) { start(); e.preventDefault(); return; }
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.left = mouse.right = false; });
function mousePos(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * VW;
  mouse.y = (e.clientY - r.top) / r.height * VH;
}
cv.addEventListener('mousemove', mousePos);
cv.addEventListener('mousedown', e => {
  mousePos(e); cv.focus();
  if (state === 'bag') { bagClick(mouse.x, mouse.y); e.preventDefault(); return; }
  if (e.button === 0) { mouse.left = true; mouse.leftPressed = true; }
  if (e.button === 2) { mouse.right = true; mouse.rightPressed = true; }
  e.preventDefault();
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.left = false; if (e.button === 2) mouse.right = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
const held = (...ks) => ks.some(k => keys[k]);

// ---------- 상태 ----------
let state = 'title';
let P, enemies, bullets, parts, seed, hook, cam, checkpoint, activeChecks, timeRun, zoneName, bannerT, slashFx, shake;
let bag, pickups, pshots = [];

// ---------- 가방(인벤토리): 무기 1 + 기술 2 장착 (STORY.md: 식물에게서 빼앗은 기술 + 방독 마을의 도구 무기) ----------
const ITEMS = {
  whip: { kind: 'weapon', name: '화분 채찍', desc: '화분 식물의 덩굴로 넓게 휘두름. 공중에서 아래로 맞히면 튀어오름.', from: '처음부터' },
  sickle: { kind: 'weapon', name: '가지치기 낫', desc: '짧지만 빠름. 붙어서 연달아 베기 좋음.', from: '처음부터 (방독 마을의 도구)' },
  shotgun: { kind: 'weapon', name: '씨앗 산탄총', desc: '씨앗 세 발을 흩뿌림. 쏠 때 반동으로 살짝 밀림.', from: '지하철에서 주움' },
  hook: { kind: 'skill', name: '덩굴 갈고리', desc: '누르고 있으면 덩굴을 걸어 매달림. 적에게 쏘면 끌어당겨 피해.', from: '엉킴 어미 (1장)' },
  seed: { kind: 'skill', name: '씨앗 순간이동', desc: '씨앗을 던지고, 한 번 더 누르면 싹튼 자리로 이동. 적에게 박히면 피해 2.', from: '화분 식물' },
  thorn: { kind: 'skill', name: '가시 갑옷', desc: '1.2초 동안 가시를 둘러 무적, 닿은 적에게 피해. 재사용 4초.', from: '가시 왕관 (2장)' },
  swallow: { kind: 'skill', name: '삼켜 뱉기', desc: '0.8초 동안 주변 적 탄을 화분이 삼켰다가 조준 방향으로 되쏨. 재사용 3초.', from: '여왕 파리지옥 (3장)' },
};
const WEAPON_LIST = ['whip', 'sickle', 'shotgun'], SKILL_LIST = ['hook', 'seed', 'thorn', 'swallow'];
const WEAPONS = {
  whip: { cd: 0.28, reach: 12, r: 16, knock: 120, anim: 0.3, pogo: true },
  sickle: { cd: 0.15, reach: 8, r: 11, knock: 60, anim: 0.18 },
  shotgun: { cd: 0.6, anim: 0.16 },
};
const SKILL_CD = { thorn: 4, swallow: 3 };
// 줍는 아이템 (보스가 생기기 전까지 임시: 구역마다 하나)
const PICKUPS = [{ id: 'shotgun', x: 21, y: 44 }, { id: 'thorn', x: 57, y: 12 }, { id: 'swallow', x: 89, y: 33 }];
function newBag() { return { owned: new Set(['whip', 'sickle', 'hook', 'seed']), weapon: 'whip', skills: ['hook', 'seed'], sel: 0, hover: null }; }
function openBag() { state = 'bag'; bag.hover = null; mouse.left = mouse.right = false; }
function closeBag() { state = 'play'; acc = 0; }
let bagHits = [];
function bagClick(x, y) {
  const h = bagHits.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h);
  if (!h) return;
  if (h.slot !== undefined) { bag.sel = h.slot; return; }
  if (h.close) { closeBag(); return; }
  const id = h.item;
  if (!bag.owned.has(id)) return;
  if (ITEMS[id].kind === 'weapon') { bag.weapon = id; return; }
  const other = bag.skills.indexOf(id);
  if (other >= 0 && other !== bag.sel) bag.skills[other] = bag.skills[bag.sel];   // 다른 칸에 있으면 서로 바꿈
  bag.skills[bag.sel] = id;
  if (!bag.skills.includes('hook')) hook = null;
  if (!bag.skills.includes('seed')) seed = null;
}

function spawnEnemies() {
  enemies = SPAWNS.map(s => {
    const e = s.t === 'blob'
      ? { t: 'blob', w: 14, h: 15, hp: 3, vx: 32 * (hash(s.x, s.y) < 0.5 ? -1 : 1), vy: 0, atkCd: 1, atkT: 9, face: 1 }
      : { t: 'flower', w: 14, h: 20, hp: 2, vx: 0, vy: 0, cd: 1 + hash(s.x, 1) * 1.5, open: 0, atkT: 9, face: -1 };
    e.x = s.x * T + (T - e.w) / 2; e.y = (s.y + 1) * T - e.h - 0.01;
    e.flash = 0; e.stun = 0;
    return e;
  });
}
function placePlayerAt(c) {
  P.x = c.x * T + 4; P.y = (c.y + 1) * T - P.h - 0.01; P.vx = P.vy = 0;
  P.safe = { x: P.x, y: P.y };
}
function restart() {
  buildMap();
  P = { x: 0, y: 0, w: 8, h: 19, vx: 0, vy: 0, face: 1, hp: 100, maxHp: 100, hpLag: 100, inv: 0, coyote: 0, buffer: 0, slashCd: 0, seedCd: 0, anim: 0, onGround: false, safe: null, act: null, walkT: 0, landT: 0 };
  checkpoint = CHECKS[0]; activeChecks = new Set([0]);
  placePlayerAt(checkpoint);
  // 개발용: 주소 끝에 ?at=타일x,타일y 를 붙이면 그 칸에서 시작 (예: ?at=50,16)
  const at = new URLSearchParams(location.search).get('at');
  if (at) { const [ax, ay] = at.split(',').map(Number); if (ax >= 0 && ay >= 0) placePlayerAt({ x: ax, y: ay }); }
  spawnEnemies();
  bullets = []; parts = []; seed = null; hook = null; slashFx = null; shake = 0;

    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (solidP(b.x, b.y)) b.life = 0;
    if (b.x > P.x && b.x < P.x + P.w && b.y > P.y && b.y < P.y + P.h) { b.life = 0; hurt(b.x - b.vx, 15, 'bullet'); }
  }
  bullets = bullets.filter(b => b.life > 0);

  // 체크포인트 · 목표
  CHECKS.forEach((c, i) => {
    const cx = c.x * T + 8, cy = (c.y + 1) * T;
    if (Math.abs(P.x + P.w / 2 - cx) < 10 && Math.abs(P.y + P.h - cy) < 16 && checkpoint !== c) {
      checkpoint = c; activeChecks.add(i); P.hp = P.maxHp; burst(cx, cy - 8, '#e9d78a', 16, 90);
    }
  });
  if (Math.abs(P.x + P.w / 2 - (GOAL.x * T + 8)) < 12 && Math.abs(P.y + P.h / 2 - (GOAL.y * T + 8)) < 16) clear();

  // 파티클
  for (const p of parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (slashFx) { slashFx.t -= dt; if (slashFx.t <= 0) slashFx = null; }

  // 구역 안내
  const z = zoneOf(Math.floor((P.x + P.w / 2) / T));
  if (z !== zoneName) { zoneName = z; showBanner(z); }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) bannerEl.style.opacity = 0; }

  // 카메라
  const tx = P.x + P.w / 2 - VW / 2 + P.vx * 0.25, ty = P.y + P.h / 2 - VH / 2 + P.vy * 0.12;
  cam.x += (tx - cam.x) * Math.min(1, 7 * dt);
  cam.y += (ty - cam.y) * Math.min(1, 6 * dt);
  cam.x = Math.max(0, Math.min(W * T - VW, cam.x));
  cam.y = Math.max(0, Math.min(H * T - VH, cam.y));
  shake = Math.max(0, shake - 20 * dt);

  jumpPressed = seedPressed = false; mouse.leftPressed = mouse.rightPressed = false;
}

function teleportTo(x, y) {
  burst(P.x + P.w / 2, P.y + P.h / 2, '#8cc66a', 10, 70);
  const tries = [[0, 0], [0, -8], [0, -16], [-8, 0], [8, 0], [-8, -8], [8, -8], [0, 8], [-12, -12], [12, -12]];
  for (const [ox, oy] of tries) {
    const nx = x - P.w / 2 + ox, ny = y - P.h / 2 + oy;
    if (!hitBox(nx, ny, P.w, P.h)) { P.x = nx; P.y = ny; break; }
  }
  P.vx *= 0.3; P.vy = Math.min(P.vy, 0) * 0.3 - 60;
  hook = null;
  burst(P.x + P.w / 2, P.y + P.h / 2, '#c9e58a', 12, 90);
}

function clear() {
  state = 'clear';
  const s = timeRun.toFixed(1);
  overlay.innerHTML = `<h1>세계수 씨앗을 찾았어요</h1><p>걸린 시간 ${s}초. 다음 구역(균류 동굴, 세계수 뿌리 핵)은 아직 준비 중이에요.</p><button id="again" type="button">다시 하기 (R)</button>`;
  overlay.hidden = false; overlay.style.display = '';
  document.getElementById('again').addEventListener('click', start);
}

// ---------- 그리기 ----------
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

function drawBackground(cx, cy) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#10232a'); g.addColorStop(1, '#1a2e27');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // 먼 폐건물
  const px = cx * 0.18, py = cy * 0.1;
  for (let i = -1; i < 12; i++) {
    const idx = Math.floor(px / 40) + i;
    const bx = idx * 40 - px, hgt = 50 + hash(idx, 7) * 90, bw = 26 + hash(idx, 3) * 12;
    const by = 150 - hgt - py + 40;
    rect(bx, by, bw, VH, '#142a2d');
    for (let wy = by + 6; wy < VH; wy += 10) for (let wx = bx + 4; wx < bx + bw - 4; wx += 7)
      if (hash(Math.floor(wx + idx), Math.floor(wy)) < 0.12) rect(wx, wy, 3, 4, '#2c4a3f');
    if (hash(idx, 11) < 0.6) for (let k = 0; k < 4; k++) rect(bx + hash(idx, k) * bw, by, 2, 10 + hash(k, idx) * 30, '#1d3a2c');
  }
  // 거대한 뿌리
  const rx = cx * 0.42, ry = cy * 0.3;
  ctx.fillStyle = '#183127';
  for (let i = -1; i < 6; i++) {
    const idx = Math.floor(rx / 90) + i, base = idx * 90 - rx;
    for (let t = 0; t < 1; t += 0.02) {
      const x = base + Math.sin(t * 5 + idx) * 18 + t * 30, y = -20 + t * 260 - ry % 60;
      const r = 7 - t * 4;
      ctx.fillRect(Math.round(x - r), Math.round(y), Math.round(r * 2), 6);
    }
  }
  // 떠다니는 포자
  for (let i = 0; i < 26; i++) {
    const sx = (hash(i, 1) * 400 - cx * 0.6 + timeNow * 6 * (0.5 + hash(i, 2))) % 400;
    const sy = (hash(i, 3) * 220 - cy * 0.6 - timeNow * 4) % 220;
    rect((sx + 400) % 400 - 40, (sy + 220) % 220 - 20, 1, 1, hash(i, 4) < 0.5 ? '#9fc77a' : '#e9d78a');
  }
}

// ---------- HD-2D 3D 배경 (world3d.js, Three.js) ----------
// 모든 구역(지하철·환기구·가시덤불 도심·식충식물 온실)을 3D로. 3D를 못 쓰면 전부 2D
let w3 = null;
function init3D() {
  if (w3 || !window.WebGLRenderingContext) return;
  import('./world3d.js').then(m => {
    w3 = m.createWorld3D({ canvas: document.getElementById('c3'), tileAt, W, H, T, VW, VH, RS,
      tilesImg, backdropImg: ZONE_BGS[0].img, backdrop2Img: ZONE_BGS[1].img, backdrop3Img: ZONE_BGS[2].img, maxTx: W - 1 });
  }).catch(err => { console.warn('3D 배경을 못 불러와 2D로 그립니다:', err); });
}
// 세계 도트 (tools/art/make_world.py가 만듦). 게임 1px = 도트 2px (RS=2)
const tilesImg = new Image(), fxImg = new Image();
let tilesReady = false, fxReady = false;
tilesImg.onload = () => { tilesReady = true; init3D(); };
fxImg.onload = () => { fxReady = true; };
tilesImg.src = 'assets/world/tiles.png';
fxImg.src = 'assets/world/fx.png';
// tiles.png: 구역(줄)마다 0~2 돌 블록, 3 안쪽 블록, 4 이끼 윗면, 5~6 늘어진 덩굴, 7 가시덤불 (32×32 칸)
const tileSpr = (col, zi, x, y, h = 32) => ctx.drawImage(tilesImg, col * 32, zi * 32, 32, h, x, y, 16, h / 2);
function drawTilesArt(cx, cy, minTx = 0) {
  const x0 = Math.max(minTx, Math.floor(cx / T)), y0 = Math.floor(cy / T);
  const over = [];
  for (let ty = y0; ty <= y0 + 12; ty++) for (let tx = x0; tx <= x0 + 21; tx++) {
    const c = tileAt(tx, ty), sx = tx * T - cx, sy = ty * T - cy;
    const zi = ZONES.indexOf(zoneOf(tx));
    if (c === '#') {
      const inner = solidT(tx - 1, ty) && solidT(tx + 1, ty) && solidT(tx, ty - 1) && solidT(tx, ty + 1);
      tileSpr(inner ? 3 : Math.floor(hash(tx, ty) * 3), zi, sx, sy);
      if (!solidT(tx, ty - 1)) over.push([4, zi, sx, sy - 3, 16]);
      if (!solidT(tx, ty + 1) && tileAt(tx, ty + 1) !== '^' && hash(tx, ty + 99) < 0.35)
        over.push([5 + (hash(tx, ty + 7) < 0.5 ? 0 : 1), zi, sx, sy + T, 32]);
    } else if (c === '^') tileSpr(7, zi, sx, sy);
  }
  for (const [col, zi, x, y, h] of over) tileSpr(col, zi, x, y, h);   // 이끼·덩굴은 블록 위에 덮어 그림
}

function drawTiles(cx, cy, minTx = 0) {
  if (tilesReady) { drawTilesArt(cx, cy, minTx); return; }
  const x0 = Math.floor(cx / T), y0 = Math.floor(cy / T);
  for (let ty = y0; ty <= y0 + 12; ty++) for (let tx = x0; tx <= x0 + 21; tx++) {
    const c = tileAt(tx, ty), sx = tx * T - cx, sy = ty * T - cy;
    if (c === '#') {
      const z = zoneOf(tx);
      const inner = solidT(tx - 1, ty) && solidT(tx + 1, ty) && solidT(tx, ty - 1) && solidT(tx, ty + 1);
      rect(sx, sy, T, T, inner ? z.deep : z.base);
      if (!inner) {
        for (let k = 0; k < 3; k++) rect(sx + Math.floor(hash(tx * 3 + k, ty) * 14), sy + Math.floor(hash(tx, ty * 3 + k) * 14), 2, 1, z.deep);
        if (z.until === 80 && (ty + tx) % 2 === 0) rect(sx, sy + 7, T, 1, z.deep);
      }
      if (!solidT(tx, ty - 1)) {
        rect(sx, sy, T, 3, z.top);
        for (let k = 0; k < 16; k += 2) if (hash(tx * 16 + k, ty) < 0.4) rect(sx + k, sy + 3, 1, 1 + Math.floor(hash(k, tx) * 3), z.top);
        rect(sx + Math.floor(hash(tx, ty) * 12), sy, 3, 1, '#9fd27a');
      }
      if (!solidT(tx, ty + 1) && tileAt(tx, ty + 1) !== '^' && hash(tx, ty + 99) < 0.35) {
        const len = 5 + Math.floor(hash(tx, ty + 7) * 16), vx = sx + 3 + Math.floor(hash(tx + 5, ty) * 9);
        const sway = Math.round(Math.sin(timeNow * 1.5 + tx) * 1);
        rect(vx, sy + T, 1, len, '#3f7a3a');
        for (let k = 3; k < len; k += 4) rect(vx + (k % 8 < 4 ? 1 : -1) + sway, sy + T + k, 2, 1, '#5d9a4a');
      }
    } else if (c === '^') {
      for (let k = 0; k < 4; k++) {
        const bx = sx + k * 4;
        rect(bx + 1, sy + 13, 3, 3, '#4a2b26'); rect(bx + 1, sy + 10, 2, 3, '#6e3a2e'); rect(bx + 1, sy + 7, 1, 3, '#a8553c');
      }
      rect(sx, sy + 15, T, 1, '#2d1b18');
    }
  }
}

// 주인공 도트 (assets/hero/hero_sheet.png). 프레임 80×60, 한 줄에 한 동작, 발 기준점 (32, 57).

const heroImg = new Image();

const HERO = { fw: 80, fh: 60, ax: 32, ay: 57, tipX: 11, tipY: -40,   // 작은 주인공 (도트 키 44px = 게임 22px)
  rows: { idle: [0, 4], walk: [1, 8], jump: [2, 6], grapple: [3, 1], whip: [4, 4] } };
function heroFrame() {
  if (P.act) {
    const n = HERO.rows[P.act.name][1];                // 갈고리는 화분을 겨누는 한 프레임 (덩굴은 게임이 조준 방향으로 그림)
    return [P.act.name, Math.min(n - 1, Math.floor(P.act.t / P.act.dur * n))];
  }
  if (hook) return ['jump', 3];
  if (!P.onGround) return ['jump', P.vy < -150 ? 1 : P.vy < -30 ? 2 : P.vy < 60 ? 3 : 4];
  if (P.landT > 0) return ['jump', 5];
  if (Math.abs(P.vx) > 10) return ['walk', Math.floor(P.walkT / 0.095) % 8];
  return ['idle', Math.floor(timeNow / 0.28) % 4];
}
// 덩굴이 나오는 화분 식물 위치 (게임 좌표)
const plantTip = () => ({ x: P.x + P.w / 2 + P.face * HERO.tipX / RS, y: P.y + P.h + HERO.tipY / RS });
function drawPlayer(cx, cy) {
  if (P.inv > 0 && Math.floor(P.inv * 20) % 2 === 0) return;
  if (!heroReady) { rect(P.x - cx, P.y - cy, P.w, P.h, '#4e8f4a'); return; }
  const [name, f] = heroFrame();

  const px = Math.round((P.x + P.w / 2 - cx) * RS), py = Math.round((P.y + P.h - cy) * RS);
  ctx.save();
  ctx.setTransform(P.face < 0 ? -1 : 1, 0, 0, 1, px, py);
  ctx.drawImage(heroImg, f * HERO.fw, row * HERO.fh, HERO.fw, HERO.fh, -HERO.ax, -HERO.ay, HERO.fw, HERO.fh);
  ctx.restore();
}

// 적 도트 (tools/enemy-gen/anim_enemies.py가 만듦, 오른쪽을 보는 기준). 정보는 assets/enemies/enemies.json과 같음
const ENEMY_ART = {
  blob: { src: 'assets/enemies/blob.png', fw: 48, fh: 40, ax: 24, ay: 38, rows: { walk: [0, 4, 150], attack: [1, 4, 90], hurt: [2, 1, 120] } },
  flower: { src: 'assets/enemies/flower.png', fw: 64, fh: 64, ax: 32, ay: 62, rows: { idle: [0, 4, 220], attack: [1, 4, 90], hurt: [2, 1, 120] } },
};
for (const k in ENEMY_ART) { const a = ENEMY_ART[k]; a.img = new Image(); a.img.onload = () => { a.ready = true; }; a.img.src = a.src; }
function drawEnemy(e, cx, cy) {
  const art = ENEMY_ART[e.t];
  if (art && art.ready) {
    let row = e.t === 'blob' ? 'walk' : 'idle', f;
    if (e.flash > 0) row = 'hurt';
    else if (e.atkT < art.rows.attack[1] * art.rows.attack[2] / 1000) row = 'attack';
    const [r, n, ms] = art.rows[row];
    f = row === 'attack' ? Math.min(n - 1, Math.floor(e.atkT * 1000 / ms)) : Math.floor((timeNow * 1000 + e.x * 7) / ms) % n;
    const px = Math.round((e.x + e.w / 2 - cx) * RS), py = Math.round((e.y + e.h - cy) * RS);
    ctx.save();
    ctx.setTransform(e.face < 0 ? -1 : 1, 0, 0, 1, px, py);
    ctx.drawImage(art.img, f * art.fw, r * art.fh, art.fw, art.fh, -art.ax, -art.ay, art.fw, art.fh);
    ctx.restore();
    return;
  }
  const x = Math.round(e.x - cx), y = Math.round(e.y - cy), fl = e.flash > 0;
  if (e.t === 'blob') {
    const b = Math.floor(timeNow * 6 + e.x) % 2;
    const body = fl ? '#f2f2d0' : '#3f6b33', dark = fl ? '#d8d8b0' : '#2a4a24';
    rect(x + 1, y + 2 + b, 10, 8 - b, body); rect(x, y + 4, 12, 5, body); rect(x + 2, y + 1 + b, 8, 1, body);
    rect(x + 1, y + 8, 10, 2, dark);
    for (let k = 0; k < 4; k++) rect(x + 1 + k * 3, y + b, 1, 2, '#a8553c');
    const ex = e.vx >= 0 ? 6 : 2;
    rect(x + ex, y + 4, 2, 2, '#f0e6a0'); rect(x + ex + (e.vx >= 0 ? 1 : 0), y + 5, 1, 1, '#1b1b1b');
  } else {
    rect(x + 4, y + 6, 2, 8, fl ? '#f2f2d0' : '#3f7a3a');
    rect(x + 1, y + 10, 3, 2, '#5d9a4a'); rect(x + 6, y + 9, 3, 2, '#5d9a4a');
    const o = Math.round(e.open * 2), pc = fl ? '#ffffff' : '#c8454a';
    rect(x, y + 1 - o, 10, 2, pc); rect(x, y + 5 + o, 10, 2, pc); rect(x - 1, y + 2, 2, 4, pc); rect(x + 9, y + 2, 2, 4, pc);
    rect(x + 2, y + 2, 6, 3, '#2a1416'); rect(x + 4, y + 3, 2, 1, '#e9d78a');
  }
}

function drawHUD() {

  if (bag) [[bag.weapon, 'L', P.slashCd / WEAPONS[bag.weapon].cd], [bag.skills[0], 'R', 0], [bag.skills[1], 'E', 0]].forEach(([id, key, k], i) => {

    if (cdv > 0) { ctx.globalAlpha = 0.6; rect(x, y + 15 - Math.ceil(15 * Math.min(1, cdv)), 15, Math.ceil(15 * Math.min(1, cdv)), '#000'); ctx.globalAlpha = 1; }

// 구역 배경 그림 (assets/ch{1,2,3}-bg-2x.png: 852×480을 426×240 크기로 그림 = 2배 해상도, 탁한 올리브 색감으로 조정)
// 화면 가운데 타일이 from~to 구역에 있을 때 보이고, 경계에서 fade 타일에 걸쳐 서서히 섞임. ix·iy는 카메라에 따른 그림 위치(패럴랙스)
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const ZONE_BGS = [
  // 1 이끼 덮인 지하철: 가로 0.25배, 그림 속 승강장을 게임 바닥에 맞춤
  { src: 'assets/ch1-bg-2x.png', from: -99, to: 35, fade: 5,
    ix: cx => -Math.min(cx * 0.25, 426 - VW), iy: cy => -59 - (cy - (H * T - VH)) * 0.25 },
  // 2 가시덤불 도심 (윗길, 바닥 y=288): 가로로 천천히, 그림 속 돌 바닥(y≈184)을 게임 바닥에 맞춤
  { src: 'assets/ch2-bg-2x.png', from: 47, to: 79, fade: 4,
    ix: cx => -clamp((cx - 700) * 0.3, 0, 426 - VW), iy: cy => 103 - 184 - (cy - 185) * 0.25 },
  // 3 식충식물 온실 (세로 갱도): 내려가는 동안 그림이 위로 천천히 올라감
  { src: 'assets/ch3-bg-2x.png', from: 81, to: 999, fade: 3,
    ix: cx => -clamp((cx - 1100) * 0.3, 0, 426 - VW), iy: cy => -clamp((cy - 150) / (H * T - VH - 150) * 60, 0, 60) },
];
for (const z of ZONE_BGS) { z.img = new Image(); z.img.onload = () => { z.ready = true; }; z.img.src = z.src; }
function drawChapterBg(cx, cy) {
  const centerTile = (cx + VW / 2) / T;
  let cover = 0;
  for (const z of ZONE_BGS) {
    if (!z.ready || w3) continue;   // 3D일 때는 모든 구역을 3D로 그림 (그림은 3D 장면의 먼 배경으로만 씀)
    const a = clamp((centerTile - z.from) / z.fade + 0.5, 0, 1) * clamp((z.to - centerTile) / z.fade + 0.5, 0, 1);
    if (a <= 0) continue;
    cover = Math.max(cover, a);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#141a28'; ctx.fillRect(0, 0, VW, VH);
    ctx.drawImage(z.img, Math.round(z.ix(cx)), Math.round(z.iy(cy)), 426, 240);
    ctx.fillStyle = 'rgba(11, 21, 23, 0.16)'; ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }
  return cover;
}

let timeNow = 0;
function draw() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const sh = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  const cx = Math.round(cam.x + sh), cy = Math.round(cam.y + sh);
  if (w3) {
    // 3D 배경을 뒤 캔버스에 그리고, 이 캔버스는 투명하게 비운 뒤 2·3구역 그림·캐릭터만 그림
    ctx.clearRect(0, 0, VW, VH);
    w3.render(cx, cy, timeNow);
    const cover = drawChapterBg(cx, cy);
    if (cover > 0) drawTiles(cx, cy);   // 2·3구역 2D 그림이 3D를 덮을 때만 칸도 2D로 (아니면 3D 블록이 보임)
  } else {
    drawBackground(cx, cy);
    drawChapterBg(cx, cy);
    drawTiles(cx, cy);
  }
  // 체크포인트 새싹
  CHECKS.forEach((c, i) => {
    const x = c.x * T + 8 - cx, y = (c.y + 1) * T - cy, on = checkpoint === c;
    if (on) { ctx.globalAlpha = 0.18 + 0.12 * Math.sin(timeNow * 3); rect(x - 7, y - 15, 14, 15, '#e9d78a'); ctx.globalAlpha = 1; }
    if (fxReady) ctx.drawImage(fxImg, on ? 24 : 0, 16, 24, 32, x - 6, y - 15, 12, 16);   // fx.png 새싹 (꺼짐·켜짐)
    else {
      rect(x - 1, y - 6, 2, 6, on ? '#79b85d' : '#3f6b40');
      rect(x - 4, y - 8, 3, 2, on ? '#9fd27a' : '#3f6b40'); rect(x + 1, y - 9, 3, 2, on ? '#9fd27a' : '#3f6b40');
    }
  });
  // 세계수 씨앗
  {
    const x = GOAL.x * T + 8 - cx, y = GOAL.y * T + 6 - cy + Math.round(Math.sin(timeNow * 2) * 2);
    if (fxReady) ctx.drawImage(fxImg, 48 + (Math.floor(timeNow * 2.5) % 2) * 32, 16, 32, 32, x - 8, y - 9, 16, 16);   // fx.png 세계수 씨앗
    else {
      ctx.globalAlpha = 0.2 + 0.1 * Math.sin(timeNow * 4); rect(x - 10, y - 10, 20, 20, '#e9d78a'); ctx.globalAlpha = 1;
      rect(x - 3, y - 2, 6, 7, '#b08a4a'); rect(x - 2, y - 3, 4, 1, '#b08a4a'); rect(x - 2, y + 5, 4, 1, '#8a6a36');
      rect(x - 1, y - 7, 1, 4, '#79b85d'); rect(x, y - 8, 3, 2, '#9fd27a');
    }
  }
  for (const e of enemies) drawEnemy(e, cx, cy);
  // 갈고리 덩굴
  const drawVine = (x1, y1, x2, y2) => {
    const d = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.floor(d / 2));
    for (let i = 0; i <= n; i++) {
      const t = i / n, wob = Math.sin(t * 12 + timeNow * 10) * (1 - t) * 1.2;
      rect(x1 + (x2 - x1) * t + wob, y1 + (y2 - y1) * t, 1, 1, '#5d9a4a');
      if (i % 5 === 2) rect(x1 + (x2 - x1) * t + 1, y1 + (y2 - y1) * t - 1, 2, 1, '#9fd27a');
    }
  };
  const tip = plantTip();
  if (hook) drawVine(tip.x - cx, tip.y - cy, hook.x - cx, hook.y - cy);
  if (slashFx && slashFx.vine) drawVine(tip.x - cx, tip.y - cy, slashFx.x2 - cx, slashFx.y2 - cy);
  drawPlayer(cx, cy);
  // 베기
  if (slashFx && !slashFx.vine) {
    // 덩굴 채찍 궤적: 바깥은 밝은 청록빛, 안쪽은 이끼색 (주인공 방독면 강조색에 맞춤), 사라지며 옅어짐
    const k = Math.max(0, slashFx.t / 0.12);
    ctx.globalAlpha = 0.5 + 0.5 * k;
    ctx.strokeStyle = '#c6f7d8'; ctx.lineWidth = 1.5;
    const sr = (slashFx.r || 16) / 16;   // 무기마다 궤적 크기
    ctx.beginPath(); ctx.arc(P.x + P.w / 2 - cx, P.y + P.h / 2 - cy, 16 * sr, slashFx.ang - 1, slashFx.ang + 1); ctx.stroke();
    ctx.strokeStyle = sr < 0.9 ? '#d8d4c0' : '#5fd39a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(P.x + P.w / 2 - cx, P.y + P.h / 2 - cy, 13 * sr, slashFx.ang - 0.85, slashFx.ang + 0.85); ctx.stroke();
    ctx.strokeStyle = '#3f7a3a'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(P.x + P.w / 2 - cx, P.y + P.h / 2 - cy, 11 * sr, slashFx.ang - 0.6, slashFx.ang + 0.6); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 씨앗
  if (seed) {
    const x = seed.x - cx, y = seed.y - cy;
    const k = seed.life < 0.8 && Math.floor(seed.life * 10) % 2 ? 2 : (seed.stuck || seed.enemy ? 1 : 0);
    if (fxReady) ctx.drawImage(fxImg, 64 + k * 12, 0, 12, 12, x - 3, y - 4, 6, 6);   // fx.png 주인공 씨앗 (날아감·싹·깜빡)
    else {
      rect(x - 1, y - 1, 3, 3, '#b08a4a');
      if (k === 1) { rect(x, y - 3, 1, 2, '#79b85d'); rect(x + 1, y - 4, 2, 1, '#9fd27a'); }
    }
  }
  for (const b of bullets) {
    if (fxReady) ctx.drawImage(fxImg, (Math.floor(timeNow * 14) % 4) * 16, 0, 16, 16, b.x - cx - 4, b.y - cy - 4, 8, 8);   // fx.png 적 씨앗탄 (회전)
    else { rect(b.x - cx - 1, b.y - cy - 1, 3, 3, '#e9d78a'); rect(b.x - cx, b.y - cy, 1, 1, '#c8454a'); }
  }
  for (const s of pshots) {
    rect(s.x - cx - 1, s.y - cy - 1, s.big ? 3 : 2, s.big ? 3 : 2, s.big ? '#9fd27a' : '#c9a86a');
    rect(s.x - cx - s.vx * 0.012, s.y - cy - s.vy * 0.012, 1, 1, '#e9d78a');
  }
  // 줍는 아이템: 빛나는 씨앗 주머니 + 아이콘
  for (const p of pickups) {
    if (p.taken) continue;
    const x = p.x * T + 8 - cx, y = p.y * T + 6 - cy + Math.round(Math.sin(timeNow * 2 + p.x) * 2);
    ctx.globalAlpha = 0.25 + 0.1 * Math.sin(timeNow * 4); rect(x - 9, y - 9, 18, 18, '#e9d78a'); ctx.globalAlpha = 1;
    drawIcon(p.id, x - 6, y - 6);
  }
  // 가시 갑옷 / 삼켜 뱉기 효과
  const hx = P.x + P.w / 2 - cx, hy = P.y + P.h / 2 - cy;
  if (P.thornT > 0) {
    for (let i = 0; i < 12; i++) {
      const ang = i / 12 * Math.PI * 2 + timeNow * 2, r0 = 9, r1 = 14 + (i % 2) * 2;
      for (let r = r0; r < r1; r++) rect(hx + Math.cos(ang) * r, hy + Math.sin(ang) * r, 1, 1, r > r1 - 2 ? '#e2c8a0' : '#8a4a36');
    }
  }
  if (P.swallowT > 0) {
    ctx.strokeStyle = '#9fd27a'; ctx.lineWidth = 1; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(timeNow * 20);
    ctx.beginPath(); ctx.arc(hx, hy - 3, 30 * (P.swallowT / 0.8) + 4, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    if (P.swallowN) { ctx.fillStyle = '#e9d78a'; ctx.font = '7px sans-serif'; ctx.fillText('×' + P.swallowN, hx + 8, hy - 14); }
  }
  for (const p of parts) rect(p.x - cx, p.y - cy, 1, 1, p.col);
  drawHUD();
  if (state === 'bag') drawBag();
}

// ---------- 아이콘 (가방·HUD·줍는 아이템, 12×12 게임 px) ----------
function drawIcon(id, x, y, dim) {
  const R = (a, b, w, h, c) => rect(x + a, y + b, w, h, c);
  if (dim) { ctx.globalAlpha = 0.35; }
  if (id === 'whip') { R(1, 8, 4, 4, '#a0663e'); R(1, 8, 4, 1, '#c88850'); for (let i = 0; i < 8; i++) R(3 + i, 7 - Math.round(Math.sin(i / 7 * Math.PI) * 5), 1, 1, i % 2 ? '#79b85d' : '#5fd39a'); R(11, 6, 1, 2, '#9fd27a'); }
  else if (id === 'sickle') { for (let i = 0; i < 6; i++) R(2 + i, 11 - i, 1, 1, '#7a5030'); for (let i = 0; i < 7; i++) R(5 + Math.round(Math.cos(i / 6 * 2.4) * 4), 3 - Math.round(Math.sin(i / 6 * 2.4) * 3) + 2, 2, 1, '#c8ccc4'); }
  else if (id === 'shotgun') { R(1, 6, 4, 3, '#7a5030'); R(5, 5, 7, 2, '#8a908c'); R(5, 7, 5, 1, '#5a605c'); R(10, 9, 1, 1, '#c9a86a'); R(11, 3, 1, 1, '#c9a86a'); }
  else if (id === 'hook') { for (let i = 0; i < 9; i++) R(1 + i, 10 - i, 1, 1, '#79b85d'); R(9, 1, 3, 3, '#a8323a'); R(9, 1, 3, 1, '#e8dcb0'); }
  else if (id === 'seed') { R(4, 5, 5, 6, '#b08a4a'); R(4, 5, 2, 6, '#c8a060'); R(6, 2, 1, 3, '#79b85d'); R(7, 1, 3, 2, '#9fd27a'); }
  else if (id === 'thorn') { for (let i = 0; i < 8; i++) { const g = i / 8 * Math.PI * 2; R(6 + Math.round(Math.cos(g) * 4), 6 + Math.round(Math.sin(g) * 4), 1, 1, '#e2c8a0'); R(6 + Math.round(Math.cos(g) * 2), 6 + Math.round(Math.sin(g) * 2), 1, 1, '#8a4a36'); } R(5, 5, 3, 3, '#6e3a2e'); }
  else if (id === 'swallow') { R(1, 2, 10, 3, '#5d8f3e'); R(1, 7, 10, 3, '#4f7a34'); R(2, 5, 8, 2, '#a8323a'); for (let i = 0; i < 5; i++) { R(2 + i * 2, 4, 1, 1, '#e8dcb0'); R(2 + i * 2, 7, 1, 1, '#e8dcb0'); } }
  ctx.globalAlpha = 1;
}

// ---------- 가방 화면 (Tab, 열려 있는 동안 게임 멈춤) ----------
function wrapText(text, x, y, maxW, lh) {
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW) { ctx.fillText(line, x, y); y += lh; line = ch; } else line += ch;
  }
  if (line) ctx.fillText(line, x, y);
}
function drawBag() {
  bagHits = [];
  const hit = (x, y, w, h, o) => bagHits.push({ x, y, w, h, ...o });
  ctx.fillStyle = 'rgba(6, 12, 12, 0.72)'; ctx.fillRect(0, 0, VW, VH);
  rect(22, 12, 276, 156, '#162220'); rect(22, 12, 276, 1, '#3f6b40'); rect(22, 167, 276, 1, '#3f6b40'); rect(22, 12, 1, 156, '#3f6b40'); rect(297, 12, 1, 156, '#3f6b40');
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 9px "Noto Sans KR", sans-serif'; ctx.fillStyle = '#e9d78a'; ctx.fillText('가방', 32, 24);
  ctx.font = '6px "Noto Sans KR", sans-serif'; ctx.fillStyle = '#8aa293'; ctx.fillText('Tab · Esc 닫기   칸을 눌러 바꾸기   1 · 2 기술 칸 고르기', 70, 24);
  const box = (x, y, on, sel) => { rect(x, y, 20, 20, on ? '#24362c' : '#1a2420'); rect(x, y, 20, 1, sel ? '#e9d78a' : '#3f6b40'); rect(x, y + 19, 20, 1, sel ? '#e9d78a' : '#3f6b40'); rect(x, y, 1, 20, sel ? '#e9d78a' : '#3f6b40'); rect(x + 19, y, 1, 20, sel ? '#e9d78a' : '#3f6b40'); };
  // 장착 칸
  ctx.font = 'bold 6px "Noto Sans KR", sans-serif'; ctx.fillStyle = '#d8e4d4'; ctx.fillText('장착', 32, 38);
  const slots = [['무기', '왼쪽 클릭', bag.weapon], ['기술 1', '오른쪽 클릭', bag.skills[0]], ['기술 2', 'E · Shift', bag.skills[1]]];
  slots.forEach(([lab, key, id], i) => {
    const x = 32, y = 46 + i * 30, sel = i > 0 && bag.sel === i - 1;
    box(x, y, true, sel); drawIcon(id, x + 4, y + 4);
    ctx.font = 'bold 6px "Noto Sans KR", sans-serif'; ctx.fillStyle = sel ? '#e9d78a' : '#d8e4d4'; ctx.fillText(lab + ' · ' + ITEMS[id].name, x + 25, y + 7);
    ctx.font = '5px "Noto Sans KR", sans-serif'; ctx.fillStyle = '#8aa293'; ctx.fillText(key, x + 25, y + 15);
    if (i > 0) hit(x, y, 110, 20, { slot: i - 1 });
  });
  // 가진 것 목록
  const list = (title, ids, y) => {
    ctx.font = 'bold 6px "Noto Sans KR", sans-serif'; ctx.fillStyle = '#d8e4d4'; ctx.fillText(title, 158, y - 7);
    ids.forEach((id, i) => {
      const x = 158 + i * 26, own = bag.owned.has(id);
      const on = id === bag.weapon || bag.skills.includes(id);
      box(x, y, own, on);
      if (own) drawIcon(id, x + 4, y + 4); else { ctx.fillStyle = '#4a5a50'; ctx.font = 'bold 8px sans-serif'; ctx.fillText('?', x + 7, y + 10); }
      hit(x, y, 20, 20, { item: id });
    });
  };
  list('무기', WEAPON_LIST, 46);
  list(`기술 → 기술 ${bag.sel + 1} 칸에 장착`, SKILL_LIST, 84);
  // 설명 (마우스를 올린 것, 없으면 고른 칸)
  const hv = bagHits.find(b => b.item && mouse.x >= b.x && mouse.x < b.x + b.w && mouse.y >= b.y && mouse.y < b.y + b.h);
  const id = hv ? hv.item : bag.skills[bag.sel];
  const it = ITEMS[id], own = bag.owned.has(id);
  rect(156, 114, 132, 46, '#1a2420');
  ctx.font = 'bold 6px "Noto Sans KR", sans-serif'; ctx.fillStyle = own ? '#e9d78a' : '#6a7a70'; ctx.fillText(own ? it.name : '아직 없음', 160, 121);
  ctx.font = '5px "Noto Sans KR", sans-serif'; ctx.fillStyle = '#c8d4c4';
  if (own) { wrapText(it.desc, 160, 130, 124, 7); ctx.fillStyle = '#8aa293'; ctx.fillText('얻은 곳: ' + it.from, 160, 155); }
  else wrapText((it.kind === 'skill' ? '포식 식물을 쓰러뜨려 화분에 먹이면 얻는다. ' : '어딘가에 떨어져 있다. ') + '얻는 곳: ' + it.from, 160, 130, 124, 7);
  ctx.textBaseline = 'alphabetic';
}

// ---------- 루프 ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  timeNow += dt;
  requestAnimationFrame(frame);
  if (state === 'play') {
    acc += dt;
    while (acc >= 1 / 60) { update(1 / 60); acc -= 1 / 60; }
  }
  draw();
}
buildMap();
P = { x: 0, y: 0, w: 8, h: 19, vx: 0, vy: 0, face: 1, hp: 100, maxHp: 100, hpLag: 100, inv: 0, anim: 0, seedCd: 0, act: null, walkT: 0, landT: 0 };
checkpoint = CHECKS[0]; placePlayerAt(checkpoint); spawnEnemies();
bullets = []; parts = []; seed = null; hook = null; shake = 0; activeChecks = new Set([0]);
bag = newBag(); pickups = PICKUPS.map(p => ({ ...p, taken: false })); P.cds = {}; P.thornT = 0; P.swallowT = 0; P.swallowN = 0;
cam = { x: Math.max(0, P.x - VW / 2), y: Math.min(H * T - VH, P.y - VH / 2) };
startBtn.addEventListener('click', start);
startBtn.addEventListener('pointerup', e => { if (state !== 'play') { e.preventDefault(); start(); } });
requestAnimationFrame(frame);
})();
</script>
