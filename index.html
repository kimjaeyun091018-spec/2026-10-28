<title>주사위 던전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=Silkscreen:wght@400;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 화면. 위에서부터 전장(캔버스) → 상태 → 주사위 트레이 → 손패 → 턴 종료. 던전 한 가지 색감으로 고정한 단일 테마. */
:root {
  color-scheme: dark;
  --bg: #1b1824;
  --panel: #262130;
  --line: #3e3549;
  --ink: #ece3cf;
  --muted: #9b90a9;
  --gold: #f0b54a;
  --parch: #e8d6a6;
  --parch-dim: #b9a97f;
  --parch-ink: #2e2418;
  --die: #f4ecdb;
  --die-ink: #2a2230;
  --hp: #d4574e;
  --block: #5b9fd6;
  --poison: #7cbf57;
  --font-display: "Do Hyeon", "Nanum Gothic", system-ui, sans-serif;
  --font-body: "Nanum Gothic", system-ui, sans-serif;
  --font-num: "Silkscreen", ui-monospace, monospace;
  --notch: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: 0.02em; color: var(--gold); }
.floor { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.floor b { color: var(--ink); font-weight: 700; }

.stage { position: relative; background: var(--panel); clip-path: var(--notch); }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; image-rendering: pixelated; image-rendering: crisp-edges; }

.status { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.unit { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.unit.foe { text-align: right; align-items: flex-end; }
.uname { font-family: var(--font-display); font-size: 18px; line-height: 1; }
.bar { width: 100%; height: 10px; background: #120f18; position: relative; clip-path: var(--notch); }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--hp); transition: width .25s steps(6); }
.unit.foe .bar i { inset: 0 0 0 auto; }
.nums { font-family: var(--font-num); font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.unit.foe .nums { justify-content: flex-end; }
.nums .hp { color: var(--ink); }
.nums .blk { color: var(--block); }
.nums .psn { color: var(--poison); }
.intent { font-size: 13px; font-weight: 800; padding: 3px 8px; background: #3a2230; color: #f3b3aa; clip-path: var(--notch); white-space: nowrap; }
.intent.block { background: #1f3045; color: #a9cff0; }
.intent.poison { background: #22361c; color: #b6e29a; }
.intent.curse { background: #35233f; color: #d5b2f0; }

.tray { display: flex; align-items: center; gap: 10px; background: var(--panel); padding: 10px; clip-path: var(--notch); min-height: 68px; }
.dice { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
.die {
  width: 46px; height: 46px; padding: 6px; border: 0; cursor: pointer;
  background: var(--die); color: var(--die-ink);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); place-items: center;
  clip-path: var(--notch); box-shadow: inset -3px -3px 0 #c9bca1;
  transition: transform .08s steps(2);
}
.die span { width: 7px; height: 7px; background: var(--die-ink); visibility: hidden; }
.die span.on { visibility: visible; }
.die.sel { background: var(--gold); box-shadow: inset -3px -3px 0 #b07d22; transform: translateY(-4px); }
.die.rolling { animation: wobble .1s steps(2) infinite; }
.die:focus-visible, .btn:focus-visible, .card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@keyframes wobble { 0% { transform: rotate(-8deg); } 100% { transform: rotate(8deg); } }
.empty { color: var(--muted); font-size: 13px; }

.btn {
  font-family: var(--font-display); font-size: 17px; border: 0; cursor: pointer;
  padding: 10px 14px; background: var(--line); color: var(--ink); clip-path: var(--notch);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.35);
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.main { background: var(--gold); color: #2b1d08; }
.reroll { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.reroll small { font-family: var(--font-num); font-size: 10px; color: var(--muted); }

.msg { font-size: 13px; color: var(--muted); min-height: 1.4em; text-align: center; }

.hand { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.card {
  border: 0; cursor: pointer; text-align: left; font: inherit;
  background: var(--parch); color: var(--parch-ink); padding: 8px 8px 10px;
  display: flex; flex-direction: column; gap: 6px; clip-path: var(--notch);
  box-shadow: inset -3px -3px 0 var(--parch-dim);
  transition: transform .08s steps(2);
}
.card .cn { font-family: var(--font-display); font-size: 18px; line-height: 1; }
.card .cd { font-size: 11.5px; line-height: 1.35; font-weight: 700; }
.slots { display: flex; gap: 4px; }
.slot {
  flex: 1; min-width: 0; height: 30px; border: 2px dashed #8a7650;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 800; color: #6e5c3a; text-align: center; line-height: 1.1; padding: 0 2px;
}
.slot.full { border: 0; background: var(--die-ink); color: var(--die); font-family: var(--font-num); font-size: 15px; }
.card.fit { transform: translateY(-4px); box-shadow: inset -3px -3px 0 var(--parch-dim), inset 0 0 0 3px var(--gold); }
.card.nofit { opacity: .5; }
.card.shake { animation: shake .24s steps(3); }
@keyframes shake { 0%,100% { transform: translateX(0); } 33% { transform: translateX(-4px); } 66% { transform: translateX(4px); } }

footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pile { font-family: var(--font-num); font-size: 11px; color: var(--muted); }

.overlay { position: fixed; inset: 0; background: rgba(12,10,16,.82); display: flex; align-items: center; justify-content: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.box { background: var(--panel); clip-path: var(--notch); padding: 20px 16px; width: min(440px, 100%); display: flex; flex-direction: column; gap: 14px; text-align: center; }
.box h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; color: var(--gold); text-wrap: balance; }
.box p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.box .hand { grid-template-columns: repeat(3, 1fr); }
.box .card { cursor: pointer; }
.rules { text-align: left; font-size: 13px; line-height: 1.6; color: var(--ink); margin: 0; padding-left: 18px; }

@media (prefers-reduced-motion: reduce) {
  .die.rolling, .card.shake { animation: none; }
  .die, .card, .bar i { transition: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>주사위 던전</h1>
    <div class="floor">FLOOR <b id="floorNo">1</b>/5</div>
  </header>

  <div class="stage"><canvas id="cv" width="240" height="120"></canvas></div>

  <div class="status">
    <div class="unit">
      <div class="uname">기사</div>
      <div class="bar"><i id="pBar"></i></div>
      <div class="nums"><span class="hp" id="pHp"></span><span class="blk" id="pBlk"></span><span class="psn" id="pPsn"></span></div>
    </div>
    <div class="unit foe">
      <div class="uname" id="eName"></div>
      <div class="bar"><i id="eBar"></i></div>
      <div class="nums"><span class="hp" id="eHp"></span><span class="blk" id="eBlk"></span><span class="psn" id="ePsn"></span></div>
      <div class="intent" id="eIntent"></div>
    </div>
  </div>

  <div class="tray">
    <div class="dice" id="dice"></div>
    <div class="reroll">
      <button class="btn" id="rerollBtn" type="button">다시 굴림</button>
      <small id="rerollLeft"></small>
    </div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="hand" id="hand"></div>

  <footer>
    <div class="pile" id="pile"></div>
    <button class="btn main" id="endBtn" type="button">턴 종료</button>
  </footer>
</div>

<div class="overlay" id="ov" hidden><div class="box" id="ovBox"></div></div>

<script>
(() => {
"use strict";

/* ---------- 도트 그림 (16칸 격자, '.'은 빈칸) ---------- */
const SPR = {
  knight: { pal: { d: "#3b3f52", g: "#a7acc0", k: "#15131c", b: "#4f78c4", y: "#f0b54a", w: "#e8ecf4" }, rows: [
    "................",
    ".....dddd.......",
    "....dggggd......",
    "....dgkkgd....w.",
    "....dggggd....w.",
    ".....dddd.....w.",
    "....bbbbbb...yw.",
    "...bbybbybb..y..",
    "...bbbbbbbbdd...",
    "...dbbbbbbd.....",
    "....bbbbbb......",
    "....bb..bb......",
    "....dd..dd......",
    "...ddd..ddd....."] },
  slime: { pal: { d: "#2d5a2a", g: "#6cc04a", l: "#b4ec8a", w: "#ffffff", k: "#15131c" }, rows: [
    "......dddd......",
    "....ddggggdd....",
    "...dgglggggd....",
    "..dgglggggggd...",
    "..dggwkggwkgd...",
    ".dgggggggggggd..",
    ".dggggddgggggd..",
    ".dgggggggggggd..",
    "..ddddddddddd..."] },
  bat: { pal: { d: "#2a1d36", p: "#7a4fa3", r: "#ff5a5a" }, rows: [
    ".d............d.",
    ".dd....dd....dd.",
    ".dpd..dppd..dpd.",
    ".dppd.dppd.dppd.",
    ".dpppdprprdpppd.",
    "..dppppppppppd..",
    "...dddpppppdd...",
    "......dpppd.....",
    ".......d.d......"] },
  shroom: { pal: { r: "#c9443c", w: "#f5efe0", d: "#7a2420", c: "#ead9b5", k: "#2a2230" }, rows: [
    ".....rrrrrr.....",
    "...rrwwrrrrrr...",
    "..rrrwwrrrwwrr..",
    ".rrrrrrrrrwwrrr.",
    ".rrwwrrrrrrrrrr.",
    "..dddddddddddd..",
    ".....cccccc.....",
    ".....ckccck.....",
    ".....cccccc.....",
    ".....cc..cc.....",
    "....ccc..ccc...."] },
  skel: { pal: { w: "#eae4d4", s: "#a39c8a", k: "#15131c" }, rows: [
    ".....wwwww......",
    "....wwwwwww.....",
    "....wkkwkkw.....",
    "....wwwwwww.....",
    ".....wkwkw......",
    "......www.......",
    "....sswwwss.....",
    "...w.wsws.w.....",
    "...w.wwww.w.....",
    ".....swsw.......",
    "......ww........",
    ".....w..w.......",
    ".....w..w.......",
    "....ww..ww......"] },
  golem: { pal: { d: "#3c3a44", s: "#7e7a88", o: "#f08a3a" }, rows: [
    ".....dddddd.....",
    "....dssssssd....",
    "....dsossosd....",
    "....dssssssd....",
    "..ddddssssdddd..",
    ".dsssdssssdsssd.",
    ".dsssdssssdsssd.",
    ".dssd.dssd.dssd.",
    ".ddd..dssd..ddd.",
    "......dssd......",
    ".....dsddsd.....",
    "....dsd..dsd....",
    "....ddd..ddd...."] },
  boss: { pal: { h: "#8a3d9e", k: "#15131c", w: "#f4ecdb", r: "#d4302f" }, rows: [
    ".h............h.",
    ".hh..........hh.",
    "..hh........hh..",
    "..kkkkkkkkkkkk..",
    "..kwwwwwwwwwwk..",
    "..kwrrwwwwrrwk..",
    "..kwrrwwwwrrwk..",
    "..kwwwwwwwwwwk..",
    "..kwwwwrrwwwwk..",
    "..kwwwwrrwwwwk..",
    "..kwrwrwrwrwwk..",
    "..kwwrwrwrwwwk..",
    "..kwwwwwwwwwwk..",
    "..kkkkkkkkkkkk.."] }
};

/* ---------- 카드 ---------- */
const COND = {
  any:  { t: "아무 눈", ok: () => true },
  even: { t: "짝수",    ok: v => v % 2 === 0 },
  odd:  { t: "홀수",    ok: v => v % 2 === 1 },
  min5: { t: "5 이상",  ok: v => v >= 5 },
  max3: { t: "3 이하",  ok: v => v <= 3 },
  low2: { t: "1~2",     ok: v => v <= 2 },
  min2: { t: "2 이상",  ok: v => v >= 2 },
  same: { t: "같은 눈", ok: (v, f) => v === f[0] },
  sum7: { t: "합 7+",   ok: (v, f) => v + f[0] >= 7 }
};
const CARDS = {
  slash: { n: "베기",   s: ["any"],         d: "눈만큼 피해",            fx: v => attack(v[0]) },
  guard: { n: "방패",   s: ["even"],        d: "눈×2 방어",              fx: v => gainBlock(v[0] * 2) },
  stab:  { n: "찌르기", s: ["odd"],         d: "눈+2 피해",              fx: v => attack(v[0] + 2) },
  smash: { n: "강타",   s: ["min5"],        d: "눈×2 피해",              fx: v => attack(v[0] * 2) },
  twin:  { n: "쌍검",   s: ["any", "same"], d: "두 눈 합×2 피해",        fx: v => attack((v[0] + v[1]) * 2) },
  fog:   { n: "독안개", s: ["any", "sum7"], d: "두 눈 합만큼 피해, 독 2", fx: v => { attack(v[0] + v[1]); poisonFoe(2); } },
  herb:  { n: "약초",   s: ["max3"],        d: "눈+2 회복",              fx: v => heal(v[0] + 2) },
  split: { n: "쪼개기", s: ["min2"],        d: "눈을 반씩 나눈 주사위 2개", fx: v => { addDie(Math.floor(v[0] / 2)); addDie(Math.ceil(v[0] / 2)); } },
  flip:  { n: "뒤집기", s: ["any"],         d: "반대 면(7−눈) 주사위",   fx: v => addDie(7 - v[0]) },
  sting: { n: "독침",   s: ["low2"],        d: "독 (눈+2)",              fx: v => poisonFoe(v[0] + 2) }
};
const STARTER = ["slash", "slash", "slash", "guard", "guard", "stab", "stab", "herb", "flip", "smash"];

/* ---------- 적 ---------- */
const FOES = {
  slime:  { n: "슬라임",     hp: 16, spr: "slime",  pat: [["atk", 5], ["block", 5], ["atk", 6]] },
  bat:    { n: "박쥐",       hp: 13, spr: "bat",    pat: [["atk", 2, 3], ["atk", 4], ["atk", 3, 2]] },
  shroom: { n: "독버섯",     hp: 20, spr: "shroom", pat: [["poison", 3], ["atk", 5], ["atk", 6]] },
  skel:   { n: "해골 병사",  hp: 24, spr: "skel",   pat: [["atk", 7], ["block", 8], ["atk", 4, 2]] },
  golem:  { n: "돌 골렘",    hp: 32, spr: "golem",  pat: [["block", 10], ["atk", 13], ["atk", 5]] },
  boss:   { n: "주사위 마왕", hp: 60, spr: "boss",  pat: [["atk", 8], ["curse"], ["atk", 4, 3], ["block", 12], ["atk", 15]], scale: 4 }
};
const FLOORS = [["slime", "bat"], ["bat", "shroom"], ["shroom", "skel"], ["skel", "golem"], ["boss"]];

/* ---------- 상태 ---------- */
let S, uid = 0;
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const roll = () => 1 + Math.floor(Math.random() * 6);

function newRun() {
  S = { hp: 40, max: 40, block: 0, poison: 0, curse: 0, deck: STARTER.slice(), draw: [], discard: [],
        hand: [], dice: [], sel: null, rerolls: 1, floor: 1, foe: null, busy: false };
  startFloor();
}
function startFloor() {
  const key = pick(FLOORS[S.floor - 1]), f = FOES[key];
  S.foe = { key, n: f.n, hp: f.hp, max: f.hp, block: 0, poison: 0, step: 0, pat: f.pat, spr: f.spr, scale: f.scale || 3 };
  S.draw = shuffle(S.deck.slice()); S.discard = []; S.hand = [];
  S.block = 0; S.poison = 0; S.curse = 0;
  anim.foeDead = 0;
  startTurn();
}

async function startTurn() {
  S.busy = true;
  S.block = 0;
  if (S.poison > 0) {
    hurtPlayer(S.poison, true); S.poison--; render(); await sleep(450);
    if (S.hp <= 0) return gameOver();
  }
  const n = Math.max(1, 3 - S.curse); S.curse = 0;
  S.dice = Array.from({ length: n }, () => ({ id: ++uid, v: roll() }));
  S.sel = null; S.rerolls = 1;
  drawCards(5);
  await rollAnim(S.dice.map(d => d.id));
  S.busy = false;
  say("주사위를 고른 뒤 카드를 누르세요");
  render();
}
function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (!S.draw.length) { S.draw = shuffle(S.discard); S.discard = []; }
    if (!S.draw.length) break;
    S.hand.push({ uid: ++uid, key: S.draw.pop(), fill: [] });
  }
}
async function rollAnim(ids) {
  rolling = new Set(ids); render();
  const t = setInterval(() => {
    document.querySelectorAll(".die.rolling").forEach(el => setPips(el, roll()));
  }, 70);
  await sleep(reduced ? 0 : 420);
  clearInterval(t); rolling = new Set(); render();
}

/* ---------- 효과 ---------- */
function attack(n) {
  const f = S.foe, hit = Math.max(0, n - f.block);
  f.block = Math.max(0, f.block - n); f.hp = Math.max(0, f.hp - hit);
  anim.lunge = 1; anim.foeHit = 1;
  float(170, 50, hit ? "-" + hit : "막힘", hit ? "#ff7a6e" : "#a9cff0");
}
function gainBlock(n) { S.block += n; float(60, 50, "+" + n, "#a9cff0"); }
function heal(n) { const h = Math.min(n, S.max - S.hp); S.hp += h; float(60, 50, "+" + h, "#b6e29a"); }
function poisonFoe(n) { S.foe.poison += n; float(170, 40, "독+" + n, "#b6e29a"); }
function addDie(v) { const d = { id: ++uid, v }; S.dice.push(d); }
function hurtPlayer(n, pierce) {
  const hit = pierce ? n : Math.max(0, n - S.block);
  if (!pierce) S.block = Math.max(0, S.block - n);
  S.hp = Math.max(0, S.hp - hit); anim.pHit = 1;
  float(60, 50, hit ? "-" + hit : "막힘", hit ? (pierce ? "#b6e29a" : "#ff7a6e") : "#a9cff0");
}

/* ---------- 조작 ---------- */
let rolling = new Set();
function tapDie(id) {
  if (S.busy) return;
  S.sel = S.sel === id ? null : id;
  say(S.sel ? "이 눈을 넣을 카드를 누르세요" : "주사위를 고른 뒤 카드를 누르세요");
  render();
}
function canTake(card, v) {
  const def = CARDS[card.key], c = COND[def.s[card.fill.length]];
  return c.ok(v, card.fill.map(x => x.v));
}
function tapCard(uidc, el) {
  if (S.busy) return;
  const card = S.hand.find(c => c.uid === uidc); if (!card) return;
  const def = CARDS[card.key];
  if (S.sel == null) {
    if (card.fill.length) { // 넣었던 주사위 되돌리기
      card.fill.forEach(x => addDie(x.v)); card.fill = []; say("주사위를 되돌렸어요"); render();
    } else { say("먼저 주사위를 고르세요"); nudge(el); }
    return;
  }
  const die = S.dice.find(d => d.id === S.sel);
  if (!canTake(card, die.v)) { say(`${def.n}: ${COND[def.s[card.fill.length]].t}만 넣을 수 있어요`); nudge(el); return; }
  S.dice = S.dice.filter(d => d.id !== die.id); S.sel = null;
  card.fill.push({ v: die.v });
  if (card.fill.length === def.s.length) {
    S.hand = S.hand.filter(c => c !== card); S.discard.push(card.key);
    def.fx(card.fill.map(x => x.v));
    say(`${def.n} 사용`);
    if (S.foe.hp <= 0) { render(); return foeDefeated(); }
  } else say(`${def.n}: 주사위 하나 더`);
  render();
}
function nudge(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
async function doReroll() {
  if (S.busy || S.rerolls < 1 || !S.dice.length) return;
  S.rerolls--; S.sel = null; S.dice.forEach(d => d.v = roll());
  S.busy = true; await rollAnim(S.dice.map(d => d.id)); S.busy = false; render();
}

async function endTurn() {
  if (S.busy) return;
  S.busy = true;
  S.hand.forEach(c => S.discard.push(c.key)); S.hand = []; S.dice = []; S.sel = null;
  say(`${S.foe.n}의 차례`); render();
  await sleep(350);
  const f = S.foe; f.block = 0;
  if (f.poison > 0) {
    f.hp = Math.max(0, f.hp - f.poison); anim.foeHit = 1; float(170, 50, "-" + f.poison, "#b6e29a");
    f.poison--; render(); await sleep(450);
    if (f.hp <= 0) return foeDefeated();
  }
  const [type, n, times] = f.pat[f.step % f.pat.length];
  if (type === "atk") {
    for (let i = 0; i < (times || 1); i++) {
      anim.foeLunge = 1; await sleep(120); hurtPlayer(n); render(); await sleep(330);
      if (S.hp <= 0) return gameOver();
    }
  } else if (type === "block") { f.block += n; float(170, 50, "+" + n, "#a9cff0"); }
  else if (type === "poison") { S.poison += n; float(60, 40, "독+" + n, "#b6e29a"); }
  else if (type === "curse") { S.curse = 1; float(60, 40, "저주", "#d5b2f0"); }
  f.step++; render(); await sleep(400);
  startTurn();
}

/* ---------- 층 이동 / 끝 ---------- */
async function foeDefeated() {
  S.busy = true; anim.foeDead = 0.001; await sleep(700);
  if (S.floor >= 5) return showEnd(true);
  const pool = shuffle(Object.keys(CARDS)).slice(0, 3);
  overlay(`<h2>${S.foe.n} 처치!</h2><p>카드 한 장을 덱에 넣으세요. 다음 층으로 가면서 체력 8을 회복해요.</p>
    <div class="hand">${pool.map(k => cardHTML({ key: k, fill: [], uid: k })).join("")}</div>
    <button class="btn" id="skipBtn" type="button">넘어가기</button>`);
  $("ovBox").querySelectorAll(".card").forEach(el => el.onclick = () => nextFloor(el.dataset.uid));
  $("skipBtn").onclick = () => nextFloor(null);
}
function nextFloor(key) {
  if (key) S.deck.push(key);
  S.hp = Math.min(S.max, S.hp + 8); S.floor++;
  $("ov").hidden = true; startFloor();
}
function gameOver() { showEnd(false); }
function showEnd(win) {
  S.busy = true;
  overlay(win
    ? `<h2>던전 정복</h2><p>주사위 마왕을 쓰러뜨렸어요. 남은 체력 ${S.hp}, 덱 ${S.deck.length}장.</p><button class="btn main" id="againBtn" type="button">다시 도전</button>`
    : `<h2>쓰러졌어요</h2><p>지하 ${S.floor}층, ${S.foe.n}에게 졌어요.</p><button class="btn main" id="againBtn" type="button">다시 도전</button>`);
  $("againBtn").onclick = () => { $("ov").hidden = true; newRun(); };
}
function overlay(html) { $("ovBox").innerHTML = html; $("ov").hidden = false; }

/* ---------- 화면 그리기 ---------- */
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function setPips(el, v) { el.querySelectorAll("span").forEach((s, i) => s.classList.toggle("on", PIPS[v].includes(i))); }
function dieHTML(d) {
  return `<button type="button" class="die${S.sel === d.id ? " sel" : ""}${rolling.has(d.id) ? " rolling" : ""}" data-id="${d.id}" aria-label="주사위 ${d.v}">${
    Array.from({ length: 9 }, (_, i) => `<span class="${PIPS[d.v].includes(i) ? "on" : ""}"></span>`).join("")}</button>`;
}
function cardHTML(c, cls = "") {
  const def = CARDS[c.key];
  const slots = def.s.map((k, i) => c.fill[i]
    ? `<div class="slot full">${c.fill[i].v}</div>`
    : `<div class="slot">${COND[k].t}</div>`).join("");
  return `<button type="button" class="card ${cls}" data-uid="${c.uid}"><span class="cn">${def.n}</span><div class="slots">${slots}</div><span class="cd">${def.d}</span></button>`;
}
function intentOf(f) {
  const [type, n, times] = f.pat[f.step % f.pat.length];
  if (type === "atk") return ["", `공격 ${n}${times > 1 ? "×" + times : ""}`];
  if (type === "block") return ["block", `방어 ${n}`];
  if (type === "poison") return ["poison", `독 ${n}`];
  return ["curse", "저주: 다음 턴 주사위 −1"];
}
function say(t) { $("msg").textContent = t; }
function render() {
  const f = S.foe;
  $("floorNo").textContent = S.floor;
  $("pBar").style.width = (S.hp / S.max * 100) + "%";
  $("pHp").textContent = `HP ${S.hp}/${S.max}`;
  $("pBlk").textContent = S.block ? `방어 ${S.block}` : "";
  $("pPsn").textContent = S.poison ? `독 ${S.poison}` : "";
  $("eName").textContent = f.n;
  $("eBar").style.width = (f.hp / f.max * 100) + "%";
  $("eHp").textContent = `HP ${f.hp}/${f.max}`;
  $("eBlk").textContent = f.block ? `방어 ${f.block}` : "";
  $("ePsn").textContent = f.poison ? `독 ${f.poison}` : "";
  const [ic, it] = intentOf(f); const ie = $("eIntent"); ie.className = "intent " + ic; ie.textContent = "다음: " + it;

  $("dice").innerHTML = S.dice.length ? S.dice.map(dieHTML).join("") : `<span class="empty">남은 주사위 없음</span>`;
  $("dice").querySelectorAll(".die").forEach(el => el.onclick = () => tapDie(+el.dataset.id));
  $("rerollBtn").disabled = S.busy || S.rerolls < 1 || !S.dice.length;
  $("rerollLeft").textContent = `남은 ${S.rerolls}`;

  const sel = S.sel != null ? S.dice.find(d => d.id === S.sel) : null;
  $("hand").innerHTML = S.hand.map(c => cardHTML(c, sel ? (canTake(c, sel.v) ? "fit" : "nofit") : "")).join("");
  $("hand").querySelectorAll(".card").forEach(el => el.onclick = () => tapCard(+el.dataset.uid, el));
  $("pile").textContent = `덱 ${S.draw.length} · 버림 ${S.discard.length}`;
  $("endBtn").disabled = S.busy;
}

/* ---------- 캔버스 (전장) ---------- */
const cv = $("cv"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const anim = { lunge: 0, foeLunge: 0, pHit: 0, foeHit: 0, foeDead: 0, floats: [] };
function float(x, y, text, color) { anim.floats.push({ x, y, text, color, t: 0 }); }

function drawSprite(spr, cx, by, s, flash, alpha = 1) {
  const rows = spr.rows, top = by - rows.length * s, left = Math.round(cx - 8 * s);
  ctx.globalAlpha = alpha;
  for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) {
    const ch = rows[j][i]; if (ch === ".") continue;
    ctx.fillStyle = flash ? "#ffffff" : spr.pal[ch];
    ctx.fillRect(left + i * s, top + j * s, s, s);
  }
  ctx.globalAlpha = 1;
}
function drawRoom(t) {
  ctx.fillStyle = "#2b2533"; ctx.fillRect(0, 0, 240, 120);
  ctx.fillStyle = "#231e2b";
  for (let y = 0; y < 88; y += 8) for (let x = (y / 8) % 2 ? -8 : 0; x < 240; x += 16) ctx.fillRect(x, y, 15, 7);
  ctx.fillStyle = "#1a1620"; ctx.fillRect(0, 88, 240, 32);
  ctx.fillStyle = "#211c28";
  for (let x = 0; x < 240; x += 12) ctx.fillRect(x, 92 + ((x / 12) % 2) * 6, 10, 2);
  [24, 216].forEach((x, k) => {
    ctx.fillStyle = "#4a3b2c"; ctx.fillRect(x - 1, 30, 3, 10);
    const fl = Math.floor(t / 120 + k) % 3;
    ctx.fillStyle = "#f08a3a"; ctx.fillRect(x - 2, 25 - fl, 5, 5 + fl);
    ctx.fillStyle = "#ffd36a"; ctx.fillRect(x - 1, 27 - fl, 3, 3);
  });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  drawRoom(now);
  if (S) {
    const bob = reduced ? 0 : Math.round(Math.sin(now / 300));
    const px = 60 + (anim.lunge > 0 ? Math.round(Math.sin(anim.lunge * Math.PI) * 14) : 0)
                  + (anim.pHit > 0 ? Math.round(Math.sin(anim.pHit * 30) * 2) : 0);
    drawSprite(SPR.knight, px, 96 + bob, 3, anim.pHit > 0.5);
    const f = S.foe, s = f.scale;
    const fx = 172 - (anim.foeLunge > 0 ? Math.round(Math.sin(anim.foeLunge * Math.PI) * 14) : 0)
                   + (anim.foeHit > 0 ? Math.round(Math.sin(anim.foeHit * 30) * 2) : 0);
    const flying = f.spr === "bat" ? -24 + Math.round(Math.sin(now / 180) * 3) : 0;
    const alpha = anim.foeDead > 0 ? Math.max(0, 1 - anim.foeDead) : 1;
    if (alpha > 0) drawSprite(SPR[f.spr], fx, 96 - bob + flying, s, anim.foeHit > 0.5, alpha);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(px - 14, 96, 28, 3); ctx.fillRect(172 - 8 * s + 4, 96, 16 * s - 8, 3);
  }
  ["lunge", "foeLunge", "pHit", "foeHit"].forEach(k => { if (anim[k] > 0) anim[k] = Math.max(0, anim[k] - dt / 260); });
  if (anim.foeDead > 0 && anim.foeDead < 1) anim.foeDead = Math.min(1, anim.foeDead + dt / 600);
  ctx.font = "8px Silkscreen, monospace"; ctx.textAlign = "center";
  anim.floats = anim.floats.filter(fl => (fl.t += dt) < 900);
  anim.floats.forEach(fl => {
    const y = Math.round(fl.y - fl.t / 30);
    ctx.fillStyle = "#15131c"; ctx.fillText(fl.text, fl.x + 1, y + 1);
    ctx.fillStyle = fl.color; ctx.fillText(fl.text, fl.x, y);
  });
  requestAnimationFrame(frame);
}

/* ---------- 시작 ---------- */
$("rerollBtn").onclick = doReroll;
$("endBtn").onclick = endTurn;
overlay(`<h2>주사위 던전</h2>
  <ul class="rules">
    <li>매 턴 주사위 3개를 굴리고 카드 5장을 뽑아요.</li>
    <li>주사위를 고르고 카드를 누르면 눈이 들어가요. 칸이 다 차면 카드가 발동해요.</li>
    <li>카드마다 받는 눈이 정해져 있어요. 짝수, 5 이상, 같은 눈 두 개처럼요.</li>
    <li>다시 굴림은 턴마다 한 번. 반쯤 채운 카드를 누르면 주사위가 돌아와요.</li>
    <li>지하 5층의 주사위 마왕을 쓰러뜨리면 승리!</li>
  </ul>
  <button class="btn main" id="startBtn" type="button">던전 입장</button>`);
$("startBtn").onclick = () => { $("ov").hidden = true; newRun(); };
requestAnimationFrame(frame);
})();
</script>
