<title>주사위 던전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=Silkscreen:wght@400;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 화면. 전장(캔버스) → 상태 → 주사위 5개 → 필드 5칸 → 족보 → 손패 → 버튼. 던전 색감으로 고정한 단일 테마. */
:root {
  color-scheme: dark;
  --bg: #1b1824;
  --panel: #262130;
  --line: #3e3549;
  --ink: #ece3cf;
  --muted: #9b90a9;
  --gold: #f0b54a;
  --parch: #e8d6a6;
  --parch-dim: #b9a97f;
  --parch-ink: #2e2418;
  --die: #f4ecdb;
  --die-ink: #2a2230;
  --hp: #d4574e;
  --unit-hp: #6cc04a;
  --block: #5b9fd6;
  --poison: #7cbf57;
  --fire: #d9533c;
  --water: #3f86d1;
  --leaf: #4f9e3b;
  --bolt: #c99a12;
  --item: #6d5a8f;
  --sup: #8f5a6d;
  --font-display: "Do Hyeon", "Nanum Gothic", system-ui, sans-serif;
  --font-body: "Nanum Gothic", system-ui, sans-serif;
  --font-num: "Silkscreen", ui-monospace, monospace;
  --notch: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; color: var(--gold); }
.floor { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.floor b { color: var(--ink); }
.help { font-size: 12px; font-weight: 800; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px; font-family: var(--font-body); }

.stage { background: var(--panel); clip-path: var(--notch); }
canvas#cv { display: block; width: 100%; height: auto; aspect-ratio: 12 / 5; image-rendering: pixelated; image-rendering: crisp-edges; }

.status { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.unit { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.unit.foe { text-align: right; align-items: flex-end; }
.uname { font-family: var(--font-display); font-size: 18px; line-height: 1; }
.bar { width: 100%; height: 10px; background: #120f18; position: relative; clip-path: var(--notch); }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--hp); transition: width .25s steps(6); }
.bar.team i { background: var(--unit-hp); }
.unit.foe .bar i { inset: 0 0 0 auto; }
.nums { font-family: var(--font-num); font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.unit.foe .nums { justify-content: flex-end; }
.nums .hp { color: var(--ink); } .nums .blk { color: var(--block); } .nums .psn { color: var(--poison); }
.intent { font-size: 13px; font-weight: 800; padding: 3px 8px; background: #3a2230; color: #f3b3aa; clip-path: var(--notch); white-space: nowrap; }
.intent.block { background: #1f3045; color: #a9cff0; }
.intent.poison { background: #22361c; color: #b6e29a; }
.intent.curse { background: #35233f; color: #d5b2f0; }

.tray { display: flex; flex-direction: column; gap: 8px; background: var(--panel); padding: 10px; clip-path: var(--notch); }
.dice { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; min-height: 48px; }
.die {
  width: 100%; max-width: 50px; aspect-ratio: 1; padding: 7px; border: 0; cursor: pointer; justify-self: center;
  background: var(--die); color: var(--die-ink);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); place-items: center;
  clip-path: var(--notch); box-shadow: inset -3px -3px 0 #c9bca1; transition: transform .08s steps(2);
}
.die span { width: 6px; height: 6px; background: var(--die-ink); visibility: hidden; }
.die span.on { visibility: visible; }
.die.held { background: #bcd6ee; box-shadow: inset -3px -3px 0 #7da6cc, inset 0 0 0 3px var(--block); }
.die.sel { background: var(--gold); box-shadow: inset -3px -3px 0 #b07d22; transform: translateY(-4px); }
.die.used { opacity: .18; cursor: default; }
.die.rolling { animation: wobble .1s steps(2) infinite; }
@keyframes wobble { 0% { transform: rotate(-8deg); } 100% { transform: rotate(8deg); } }
.trayRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.phase { font-size: 12.5px; font-weight: 800; color: var(--muted); }

.btn {
  font-family: var(--font-display); font-size: 17px; border: 0; cursor: pointer;
  padding: 9px 14px; background: var(--line); color: var(--ink); clip-path: var(--notch);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); white-space: nowrap;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.main { background: var(--gold); color: #2b1d08; }
.die:focus-visible, .btn:focus-visible, .card:focus-visible, .slotBox:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.label { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .06em; }
.field { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.slotBox {
  border: 0; font: inherit; cursor: pointer; min-width: 0; text-align: center;
  min-height: 150px; padding: 5px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: #211c2a; color: var(--muted); clip-path: var(--notch);
  box-shadow: inset 0 0 0 2px var(--line);
}
.slotBox.empty { justify-content: center; font-size: 11px; font-weight: 800; }
.slotBox.target { box-shadow: inset 0 0 0 2px var(--hp); }
.slotBox .tgt { font-size: 10px; font-weight: 800; color: #ff8d80; min-height: 12px; }
.slotBox.drop { box-shadow: inset 0 0 0 3px var(--gold); color: var(--gold); }
.slotBox.u { background: var(--parch); color: var(--parch-ink); }
.slotBox.u.fire { box-shadow: inset 0 4px 0 var(--fire); }
.slotBox.u.water { box-shadow: inset 0 4px 0 var(--water); }
.slotBox.u.leaf { box-shadow: inset 0 4px 0 var(--leaf); }
.slotBox.u.bolt { box-shadow: inset 0 4px 0 var(--bolt); }
.slotBox.u.target { box-shadow: inset 0 4px 0 var(--hp), inset 0 0 0 2px var(--hp); }
.slotBox.u.fit { box-shadow: inset 0 0 0 3px var(--gold); transform: translateY(-3px); }
.slotBox.u.nofit { opacity: .5; }
.slotBox.u.ready { box-shadow: inset 0 0 0 3px var(--gold); }
.slotBox.shake { animation: shake .24s steps(3); }
.slotBox img { width: 32px; height: 32px; image-rendering: pixelated; }
.un { font-family: var(--font-display); font-size: 13px; line-height: 1.05; word-break: keep-all; }
.lv { font-family: var(--font-num); font-size: 9px; color: #6e5c3a; }
.mini { width: 100%; height: 5px; background: #4a3d2c; position: relative; }
.mini i { position: absolute; inset: 0 auto 0 0; background: var(--unit-hp); }
.uhp { font-family: var(--font-num); font-size: 9px; }
.dslots { display: flex; gap: 3px; width: 100%; }
.ds { flex: 1; min-width: 0; height: 22px; border: 2px dashed #8a7650; display: flex; align-items: center; justify-content: center; font-family: var(--font-num); font-size: 10px; color: #8a7650; }
.ds.full { border: 0; background: var(--die-ink); color: var(--die); font-size: 12px; }
.ue { font-size: 10.5px; font-weight: 800; line-height: 1.2; }

.combos { display: flex; flex-direction: column; gap: 4px; }
.combo { display: flex; align-items: baseline; gap: 6px; font-size: 13px; flex-wrap: wrap; }
.combo .src { font-size: 10.5px; font-weight: 800; padding: 1px 6px; background: var(--line); color: var(--muted); }
.combo .src.d { background: #f4ecdb; color: var(--die-ink); }
.combo b { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--gold); }
.combo .fx { font-weight: 700; }
.combo.dim { opacity: .55; }
.total { font-family: var(--font-num); font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.total .a { color: #ff9a8e; } .total .b { color: var(--block); } .total .p { color: var(--poison); }
.msg { font-size: 13px; color: var(--muted); min-height: 1.4em; text-align: center; }

.hand { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.card {
  flex: 0 0 96px; border: 0; cursor: pointer; text-align: left; font: inherit;
  background: var(--parch); color: var(--parch-ink); padding: 0 0 7px;
  display: flex; flex-direction: column; gap: 4px; clip-path: var(--notch);
  box-shadow: inset -3px -3px 0 var(--parch-dim); transition: transform .08s steps(2);
}
.card .top { display: flex; justify-content: space-between; align-items: center; padding: 3px 6px; color: #fff; font-size: 10.5px; font-weight: 800; }
.card.fire .top { background: var(--fire); } .card.water .top { background: var(--water); }
.card.leaf .top { background: var(--leaf); } .card.bolt .top { background: var(--bolt); }
.card.item .top { background: var(--item); } .card.sup .top { background: var(--sup); }
.card .cn { font-family: var(--font-display); font-size: 16px; line-height: 1.05; padding: 0 6px; }
.card .cd { font-size: 11px; line-height: 1.3; font-weight: 700; padding: 0 6px; }
.card .cd b { font-family: var(--font-num); font-weight: 700; }
.card.picked { transform: translateY(-4px); box-shadow: inset -3px -3px 0 var(--parch-dim), inset 0 0 0 3px var(--gold); }
.card.off { opacity: .45; }
.card.shake { animation: shake .24s steps(3); }
@keyframes shake { 0%,100% { transform: translateX(0); } 33% { transform: translateX(-4px); } 66% { transform: translateX(4px); } }

footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pile { font-family: var(--font-num); font-size: 11px; color: var(--muted); }

.overlay { position: fixed; inset: 0; background: rgba(12,10,16,.84); display: flex; z-index: 20; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.box { background: var(--panel); clip-path: var(--notch); padding: 20px 16px; width: min(440px, 100%); display: flex; flex-direction: column; gap: 14px; text-align: center; margin: auto; }
.box h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; color: var(--gold); text-wrap: balance; }
.box h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 0; text-align: left; }
.box p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.box .hand { justify-content: center; flex-wrap: wrap; overflow: visible; }
.rules { text-align: left; font-size: 13px; line-height: 1.6; margin: 0; padding-left: 18px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
.tbl td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td:first-child { font-family: var(--font-display); font-size: 15px; color: var(--gold); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .die.rolling, .card.shake, .slotBox.shake { animation: none; }
  .die, .card, .bar i { transition: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>주사위 던전</h1>
    <div><button class="help" id="helpBtn" type="button">규칙·족보</button> <span class="floor">FLOOR <b id="floorNo">1</b>/5</span></div>
  </header>

  <div class="stage"><canvas id="cv" width="240" height="100"></canvas></div>

  <div class="status">
    <div class="unit">
      <div class="uname">우리 편</div>
      <div class="bar team"><i id="pBar"></i></div>
      <div class="nums"><span class="hp" id="pHp"></span><span class="blk" id="pBlk"></span><span class="psn" id="pPsn"></span></div>
    </div>
    <div class="unit foe">
      <div class="uname" id="eName"></div>
      <div class="bar"><i id="eBar"></i></div>

      <div class="intent" id="eIntent"></div>
    </div>
  </div>

  <div class="tray">
    <div class="dice" id="dice"></div>
    <div class="trayRow">
      <span class="phase" id="phase"></span>
      <button class="btn" id="rerollBtn" type="button">다시 굴림</button>
    </div>
  </div>

  <div class="label">필드</div>
  <div class="field" id="field"></div>
  <div class="combos" id="combos"></div>
  <div class="total" id="total"></div>
  <div class="msg" id="msg"></div>

  <div class="label">손패</div>
  <div class="hand" id="hand"></div>

  <footer>
    <div class="pile" id="pile"></div>
    <button class="btn main" id="mainBtn" type="button">굴림 확정</button>
  </footer>
</div>

<div class="overlay" id="ov" hidden><div class="box" id="ovBox"></div></div>

  leaf:  { t: "독 +4",        fx: e => e.psn += 4 },
  bolt:  { t: "관통 피해 +5", fx: e => e.pierce += 5 }
};
const isTwo = lv => lv > 6;

/* ---------- 적 ---------- */
const FOES = {
  slime:  { n: "슬라임",      hp: 40,  spr: "slime",  pat: [["atk", 8], ["block", 8], ["atk", 10]] },
  bat:    { n: "박쥐",        hp: 34,  spr: "bat",    pat: [["atk", 4, 3], ["atk", 9], ["atk", 5, 2]] },
  shroom: { n: "독버섯",      hp: 50,  spr: "shroom", pat: [["poison", 4], ["atk", 10], ["atk", 11]] },
  skel:   { n: "해골 병사",   hp: 64,  spr: "skel",   pat: [["atk", 14], ["block", 14], ["atk", 8, 2]] },
  golem:  { n: "돌 골렘",     hp: 80,  spr: "golem",  pat: [["block", 18], ["atk", 26], ["atk", 12]] },
  boss:   { n: "주사위 마왕", hp: 150, spr: "boss",   pat: [["atk", 16], ["curse"], ["atk", 8, 3], ["block", 22], ["atk", 30]], scale: 4 }
};
const FLOORS = [["slime", "bat"], ["bat", "shroom"], ["shroom", "skel"], ["skel", "golem"], ["boss"]];

/* ---------- 족보 ---------- */
function yachtOf(vals) {
  if (vals.length < 4) return null;
  const cnt = {}; vals.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
  const cs = Object.values(cnt).sort((a, b) => b - a);
  const has = s => s.every(v => cnt[v]);
  if (cs[0] >= 5) return { n: "요트", t: "모든 피해 2배", fx: e => e.mult = 2 };
  if (has([1, 2, 3, 4, 5]) || has([2, 3, 4, 5, 6])) return { n: "라지 스트레이트", t: "피해 +8", fx: e => e.atk += 8 };
  if (cs[0] === 4) return { n: "포카드", t: "피해 +10", fx: e => e.atk += 10 };
  if (cs[0] === 3 && cs[1] >= 2) return { n: "풀하우스", t: "방어 +10", fx: e => e.def += 10 };
  if (has([1, 2, 3, 4]) || has([2, 3, 4, 5]) || has([3, 4, 5, 6])) return { n: "스몰 스트레이트", t: "피해 +4", fx: e => e.atk += 4 };
  return null;
}
// 필드에 놓인 동료끼리 (레벨 = 숫자, 속성 = 모양)
function pokerOf(units) {
  const out = [];
  if (!units.length) return out;
  const cnt = {}; units.forEach(u => cnt[u.lv] = (cnt[u.lv] || 0) + 1);
  const cs = Object.values(cnt).sort((a, b) => b - a);
  if (cs[0] >= 3) out.push({ n: "트리플", t: "피해 +8", fx: e => e.atk += 8 });
  else if (cs[0] === 2 && cs[1] === 2) out.push({ n: "투페어", t: "피해 +6", fx: e => e.atk += 6 });
  else if (cs[0] === 2) out.push({ n: "원페어", t: "피해 +3", fx: e => e.atk += 3 });
  const nums = [...new Set(units.map(u => u.lv))].sort((a, b) => a - b);
  let run = 1, best = 1;
  for (let i = 1; i < nums.length; i++) { run = nums[i] === nums[i - 1] + 1 ? run + 1 : 1; best = Math.max(best, run); }
  if (best >= 3) out.push({ n: "스트레이트", t: "다시 굴림 +1", straight: true, fx: () => {} });
  const sc = {}; units.forEach(u => sc[u.suit] = (sc[u.suit] || 0) + 1);
  Object.keys(sc).forEach(s => { if (sc[s] >= 3) out.push({ n: SUIT[s] + " 플러시", t: FLUSH[s].t, fx: FLUSH[s].fx }); });
  return out;
}

/* ---------- 상태 ---------- */
let S, uid = 0, rolling = new Set();
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const roll = () => 1 + Math.floor(Math.random() * 6);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const unitsOnField = () => S.field.filter(Boolean).map(f => ({ ...CARD[f.key], ...f }));

function newRun() {
  S = { block: 0, curse: 0, deck: STARTER.slice(), floor: 1, foe: null };
  startFloor();
}
function startFloor() {
  const key = pick(FLOORS[S.floor - 1]), f = FOES[key];
  S.foe = { key, n: f.n, hp: f.hp, max: f.hp, block: 0, poison: 0, step: 0, pat: f.pat, spr: f.spr, scale: f.scale || 3, target: 0 };
  Object.assign(S, { draw: shuffle(S.deck.slice()), discard: [], hand: [], field: [null, null, null, null, null],
    dice: [], sel: null, picked: null, rollsUsed: 0, extraRolls: 0, supUsed: false, phase: "roll",
    block: 0, curse: 0, turn: 0, busy: false });
  // 첫 손패: 동료 2장은 꼭 들어오게
  for (let k = 0; k < 2; k++) {
    const i = S.draw.findIndex(c => CARD[c].type === "unit");
    if (i >= 0) S.hand.push({ uid: ++uid, key: S.draw.splice(i, 1)[0] });
  }
  drawCards(3);
  anim.foeDead = 0;
  startTurn();
}
function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (S.hand.length >= 8) break;
    if (!S.draw.length) { S.draw = shuffle(S.discard); S.discard = []; }
    if (!S.draw.length) break;
    S.hand.push({ uid: ++uid, key: S.draw.pop() });
  }
}
function chooseTarget() {
  const occ = S.field.map((f, i) => f ? i : -1).filter(i => i >= 0);
  S.foe.target = occ.length ? pick(occ) : -1;
}
async function startTurn() {
  S.busy = true; S.block = 0; S.turn++;
  let ticked = false;
  S.field.forEach((u, i) => {
    if (!u || !u.psn) return;
    u.hp = Math.max(0, u.hp - u.psn); float(unitX(i), 40, "-" + u.psn, "#b6e29a"); anim.uHit[i] = 1; u.psn--; ticked = true;
    if (u.hp <= 0) { S.field[i] = null; S.discard.push(u.key); }
  });
  if (ticked) { render(); await sleep(450); }
  if (S.turn > 1) drawCards(2);
  const n = 5 - S.curse; S.curse = 0;
  S.dice = Array.from({ length: n }, () => ({ id: ++uid, v: roll(), held: false, used: false }));
  S.field.forEach(f => f && (f.fill = []));
  S.sel = null; S.picked = null; S.phase = "roll"; S.rollsUsed = 0; S.extraRolls = 0; S.supUsed = false;
  chooseTarget();
  await rollAnim(S.dice.map(d => d.id));
  S.busy = false;
  say("동료를 필드에 내고, 남길 주사위를 고정해 다시 굴리세요");
  render();
}
async function rollAnim(ids) {
  rolling = new Set(ids); render();
  const t = setInterval(() => document.querySelectorAll(".die.rolling").forEach(el => setPips(el, roll())), 70);
  await sleep(reduced ? 0 : 420);
  clearInterval(t); rolling = new Set(); render();
}
function rollsLeft() {
  const straight = pokerOf(unitsOnField()).some(p => p.straight) ? 1 : 0;
  return 2 + straight + S.extraRolls - S.rollsUsed;
}

/* ---------- 조작: 주사위 ---------- */
function tapDie(id) {
  if (S.busy) return;
  const d = S.dice.find(x => x.id === id); if (!d || d.used) return;
  S.picked = null;
  if (S.phase === "roll") { d.held = !d.held; render(); return; }
  S.sel = S.sel === id ? null : id;
  say(S.sel ? "이 눈을 쓸 동료를 누르세요" : "주사위를 고른 뒤 동료를 누르세요");
  render();
}
async function doReroll() {
  if (S.busy || S.phase !== "roll" || rollsLeft() < 1) return;
  const free = S.dice.filter(d => !d.held);
  if (!free.length) { say("고정을 풀어야 다시 굴릴 수 있어요"); return; }
  S.rollsUsed++; free.forEach(d => d.v = roll());
  S.busy = true; await rollAnim(free.map(d => d.id)); S.busy = false;
  render();
}
function lockDice() {
  if (S.busy || S.phase !== "roll") return;
  S.phase = "assign"; S.dice.forEach(d => d.held = false); S.picked = null;
  say("주사위를 고른 뒤 동료를 누르세요. 다 넣었으면 발동!");
  render();
}

/* ---------- 조작: 필드 ---------- */
const full = f => f.fill.length === (isTwo(CARD[f.key].lv) ? 2 : 1);
function canTake(f, v) {
  const lv = CARD[f.key].lv;
  if (full(f)) return false;
  if (!isTwo(lv)) return v >= lv;
  if (!f.fill.length) return v + 6 >= lv;
  return f.fill[0].v + v >= lv;
}
function tapSlot(i, el) {
  if (S.busy) return;
  const f = S.field[i];
  if (S.picked != null) { // 손패의 동료를 이 칸에 소환
    if (f) { say("빈 칸을 골라 주세요"); nudge(el); return; }
    const hc = S.hand.find(c => c.uid === S.picked);
    S.hand = S.hand.filter(c => c !== hc); S.picked = null;
    S.field[i] = { uid: ++uid, key: hc.key, hp: CARD[hc.key].hp, max: CARD[hc.key].hp, fill: [], psn: 0 };
    say(`${CARD[hc.key].n} 소환!`); render(); return;
  }
  if (!f) { say("손패에서 동료 카드를 고르면 이 칸에 낼 수 있어요"); return; }
  if (S.phase === "roll") { say("먼저 굴림을 확정하세요"); nudge(el); return; }
  const def = CARD[f.key];
  if (S.sel == null) {
    if (f.fill.length) {
      f.fill.forEach(x => { const d = S.dice.find(y => y.id === x.id); if (d) d.used = false; });
      f.fill = []; say("주사위를 되돌렸어요"); render();
    } else { say("먼저 주사위를 고르세요"); nudge(el); }
    return;
  }
  const d = S.dice.find(x => x.id === S.sel);
  if (!canTake(f, d.v)) {
    say(isTwo(def.lv) ? `${def.n}: 두 주사위 합 ${def.lv} 이상` : `${def.n}: 눈 ${def.lv} 이상`);
    nudge(el); return;
  }
  d.used = true; S.sel = null; f.fill.push({ id: d.id, v: d.v });
  say(full(f) ? `${def.n} 준비 완료` : `${def.n}: 주사위 하나 더`);
  render();
}
function nudge(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

/* ---------- 조작: 손패 ---------- */
function mostHurt() {
  let best = null;
  S.field.forEach(f => { if (f && f.hp < f.max && (!best || f.max - f.hp > best.max - best.hp)) best = f; });
  return best;
}
function healUnit(f, n) { if (!f) return 0; const h = Math.min(n, f.max - f.hp); f.hp += h; return h; }
function tapHand(cid, el) {
  if (S.busy) return;
  const c = S.hand.find(x => x.uid === cid); if (!c) return;
  const def = CARD[c.key];
  if (def.type === "unit") {
    if (!S.field.includes(null)) { say("필드가 가득 찼어요"); nudge(el); return; }
    S.picked = S.picked === cid ? null : cid; S.sel = null;
    say(S.picked ? "동료를 놓을 빈 칸을 누르세요" : "");
    render(); return;
  }
  if (def.type === "sup" && S.supUsed) { say("서포트는 턴에 1장만 쓸 수 있어요"); nudge(el); return; }
  let ok = true;
  switch (c.key) {
    case "potion": { const f = mostHurt(); if (!f) { ok = false; say("다친 동료가 없어요"); } else float(unitX(S.field.indexOf(f)), 44, "+" + healUnit(f, 15), "#b6e29a"); break; }
    case "whet": {
      const d = S.phase === "assign" && S.sel != null ? S.dice.find(x => x.id === S.sel) : null;
      if (!d) { ok = false; say("굴림을 확정하고 주사위를 고른 뒤 쓰세요"); }
      else if (d.v >= 6) { ok = false; say("이미 6이에요"); }
      else { d.v++; float(120, 44, "눈+1", "#f0b54a"); }
      break;
    }
    case "coin": if (S.phase !== "roll") { ok = false; say("굴리는 중에만 쓸 수 있어요"); } else S.extraRolls++; break;
    case "shield": S.block += 8; float(64, 30, "방어+8", "#a9cff0"); break;
    case "mage": S.hand = S.hand.filter(x => x !== c); drawCards(2); S.discard.push(c.key); S.supUsed = true; say("카드 2장을 뽑았어요"); render(); return;
    case "smith": {
      const d = { id: ++uid, v: roll(), held: false, used: false }; S.dice.push(d); break;
    }
    case "healer": S.field.forEach(f => f && healUnit(f, 10)); float(64, 30, "모두+10", "#b6e29a"); break;
  }
  if (!ok) { nudge(el); return; }
  S.hand = S.hand.filter(x => x !== c); S.discard.push(c.key);
  if (def.type === "sup") S.supUsed = true;
  if (!["whet", "coin"].includes(c.key) || ok) say(`${def.n} 사용`);
  render();
}

/* ---------- 이번 턴 계산 ---------- */
function evaluate() {
  const units = unitsOnField(), act = units.filter(u => u.fill.length === (isTwo(u.lv) ? 2 : 1));
  const e = { atk: 0, pierce: 0, def: 0, heal: [], team: 0, psn: 0, mult: 1 };
  act.forEach(u => { const [k, v] = u.eff; if (k === "heal") e.heal.push(v); else e[k] += v; });
  const tags = [];
  pokerOf(units).forEach(p => {
    if (!p.straight && !act.length) { tags.push({ src: "필드", ...p, idle: true }); return; }
    p.fx(e); tags.push({ src: "필드", ...p });
  });
  if (S.phase === "assign" || S.dice.length) {
    const y = yachtOf(S.dice.map(d => d.v));
    if (y) { y.fx(e); tags.push({ src: "주사위", ...y }); }
  }
  e.tags = tags; e.count = act.length;
  return e;
}
async function resolve() {
  if (S.busy || S.phase !== "assign") return;
  S.busy = true; S.picked = null; S.sel = null;
  const e = evaluate(), f = S.foe;
  if (e.def) { S.block += e.def; float(64, 30, "방어+" + e.def, "#a9cff0"); }
  e.heal.forEach(v => { const u = mostHurt(); const h = healUnit(u, v); if (h) float(unitX(S.field.indexOf(u)), 44, "+" + h, "#b6e29a"); });
  if (e.team) S.field.forEach(u => u && healUnit(u, e.team));
  if (e.psn) { f.poison += e.psn; float(196, 32, "독+" + e.psn, "#b6e29a"); }
  render(); await sleep(e.def || e.heal.length || e.team || e.psn ? 350 : 0);
  const dmg = e.atk * e.mult, prc = e.pierce * e.mult;
  if (dmg || prc) {
    anim.lunge = 1; await sleep(130);
    const hit = Math.max(0, dmg - f.block); f.block = Math.max(0, f.block - dmg);
    const total = hit + prc; f.hp = Math.max(0, f.hp - total); anim.foeHit = 1;
    float(196, 44, total ? "-" + total : "막힘", total ? "#ff7a6e" : "#a9cff0");
    render(); await sleep(450);
  }
  S.field.forEach(u => u && (u.fill = []));
  S.dice = [];
  if (f.hp <= 0) return foeDefeated();
  foeTurn();
}
async function foeTurn() {
  const f = S.foe; say(`${f.n}의 차례`); render();
  await sleep(350);
  f.block = 0;
  if (f.poison > 0) {
    f.hp = Math.max(0, f.hp - f.poison); anim.foeHit = 1; float(196, 44, "-" + f.poison, "#b6e29a");
    f.poison--; render(); await sleep(450);
    if (f.hp <= 0) return foeDefeated();
  }
  const [type, n, times] = f.pat[f.step % f.pat.length];
  if (type === "atk") {
    for (let i = 0; i < (times || 1); i++) {
      if (!S.field.some(Boolean)) return showEnd(false);
      anim.foeLunge = 1; await sleep(120); hitSlot(f.target, n); render(); await sleep(330);
    }
    if (!S.field.some(Boolean)) return showEnd(false);
  } else if (type === "block") { f.block += n; float(196, 44, "+" + n, "#a9cff0"); }
  else if (type === "poison") {
    const i = liveTarget(f.target);
    if (i < 0) return showEnd(false);
    S.field[i].psn += n; float(unitX(i), 36, "독+" + n, "#b6e29a");
  }
  else if (type === "curse") { S.curse = 1; float(64, 30, "저주", "#d5b2f0"); }
  f.step++; render(); await sleep(400);
  startTurn();
}
// 노린 칸이 비었으면 남은 동료 중 하나를 대신 노림
function liveTarget(i) {
  if (i >= 0 && S.field[i]) return i;
  const occ = S.field.map((f, k) => f ? k : -1).filter(k => k >= 0);
  return occ.length ? pick(occ) : -1;
}
// 적 공격: 우리 편 방어 → 노린 칸의 동료
function hitSlot(t, n) {
  const i = liveTarget(t); if (i < 0) return;
  const absorbed = Math.min(S.block, n); S.block -= absorbed; n -= absorbed;
  if (!n) { float(unitX(i), 44, "막힘", "#a9cff0"); return; }
  const u = S.field[i];
  u.hp = Math.max(0, u.hp - n); anim.uHit[i] = 1;
  float(unitX(i), 44, "-" + n, "#ff7a6e");
  say(`${CARD[u.key].n}이(가) ${n} 피해를 받았어요`);
  if (u.hp <= 0) { S.field[i] = null; S.discard.push(u.key); say(`${CARD[u.key].n}이(가) 쓰러졌어요`); }
}

/* ---------- 층 이동 / 끝 ---------- */
async function foeDefeated() {
  S.busy = true; anim.foeDead = 0.001; render(); await sleep(700);
  if (S.floor >= 5) return showEnd(true);
  const keys = Object.keys(CARD);
  const pool = []; while (pool.length < 3) { const k = pick(keys); if (!pool.includes(k)) pool.push(k); }
  overlay(`<h2>${S.foe.n} 처치!</h2><p>카드 한 장을 덱에 넣으세요. 다음 층에서는 필드를 새로 시작해요.</p>
    <div class="hand">${pool.map((k, i) => handHTML({ key: k, uid: i })).join("")}</div>
    <button class="btn" id="skipBtn" type="button">넘어가기</button>`);
  $("ovBox").querySelectorAll(".card").forEach(el => el.onclick = () => nextFloor(pool[+el.dataset.uid]));
  $("skipBtn").onclick = () => nextFloor(null);
}
function nextFloor(key) {
  if (key) S.deck.push(key);
  S.floor++;
  $("ov").hidden = true; startFloor();
}
function showEnd(win) {
  S.busy = true;
  overlay(win
    ? `<h2>던전 정복</h2><p>주사위 마왕을 쓰러뜨렸어요. 덱 ${S.deck.length}장으로 정복했어요.</p><button class="btn main" id="againBtn" type="button">다시 도전</button>`
    : `<h2>쓰러졌어요</h2><p>지하 ${S.floor}층, ${S.foe.n} 앞에서 필드의 동료가 모두 쓰러졌어요.</p><button class="btn main" id="againBtn" type="button">다시 도전</button>`);
  $("againBtn").onclick = () => { $("ov").hidden = true; newRun(); };
}
function overlay(html) { $("ovBox").innerHTML = html; $("ov").hidden = false; }
function showHelp(first) {
  overlay(`<h2>주사위 던전</h2>
    <ul class="rules">
      <li>손패의 <b>동료</b> 카드를 골라 필드 5칸 중 빈 칸에 내요. 동료는 쓰러질 때까지 필드에 남아요.</li>
      <li>매 턴 주사위 5개를 굴려요. 남길 주사위를 눌러 고정하고 다시 굴림 2번.</li>
      <li>굴림을 확정하면 주사위를 동료에게 넣어요. 동료의 <b>레벨 이상</b>인 눈 1개면 기술이 발동하고, 레벨 7 이상은 주사위 2개 합이 레벨 이상이어야 해요.</li>
      <li><b>아이템</b>은 턴에 몇 장이든, <b>서포트</b>는 턴에 1장. 둘 다 주사위 없이 써요.</li>
      <li>적은 필드의 동료 하나를 노려요(빨간 칸). 공격을 받을 때 필드에 동료가 하나도 없으면 패배예요.</li>
      <li>방어는 우리 편 전체를 지키는 방패예요. 턴이 시작되면 사라져요.</li>
    </ul>
    <h3>주사위 족보 (요트)</h3>
    <table class="tbl">
      <tr><td>요트</td><td>5개 같은 눈 · 모든 피해 2배</td></tr>
      <tr><td>포카드</td><td>같은 눈 4개 · 피해 +10</td></tr>
      <tr><td>풀하우스</td><td>3개 + 2개 · 방어 +10</td></tr>
      <tr><td>라지 스트레이트</td><td>5개 연속 · 피해 +8</td></tr>
      <tr><td>스몰 스트레이트</td><td>4개 연속 · 피해 +4</td></tr>
    </table>
    <h3>필드 족보 (포커, 필드의 동료끼리)</h3>
    <table class="tbl">
      <tr><td>원페어 · 투페어</td><td>같은 레벨 2마리 · 피해 +3, 두 쌍이면 +6</td></tr>
      <tr><td>트리플</td><td>같은 레벨 3마리 · 피해 +8</td></tr>
      <tr><td>스트레이트</td><td>레벨 3개 연속 · 매 턴 다시 굴림 +1</td></tr>
      <tr><td>플러시</td><td>같은 속성 3마리 · 불 피해 +6, 물 방어 +6, 풀 독 +4, 번개 관통 +5</td></tr>
    </table>
    <p>피해 보너스는 그 턴에 기술을 하나 이상 쓰면 붙어요. 관통 피해는 적의 방어를 무시해요.</p>
    <button class="btn main" id="closeBtn" type="button">${first ? "던전 입장" : "닫기"}</button>`);
  $("closeBtn").onclick = () => { $("ov").hidden = true; if (first) newRun(); };
}

/* ---------- 화면 그리기 ---------- */
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function setPips(el, v) { el.querySelectorAll("span").forEach((s, i) => s.classList.toggle("on", PIPS[v].includes(i))); }
const IMG = {};
function spriteURL(key) {
  if (IMG[key]) return IMG[key];
  const spr = SPR[key], c = document.createElement("canvas"); c.width = 16; c.height = 16;
  const x = c.getContext("2d"), off = 16 - spr.rows.length;
  spr.rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== ".") { x.fillStyle = spr.pal[ch]; x.fillRect(i, j + off, 1, 1); } }));
  return IMG[key] = c.toDataURL();
}
const needText = lv => isTwo(lv) ? `합${lv}+` : `${lv}+`;
const effText = ([k, v]) => `${EFF[k]} ${v}`;
function dieHTML(d) {
  const cls = ["die", d.held && "held", S.sel === d.id && "sel", d.used && "used", rolling.has(d.id) && "rolling"].filter(Boolean).join(" ");
  return `<button type="button" class="${cls}" data-id="${d.id}" aria-label="주사위 ${d.v}${d.held ? ", 고정" : ""}">${
    Array.from({ length: 9 }, (_, i) => `<span class="${PIPS[d.v].includes(i) ? "on" : ""}"></span>`).join("")}</button>`;
}
function slotHTML(f, i, sel) {
  const tgt = S.foe && S.foe.target === i && !S.busy && foeAttacks();
  if (!f) {
    const cls = ["slotBox", "empty", tgt && "target", S.picked != null && "drop"].filter(Boolean).join(" ");
    return `<button type="button" class="${cls}" data-i="${i}"><span class="tgt">${tgt ? "▼ 노림" : ""}</span>${S.picked != null ? "여기에 내기" : "빈 칸"}</button>`;
  }
  const def = CARD[f.key], two = isTwo(def.lv);
  const state = full(f) ? "ready" : sel ? (canTake(f, sel.v) ? "fit" : "nofit") : "";
  const ds = Array.from({ length: two ? 2 : 1 }, (_, k) => f.fill[k]
    ? `<div class="ds full">${f.fill[k].v}</div>` : `<div class="ds">${k === 0 ? needText(def.lv) : "+"}</div>`).join("");
  return `<button type="button" class="slotBox u ${def.suit} ${tgt ? "target" : ""} ${state}" data-i="${i}">
    <span class="tgt">${tgt ? "▼ 노림" : ""}</span>
    <img src="${spriteURL(def.suit)}" alt="">
    <span class="un">${def.n}</span><span class="lv">LV${def.lv}</span>
    <span class="mini"><i style="width:${f.hp / f.max * 100}%"></i></span><span class="uhp">${f.hp}/${f.max}${f.psn ? ` <span style="color:var(--leaf)">독${f.psn}</span>` : ""}</span>
    <div class="dslots">${ds}</div><span class="ue">${effText(def.eff)}</span></button>`;
}
function handHTML(c, cls = "") {
  const def = CARD[c.key];
  if (def.type === "unit") {
    return `<button type="button" class="card ${def.suit} ${cls}" data-uid="${c.uid}">
      <span class="top"><span>동료 · ${SUIT[def.suit]}</span><span>LV${def.lv}</span></span>
      <span class="cn">${def.n}</span>
      <span class="cd">HP <b>${def.hp}</b><br>${needText(def.lv)} → ${effText(def.eff)}</span></button>`;
  }
  return `<button type="button" class="card ${def.type} ${cls}" data-uid="${c.uid}">
    <span class="top"><span>${def.type === "item" ? "아이템" : "서포트"}</span></span>
    <span class="cn">${def.n}</span><span class="cd">${def.d}</span></button>`;
}
const foeAttacks = () => ["atk", "poison"].includes(S.foe.pat[S.foe.step % S.foe.pat.length][0]);
function intentOf(f) {
  const [type, n, times] = f.pat[f.step % f.pat.length];
  const where = f.target >= 0 ? `${f.target + 1}번 칸` : "아무 동료";
  if (type === "atk") return ["", `공격 ${n}${times > 1 ? "×" + times : ""} → ${where}`];
  if (type === "block") return ["block", `방어 ${n}`];
  if (type === "poison") return ["poison", `독 ${n} → ${where}`];
  return ["curse", "저주: 주사위 −1"];
}
function say(t) { $("msg").textContent = t; }
function render() {
  const f = S.foe;
  $("floorNo").textContent = S.floor;
  const us = S.field.filter(Boolean), hp = us.reduce((a, u) => a + u.hp, 0), mx = us.reduce((a, u) => a + u.max, 0);
  $("pBar").style.width = (mx ? hp / mx * 100 : 0) + "%";
  $("pHp").textContent = `동료 ${us.length}/5`;
  $("pBlk").textContent = S.block ? `방어 ${S.block}` : "";
  $("pPsn").textContent = "";
  $("eName").textContent = f.n;
  $("eBar").style.width = (f.hp / f.max * 100) + "%";
  $("eHp").textContent = `HP ${f.hp}/${f.max}`;
  $("eBlk").textContent = f.block ? `방어 ${f.block}` : "";
  $("ePsn").textContent = f.poison ? `독 ${f.poison}` : "";
  const [ic, it] = intentOf(f); const ie = $("eIntent"); ie.className = "intent " + ic; ie.textContent = "다음: " + it;

  $("dice").innerHTML = S.dice.map(dieHTML).join("");
  $("dice").querySelectorAll(".die").forEach(el => el.onclick = () => tapDie(+el.dataset.id));
  const rollPh = S.phase === "roll";
  $("phase").textContent = !S.dice.length ? "" : rollPh ? `굴리기 · 남은 다시 굴림 ${rollsLeft()}` : "배치 · 주사위를 동료에게";
  $("rerollBtn").hidden = !rollPh;
  $("rerollBtn").disabled = S.busy || rollsLeft() < 1 || !S.dice.length;

  const sel = S.sel != null ? S.dice.find(d => d.id === S.sel) : null;
  $("field").innerHTML = S.field.map((u, i) => slotHTML(u, i, sel)).join("");
  $("field").querySelectorAll(".slotBox").forEach(el => el.onclick = () => tapSlot(+el.dataset.i, el));

  $("hand").innerHTML = S.hand.length ? S.hand.map(c => {
    const def = CARD[c.key];
    const off = def.type === "sup" && S.supUsed;
    return handHTML(c, S.picked === c.uid ? "picked" : off ? "off" : "");
  }).join("") : `<span class="msg">손패 없음</span>`;
  $("hand").querySelectorAll(".card").forEach(el => el.onclick = () => tapHand(+el.dataset.uid, el));

  if (S.dice.length) {
    const e = evaluate();
    $("combos").innerHTML = e.tags.length
      ? e.tags.map(t => `<div class="combo${t.idle ? " dim" : ""}"><span class="src${t.src === "주사위" ? " d" : ""}">${t.src}</span><b>${t.n}</b><span class="fx">${t.t}</span></div>`).join("")
      : `<div class="combo dim"><span class="src">족보</span><span class="fx">아직 없음</span></div>`;
    const parts = [], dmg = (e.atk + e.pierce) * e.mult;
    if (e.count) {
      if (dmg) parts.push(`<span class="a">피해 ${dmg}</span>`);
      if (e.def) parts.push(`<span class="b">방어 ${e.def}</span>`);
      if (e.heal.length || e.team) parts.push(`<span class="p">회복</span>`);
      if (e.psn) parts.push(`<span class="p">독 ${e.psn}</span>`);
    }
    $("total").innerHTML = !rollPh && parts.length ? "이번 턴 " + parts.join("") : "";
  } else { $("combos").innerHTML = ""; $("total").innerHTML = ""; }

  $("pile").textContent = `덱 ${S.draw.length} · 버림 ${S.discard.length}`;
  const mb = $("mainBtn");
  mb.textContent = rollPh ? "굴림 확정" : "발동!";
  mb.disabled = S.busy || !S.dice.length;
}

/* ---------- 캔버스 (전장) ---------- */
const cv = $("cv"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const anim = { lunge: 0, foeLunge: 0, foeHit: 0, foeDead: 0, uHit: [0, 0, 0, 0, 0], floats: [] };
const unitX = i => 22 + Math.max(0, i) * 27;
function float(x, y, text, color) { anim.floats.push({ x, y, text, color, t: 0 }); }
function drawSprite(spr, cx, by, s, flash, alpha = 1) {
  const rows = spr.rows, top = by - rows.length * s, left = Math.round(cx - 8 * s);
  ctx.globalAlpha = alpha;
  for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) {
    const ch = rows[j][i]; if (ch === ".") continue;
    ctx.fillStyle = flash ? "#ffffff" : spr.pal[ch];
    ctx.fillRect(left + i * s, top + j * s, s, s);
  }
  ctx.globalAlpha = 1;
}
function drawRoom(t) {
  ctx.fillStyle = "#2b2533"; ctx.fillRect(0, 0, 240, 100);
  ctx.fillStyle = "#231e2b";
  for (let y = 0; y < 72; y += 8) for (let x = (y / 8) % 2 ? -8 : 0; x < 240; x += 16) ctx.fillRect(x, y, 15, 7);
  ctx.fillStyle = "#1a1620"; ctx.fillRect(0, 72, 240, 28);
  ctx.fillStyle = "#211c28";
  for (let x = 0; x < 240; x += 12) ctx.fillRect(x, 76 + ((x / 12) % 2) * 6, 10, 2);
  [24, 216].forEach((x, k) => {
    ctx.fillStyle = "#4a3b2c"; ctx.fillRect(x - 1, 24, 3, 10);
    const fl = Math.floor(t / 120 + k) % 3;
    ctx.fillStyle = "#f08a3a"; ctx.fillRect(x - 2, 19 - fl, 5, 5 + fl);
    ctx.fillStyle = "#ffd36a"; ctx.fillRect(x - 1, 21 - fl, 3, 3);
  });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  drawRoom(now);
  if (S && S.foe) {
    const bob = reduced ? 0 : Math.round(Math.sin(now / 300));
    // 필드의 동료들 (왼쪽에 다섯 칸, 앞뒤로 엇갈리게)
    const push = anim.lunge > 0 ? Math.round(Math.sin(anim.lunge * Math.PI) * 10) : 0;
    S.field.forEach((u, i) => {
      if (!u) return;
      const h = anim.uHit[i], sx = h > 0 ? Math.round(Math.sin(h * 30) * 2) : 0;
      const y = 82 - (i % 2) * 10 + (reduced ? 0 : Math.round(Math.sin(now / 300 + i)));
      drawSprite(SPR[CARD[u.key].suit], unitX(i) + push + sx, y, 2, h > 0.5);
    });
    const f = S.foe, s = f.scale;
    const fx = 196 - (anim.foeLunge > 0 ? Math.round(Math.sin(anim.foeLunge * Math.PI) * 14) : 0)
                   + (anim.foeHit > 0 ? Math.round(Math.sin(anim.foeHit * 30) * 2) : 0);
    const flying = f.spr === "bat" ? -20 + Math.round(Math.sin(now / 180) * 3) : 0;
    const alpha = anim.foeDead > 0 ? Math.max(0, 1 - anim.foeDead) : 1;
    if (alpha > 0) drawSprite(SPR[f.spr], fx, 80 - bob + flying, s, anim.foeHit > 0.5, alpha);
  }
  ["lunge", "foeLunge", "foeHit"].forEach(k => { if (anim[k] > 0) anim[k] = Math.max(0, anim[k] - dt / 260); });
  anim.uHit = anim.uHit.map(h => Math.max(0, h - dt / 260));
  if (anim.foeDead > 0 && anim.foeDead < 1) anim.foeDead = Math.min(1, anim.foeDead + dt / 600);
  ctx.font = "8px Silkscreen, monospace"; ctx.textAlign = "center";
  anim.floats = anim.floats.filter(fl => (fl.t += dt) < 900);
  anim.floats.forEach(fl => {
    const y = Math.round(fl.y - fl.t / 30);
    ctx.fillStyle = "#15131c"; ctx.fillText(fl.text, fl.x + 1, y + 1);
    ctx.fillStyle = fl.color; ctx.fillText(fl.text, fl.x, y);
  });
  requestAnimationFrame(frame);
}

/* ---------- 시작 ---------- */
$("rerollBtn").onclick = doReroll;
$("mainBtn").onclick = () => S && (S.phase === "roll" ? lockDice() : resolve());
$("helpBtn").onclick = () => { if (S) showHelp(false); };
showHelp(true);
requestAnimationFrame(frame);
})();
</script>
