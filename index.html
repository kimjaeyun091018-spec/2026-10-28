const ray=new T.Raycaster(),ndc=new T.Vector2();let sel=null;
function pickAt(cx,cy){
  const r=cv.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObject(terrain)[0];if(!hit){closePick();return;}
  const wx=hit.point.x+GW/2,wy=hit.point.z+GH/2;
  let best=null,bd=2.6;for(const a of animals){if(a.dead)continue;const d=Math.hypot(a.x-wx,a.y-wy)*(a.type==='bird'&&a.state!=='perch'?1.5:1);if(d<bd){bd=d;best={k:'a',o:a};}}
  if(!best){let bt=null,btd=1e9;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const c=cellAt(wx+dx,wy+dy);if(c<0||treeAt[c]<0)continue;const t=trees[treeAt[c]];const d=Math.hypot(t.x+.5-wx,t.y+.5-wy);if(d<.8+SP[t.sp].maxR*t.size*.8&&d<btd){btd=d;bt=t;}}if(bt)best={k:'t',o:bt};}
  sel=best||{k:'c',x:wx,y:wy};updatePick();$('pick').hidden=false;
}
function closePick(){sel=null;$('pick').hidden=true;ring.visible=false;}
$('p-x').onclick=closePick;
function terrainName(c){
  if(L.pond[c]===1)return'강';if(L.pond[c]===2)return'비버 연못';if(L.pond[c]===3)return'습지';
  if(L.lava[c]>0)return'흐르는 용암';if(fire[c]>0)return'타오르는 불';if(L.flood[c]>.12)return'물에 잠긴 땅';
  if(L.rock[c]>0)return L.mark[c]&M.LAVA?'용암 바위':L.mark[c]&M.SLIDE?'산사태 자국':L.lichen[c]>.3?'이끼 바위':'민둥 바위';
  if(L.burn[c]>.3)return'불탄 땅';if(L.ash[c]>.2)return'화산재 땅';if(L.cover[c]>1.6)return'깊은 숲';if(L.cover[c]>.8)return'숲';
  if(L.flower[c]>.4)return'꽃밭';if(L.grass[c]>.5)return'풀밭';if(L.mark[c]&M.OLD)return'옛 물길';if(L.mark[c]&M.FLOOD)return'범람원';return'맨흙';}
function cellText(c){const elev=Math.round(L.h[c]*1180+40);let s=`해발 ${elev}m · 수분 <b>${Math.round(L.water[c]*100)}%</b>`;
  if(!L.pond[c]){if(L.rock[c]>0)s+=` · 바위 단단함 ${Math.round(L.rock[c]*100)}%`+(L.lichen[c]>0?` · 이끼 ${Math.round(L.lichen[c]*100)}%`:'');else s+=` · 흙 기름짐 <b>${Math.round(L.soil[c]*100)}%</b>`+(L.grass[c]>0?` · 풀 ${Math.round(L.grass[c]*100)}%`:'');}
  const b=G.blight[c];if(b&&b.stump&&treeAt[c]<0)s+=` · ${SP[b.sp].n} 그루터기`;if(b&&G.time<b.until)s+=` · ${josa(SP[b.sp].n,'은','는')} ${Math.ceil((b.until-G.time)/DAY)}일 동안 못 자라요`;
  return s;}
function updatePick(){
  if(!sel)return;let title='',body='',p=null;
  if(sel.k==='a'){const a=sel.o;if(a.dead){title='떠났어요';body='이 동물은 이제 보이지 않아요.';}else{
    title=a.type==='bird'?BIRDN[a.kind]:AT[a.type].n;const st=a.energy>1.3?'배불러요':a.energy>.6?'괜찮아요':'배고파요';
    const doing=a.type==='fox'?(a.prey&&!a.prey.dead?'토끼를 쫓는 중':'사냥감을 찾는 중'):a.type==='beaver'?({go:'나무로 가는 중',chew:'나무를 갉는 중',home:'가지를 나르는 중'}[a.state]||'연못에서 헤엄치는 중'):
      a.type==='bird'?(a.state==='perch'?'나무에 앉아 쉬는 중':'날아가는 중'):a.type==='squirrel'?(season()===2?'도토리를 묻는 중':'나무 사이를 오가는 중'):a.type==='rabbit'&&a.fox&&!a.fox.dead&&Math.hypot(a.fox.x-a.x,a.fox.y-a.y)<5?'여우를 피해 달아나는 중':'풀을 뜯는 중';
    body=`${st} · ${Math.floor(a.age/DAY)}일째 사는 중 · ${doing}`;p=[a.x,a.y,a.type==='bird'?(a.state==='perch'?perchHeight(a):6):0,1.4];}}
  else if(sel.k==='t'){const t=sel.o;if(t.dead){title='쓰러졌어요';body='이 나무는 이제 없어요. 그 자리엔 곧 다른 생명이 자라요.';}else{
    title=(t.first?'어미나무 · ':'')+SP[t.sp].n;const i=t.y*GW+t.x,S=SP[t.sp];
    const adv=t.pest>0?(t.beat?'병들었지만 이겨낼 힘이 있어요':`<b>병들었어요</b> · 약 ${Math.max(1,Math.ceil(t.doom/DAY))}일 뒤 쓰러져요`)+(t.guard>0?' · 새가 번짐을 막는 중':''):
      L.water[i]<S.w0?'목이 말라요':L.soil[i]<S.soil*.6?'흙이 척박해요':t.size>.95?'다 자랐어요':'잘 자라는 중';
    const trs=EVO.filter(e=>e.line===S.n&&G.evo[e.id]!=null).map(e=>e.n);
    body=`높이 ${(t.size*16+.3).toFixed(1)}m · ${Math.floor(t.age/YEAR)}살 · 건강 ${Math.round(t.hp*100)}% · ${adv}`+(trs.length?`<br>진화: ${trs.join(', ')}`:'')+`<br>${cellText(i)}`;
    p=[t.x+.5+t.jx,t.y+.5+t.jy,0,.9+S.maxR*t.size*.9];}}
  else{const c=cellAt(sel.x,sel.y);if(c>=0){title=terrainName(c);body=cellText(c);p=[sel.x,sel.y,0,1];}}
  $('p-title').textContent=title;$('p-body').innerHTML=body;
  if(p){ring.visible=true;ring.position.set(X(p[0]),posAt(p[0],p[1])+.25+p[2],Z(p[1]));ring.scale.setScalar(p[3]);}else ring.visible=false;
}

/* ============================================================
   화면 패널
   ============================================================ */
let toastT=0,bannerT=0;
function toast(h){const el=$('toast');el.innerHTML=h;el.style.opacity=1;toastT=3.6;}
function banner(t,p,soft){$('bn-t').textContent=t;$('bn-p').textContent=p;$('banner').style.opacity=1;bannerT=soft?3:5.5;if(!soft&&(t==='지진'||t==='화산 폭발'))shakeT=3;}
function renderHUD(){
  const se=season(),p=(G.time%YEAR)/YEAR,day=Math.floor((G.time%SEASON_LEN)/DAY)+1;
  $('needle').style.transform=`rotate(${p*360+180}deg)`;$('sname').textContent=`${SEASONS[se].n} ${day}일`;$('ssub').textContent=`${SEASONS[(se+1)%4].n}까지 ${31-day}일 · ${year()}년째`;
  document.body.className='s'+se;
  const lifeN=Object.keys(G.life).length,landN=Object.keys(G.land).length;
  $('sum').innerHTML=`<span class="chip">푸른 땅 <b>${Math.round((C.green||0)*100)}%</b></span><span class="chip">나무 <b>${C.big||0}</b></span><span class="chip">동물 <b>${ATK.reduce((a,k)=>a+counts[k],0)}</b></span><span class="chip">도감 <b>${lifeN+landN}</b>/${LIFE.length+LAND_DEX.length}</span>`;
  $('d-life').hidden=!(G.seen.life>0);$('d-land').hidden=!(G.seen.land>0);$('d-evo').hidden=!(G.seen.evo>0);
}
function renderTime(){$('time').innerHTML=[[0,'멈춤'],[1,'1배'],[4,'4배'],[16,'16배']].map(([v,n])=>`<button data-speed="${v}" aria-pressed="${G.speed===v}">${n}</button>`).join('');}
$('time').addEventListener('click',e=>{const b=e.target.closest('[data-speed]');if(!b)return;G.speed=+b.dataset.speed;renderTime();});
const ICON={
  plant:'<path d="M15 27V14M15 18c-4-1-7-4-7-8 4 0 7 3 7 7m0-3c1-4 4-7 8-7 0 4-3 7-8 8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
  tree:'<circle cx="15" cy="11" r="8" fill="#fff"/><rect x="13.5" y="17" width="3" height="10" rx="1" fill="#fff"/>',
  mammal:'<ellipse cx="13" cy="18" rx="9" ry="6" fill="#fff"/><circle cx="23" cy="13" r="4.5" fill="#fff"/>',
  bird:'<ellipse cx="14" cy="17" rx="8" ry="5.5" fill="#fff"/><circle cx="21" cy="12" r="4" fill="#fff"/><path d="M25 12l4 1-4 1z" fill="#fff"/>',
  bug:'<ellipse cx="9" cy="12" rx="6" ry="7" fill="#fff"/><ellipse cx="21" cy="12" rx="6" ry="7" fill="#fff"/><rect x="14" y="8" width="2" height="16" rx="1" fill="#fff"/>',
  fish:'<ellipse cx="13" cy="15" rx="9" ry="5" fill="#fff"/><path d="M21 15l7-5v10z" fill="#fff"/>',
  frog:'<ellipse cx="15" cy="18" rx="10" ry="6" fill="#fff"/><circle cx="10" cy="11" r="3.4" fill="#fff"/><circle cx="20" cy="11" r="3.4" fill="#fff"/>',
  land:'<path d="M3 24l8-12 5 7 4-5 7 10z" fill="#fff"/>'
};
let tab='life';
function openSheet(t){tab=t;if(G.seen[t]!=null)G.seen[t]=0;renderSheet();$('sheet').hidden=false;renderHUD();}
function when(tm){return `${Math.floor(tm/YEAR)+1}년 ${SEASONS[Math.floor(tm/SEASON_LEN)%4].n}에 발견`;}
function lifeCount(k){if(SP[k])return C.sp[k]||0;if(AT[k])return counts[k];if(BIRDN[k])return animals.filter(a=>!a.dead&&a.kind===k).length;
  const m={lichen:C.lichen,flower:C.flower,butterfly:bflies.length,frog:frogs.length};return m[k]!=null?m[k]:'';}
function renderSheet(){
  const tabs=[['life','생물도감'],['land','지형도감'],['evo','진화'],['log','일지']];
  $('tabs').innerHTML=tabs.map(([k,n])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}" ${tab===k?'id="sheet-title"':''}>${n}</button>`).join('');
  let h='';
  if(tab==='life'||tab==='land'){const list=tab==='life'?LIFE:LAND_DEX,book=tab==='life'?G.life:G.land;const got=list.filter(e=>book[e.k]!=null).length;
    h=`<p class="lead">${tab==='life'?'이 산에 스스로 찾아온 생명들이에요.':'시간과 자연재해가 빚어낸 땅의 모습이에요.'} ${got} / ${list.length}</p><div class="grid">`+list.map(e=>{const has=book[e.k]!=null;
      const cnt=tab==='life'?lifeCount(e.k):'';
      return `<div class="entry ${has?'':'locked'}"><div class="ic" style="background:${has?e.c:'#d9ded9'}"><svg viewBox="0 0 30 30" aria-hidden="true">${ICON[tab==='land'?'land':e.g]}</svg></div><h4>${has?e.n:'???'}</h4>`+
        (has?`<small>${when(book[e.k])}${cnt!==''?` · 지금 ${cnt}`:''}</small><p>${e.d}</p>`:`<p>아직 만나지 못했어요.</p>`)+`</div>`;}).join('')+'</div>';}
  else if(tab==='evo'){const lines=[...new Set(EVO.map(e=>e.line))];
    h='<p class="lead">생물이 겪은 일이 쌓이면 저절로 진화해요. 무엇을 겪어야 하는지와 지금까지 쌓인 정도를 보여 줘요.</p>'+lines.map(l=>{const es=EVO.filter(e=>e.line===l);
      return `<div class="lineage"><b>${l}</b><div class="nodes">`+es.map(e=>{const on=G.evo[e.id]!=null,wait=e.req&&G.evo[e.req]==null,pr=Math.min(1,(G.pr[e.p]||0)/e.th);
        return (e.req?'<span class="arrow">→</span>':'')+`<div class="node ${on?'on':wait?'wait':''}"><h5>${e.n}</h5><p>${e.d}</p>`+(on?'':`<p>${wait?'앞 단계가 먼저':e.how} · ${Math.round(pr*100)}%</p><div class="bar"><i style="width:${pr*100}%"></i></div>`)+`</div>`;}).join('')+'</div></div>';}).join('');}
  else h='<ul class="log">'+G.log.map(l=>`<li class="${l.k}"><span class="d">${l.d}</span><span>${l.t}</span></li>`).join('')+'</ul>';
  $('sheet-body').innerHTML=h;logDirty=false;
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;if(G.seen[tab]!=null)G.seen[tab]=0;renderSheet();renderHUD();}});
$('sheet-x').onclick=()=>{$('sheet').hidden=true;};$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('sheet').hidden=true;});
$('b-life').onclick=()=>openSheet('life');$('b-land').onclick=()=>openSheet('land');$('b-evo').onclick=()=>openSheet('evo');$('b-log').onclick=()=>openSheet('log');
$('b-snd').onclick=()=>setSound(!G.sound);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('sheet').hidden)$('sheet').hidden=true;else if(!$('modal').hidden&&G.started)$('modal').hidden=true;else closePick();}});

/* ============================================================
   저장 · 자리를 비운 사이
   ============================================================ */
const KEY='mindungsan-forest-v1';
function b64(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);}
function unb64(str){const s=atob(str),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function packF(a){const u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=Math.round(clamp(a[i],0,1)*255);return b64(u);}
function unpackF(str,a){const u=unb64(str);for(let i=0;i<a.length;i++)a[i]=u[i]/255;}
const FL=['h','rock','soil','water','grass','flower','lichen','ash','lava','burn','flood','wet'];
function save(){if(!G||!G.started)return;try{G.lastReal=Date.now();
  const layers={};for(const k of FL)layers[k]=packF(L[k]);
  const data={G,uid,layers,pond:b64(L.pond),mark:b64(L.mark),
    trees:trees.map(t=>[t.x,t.y,SPK.indexOf(t.sp),+t.size.toFixed(3),Math.round(t.age),+t.hp.toFixed(2),+t.pest.toFixed(2),t.first?1:0,Math.round(t.life),+t.doom.toFixed(1),+t.doomMax.toFixed(1),t.beat?1:0]),
    animals:animals.filter(a=>!a.dead).map(a=>[ATK.indexOf(a.type),+a.x.toFixed(1),+a.y.toFixed(1),+a.energy.toFixed(2),Math.round(a.age),Math.round(a.life),a.kind,a.dam]),
    dams,logs:logs.map(l=>[+l.x.toFixed(1),+l.y.toFixed(1),+l.size.toFixed(2),Math.round(l.t),+l.a.toFixed(2),l.burnt?1:0])};
  localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return false;const d=JSON.parse(s);if(!d.G||d.G.v!==1)return false;
  G=d.G;for(const k of FL)if(d.layers[k])unpackF(d.layers[k],L[k]);const pu=unb64(d.pond),mu=unb64(d.mark);for(let i=0;i<NC;i++){L.pond[i]=pu[i];L.mark[i]=mu[i];}
  const s2=G.seed%997;for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;cellNoise[i]=hash(x,y,s2+99);flowerHue[i]=Math.floor(hash(x,y,s2+7)*4);}
  recountLand();uid=d.uid||1;trees=[];treeAt.fill(-1);
  for(const r of d.trees){const t=addTree(SPK[r[2]],r[0],r[1],r[3],!!r[7]);t.age=r[4];t.hp=r[5];t.pest=r[6];t.life=r[8];t.doom=r[9]||0;t.doomMax=r[10]||0;t.beat=!!r[11];if(t.pest>0&&!t.doomMax)t.doomMax=t.doom=DOOM[t.sp];}
  animals=[];for(const k of ATK)counts[k]=0;
  for(const r of d.animals){const a=spawnAnimal(ATK[r[0]],r[1],r[2]);if(!a)continue;a.energy=r[3];a.age=r[4];a.life=r[5];a.kind=r[6]||'';a.dam=r[7];if(a.type==='bird'){a.state='fly';pickPerch(a);}}
  dams=d.dams||[];logs=(d.logs||[]).map(r=>({x:r[0],y:r[1],size:r[2],t:r[3],a:r[4],burnt:!!r[5]}));
  rebuildOcc();computeCover();census();geoDirty=waterDirty=true;return true;}catch(e){console.warn(e);return false;}}
function snapshot(){return{life:Object.keys(G.life).length,land:Object.keys(G.land).length,evo:Object.keys(G.evo).length,big:C.big||0,ani:ATK.reduce((a,k)=>a+counts[k],0),dis:G.disasters};}
function catchUp(sec){
  const away=Math.min(sec,YEAR*2);if(away<20)return;
  const b=snapshot(),logBefore=G.log[0];const st=G.started;G.started=false;simulate(away);G.started=st;census();
  const a=snapshot(),days=Math.round(away/DAY);
  const news=[];for(const l of G.log){if(l===logBefore)break;if(l.k==='find'||l.k==='evo'||l.k==='disaster')news.push(l.t);if(news.length>=6)break;}
  openModal(`<h3>다녀오셨어요</h3><p>자리를 비운 사이 이 산에 ${days}일이 흘렀어요.${sec>away?' 아주 오래 비워도 2년까지만 흘러요.':''}</p>
    <ul><li>나무 <b>${b.big} → ${a.big}</b>그루</li><li>동물 <b>${b.ani} → ${a.ani}</b>마리</li>${a.life+a.land>b.life+b.land?`<li>도감 <b>+${a.life-b.life+a.land-b.land}</b></li>`:''}${a.evo>b.evo?`<li>진화 <b>+${a.evo-b.evo}</b></li>`:''}${a.dis>b.dis?`<li>자연재해 <b>${a.dis-b.dis}</b>번</li>`:''}</ul>
    ${news.length?'<p>'+news.join('<br>')+'</p>':''}
    <div class="row"><button class="btn main" data-close>숲 보러 가기</button></div>`);
  geoDirty=waterDirty=true;
}
function openModal(h){$('card').innerHTML=h;$('modal').hidden=false;const b=$('card').querySelector('.main');b&&b.focus();}
$('card').addEventListener('click',e=>{if(e.target.closest('[data-close]'))$('modal').hidden=true;
  const s=e.target.closest('[data-start]');if(s){G.started=true;$('modal').hidden=true;if(s.dataset.start==='sound')setSound(true);save();banner('봄',SEASON_INFO[0],true);}});
function showIntro(){openModal(`<h3>민둥산 숲 이야기</h3>
<p>오래전 숲이 사라진 산. 남은 것은 바위와 마른 흙, 산 아래 강, 그리고 강가 바위틈의 묘목 하나.</p>
<p>당신은 아무것도 하지 않아도 돼요. 바람이 포자를 싣고 오고, 강물이 풀씨를 실어 오고, 숲이 생기면 동물이 스스로 찾아와요. 그저 지켜봐 주세요.</p>
<ul><li>처음 나타난 생물과 땅은 <b>도감</b>에 저절로 기록돼요.</li><li>생물은 겪은 일만큼 스스로 <b>진화</b>해요. 병에 많이 쓰러진 나무는 병에 강해져요.</li>
<li>가끔 <b>산불, 지진, 화산, 홍수</b>가 찾아와요. 무너진 자리에서 숲은 다시 시작해요.</li><li>끌어서 둘러보고, 눌러서 살펴봐요. 창을 닫아도 시간은 흘러요.</li></ul>
<div class="row"><button class="btn" data-start="quiet">조용히 보기</button><button class="btn main" data-start="sound">자연의 소리와 함께</button></div>`);}

/* ============================================================
   돌리기
   ============================================================ */
const PROF=location.hash==='#debug'?{}:null;
let last=performance.now(),acc=0,uiT=0,saveT=0,paintT=0,waterT=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
  if(G.started&&G.speed>0&&!document.hidden){acc+=rdt*G.speed;let n=0;while(acc>=.1&&n<3){const d=Math.min(.5,acc);step(d);acc-=d;n++;}if(acc>2)acc=0;}
  if(view.orbit&&!drag)view.yawT+=rdt*.06;
  view.yaw+=(view.yawT-view.yaw)*Math.min(1,rdt*6);
  if(shakeT>0)shakeT-=rdt;
  placeCamera();
  if(geoDirty)updateGeo();
  paintT+=rdt;if(paintT>.25){paintT=0;paintTerrain();}
  waterT+=rdt;if(waterDirty){waterDirty=false;waterT=0;updateWater(t,true);}else if(waterT>.12){waterT=0;updateWater(t,false);}
  const pt0=performance.now();drawTrees(t);drawAnimals(t,rdt);drawClouds();stepParticles(rdt,t);
  if(sel)updatePick();if(PROF){PROF.draw=(PROF.draw||0)*.9+(performance.now()-pt0)*.1;}
  const wa=winterAmt(),aa=autumnAmt();sun.color.setRGB(1,lerp(.95,.86,aa),lerp(.85,.72,aa)+wa*.15);sun.intensity=.82-wa*.12;hemi.intensity=.72+wa*.08;
  const pr0=performance.now();renderer.render(scene,camera);if(PROF)PROF.render=(PROF.render||0)*.9+(performance.now()-pr0)*.1;
  if(G.started&&G.speed>0){songT-=rdt;if(songT<=0){const bs=animals.filter(a=>a.type==='bird'&&!a.dead);if(bs.length)sing(bs[(Math.random()*bs.length)|0].kind);songT=bs.length?rand(2.5,8)/Math.pow(bs.length,.3):3;}}
  if(G.sound&&AC&&rainG){rainG.gain.setTargetAtTime(Math.min(.12,rainNow*.05),AC.currentTime,.4);windG.gain.setTargetAtTime(.012+G.wind*.008+(fireCells.length?.03:0),AC.currentTime,.6);}
  if(toastT>0){toastT-=rdt;if(toastT<=0)$('toast').style.opacity=0;}
  if(bannerT>0){bannerT-=rdt;if(bannerT<=0)$('banner').style.opacity=0;}
  uiT+=rdt;if(uiT>.5){uiT=0;renderHUD();if(!$('sheet').hidden&&(tab==='log'?logDirty:Math.random()<.2))renderSheet();}
  saveT+=rdt;if(saveT>20){saveT=0;save();}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();}else if(G&&G.started){const sec=(Date.now()-G.lastReal)/1000;last=performance.now();if(sec>60)catchUp(sec);G.lastReal=Date.now();}});
window.addEventListener('pagehide',save);

if(load()){for(const k of ATK)G.alive[k]=counts[k]>0;
  if(G.sound){$('b-snd').classList.add('on');const once=()=>{setSound(true);window.removeEventListener('pointerdown',once,true);};window.addEventListener('pointerdown',once,true);}
  if(!G.started)showIntro();else{const sec=(Date.now()-G.lastReal)/1000;if(sec>60)catchUp(sec);}}
else{fresh(Math.floor(Math.random()*1e6));log('바람이 멎은 새벽, 민둥산 강가 바위틈에서 묘목 하나가 고개를 들었다.','story');showIntro();}
if(location.hash==='#debug')window.__eco={PROF,get G(){return G},L,get trees(){return trees},get animals(){return animals},step,census,counts,get C(){return C},simulate,startFire,startQuake,startEruption,startFlood,shiftRiver,infect,fire,get fireCells(){return fireCells},view};
$('loading').remove();renderTime();resize();updateGeo();paintTerrain();updateWater(0,true);renderHUD();requestAnimationFrame(frame);
})();
</script>
