<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숲공부 생태계 타이머</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column field journal — 45° isometric diorama on top, timer controls, then the species log */
:root {
  --bg: #eef1ea;
  --surface: #f8faf5;
  --ink: #1d2a22;
  --muted: #5d6b61;
  --line: #d3dacd;
  --accent: #2c6e8f;
  --moss: #4d7a39;
  --warn: #b5562b;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121814; --surface: #1a221d; --ink: #e3eadf; --muted: #9aa89d; --line: #2c3830;
    --accent: #6cb4d6; --moss: #8cc070; --warn: #e08a5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1a221d; --ink: #e3eadf; --muted: #9aa89d; --line: #2c3830;
  --accent: #6cb4d6; --moss: #8cc070; --warn: #e08a5e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: .01em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

.tabs { display: flex; gap: 6px; }
.tab {
  flex: 1; font: inherit; font-family: var(--font-display); font-size: 17px; padding: 8px 0;
  background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab:disabled { opacity: .45; cursor: not-allowed; }
.tab:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* the diorama is an illustration with its own fixed daylight palette */
.scene {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 720 / 470; border-radius: 16px; overflow: hidden;
  background: #b9d9e6; border: 1px solid var(--line);
}
.scene canvas { display: block; width: 100%; height: 100%; transition: filter 1s; }
.scene.drought canvas { filter: saturate(.25) sepia(.35) brightness(1.05); }
.stage {
  position: absolute; left: 12px; top: 10px; font-family: var(--font-display); font-size: 15px;
  background: rgba(248, 250, 245, .9); color: #1d2a22; padding: 3px 10px; border-radius: 999px;
}

.timer { display: flex; flex-direction: column; gap: 10px; }
.clock { font-family: var(--font-num); font-size: 46px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  font: inherit; font-family: var(--font-display); font-size: 18px; padding: 10px 22px; border-radius: 12px;
  border: none; background: var(--moss); color: var(--bg); cursor: pointer;
}
.btn.stop { background: var(--warn); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 15px; padding: 8px 14px; }
.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin-left: auto; }
.next { font-size: 14px; color: var(--muted); }
.next b { color: var(--ink); font-weight: 400; font-family: var(--font-display); font-size: 16px; }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.notice { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border-left: 3px solid var(--warn); }

.log h2 { font-family: var(--font-display); font-weight: 400; font-size: 21px; margin: 0 0 8px; }
.log ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.log li .e { font-size: 24px; text-align: center; }
.log li .n { min-width: 0; }
.log li .n strong { font-family: var(--font-display); font-weight: 400; font-size: 16px; display: block; }
.log li .n span { color: var(--muted); font-size: 13px; }
.log li .m { font-family: var(--font-num); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log li.locked .e { filter: grayscale(1) opacity(.35); }
.log li.locked strong { color: var(--muted); }
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-family: var(--font-display);
  font-size: 16px; max-width: calc(100% - 32px); text-align: center; z-index: 5;
}
footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>숲공부</h1>
    <p>공부한 시간만큼 땅이 살아나고, 조건이 맞으면 동물이 찾아와요.</p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="scene" id="scene">
    <canvas id="cv" aria-label="공부 시간에 따라 자라는 지형과 생물을 45도 각도에서 내려다본 그림"></canvas>
    <div class="stage" id="stage"></div>
  </div>

  <section class="timer">
    <div class="clock" id="clock">00:00</div>
    <div class="row">
      <button class="btn" id="startBtn" type="button">공부 시작</button>
      <button class="btn ghost" id="resetBtn" type="button">처음부터</button>
      <label class="toggle"><input type="checkbox" id="demo" checked> 시연 모드 (1초 = 1분)</label>
    </div>
    <div class="notice" id="notice" hidden></div>
    <div class="next" id="next"></div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <section class="log">
    <h2 id="logTitle">도감</h2>
    <ol id="log"></ol>
  </section>

  <footer>공부 중에 화면을 벗어나면 그 세션의 시간은 기록되지 않아요. 기록은 이 브라우저에만 저장돼요.</footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
'use strict';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= 45° isometric grid ================= */
const W = 720, H = 470, GN = 8, TW = 78, TH = 39, HZ = 15, OX = 360, OY = 108;
const iso = (gx, gy, h) => [OX + (gx - gy) * TW / 2, OY + (gx + gy) * TH / 2 - h * HZ];
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };

// river course: row of water for each column
const RIVER = [3, 3, 4, 4, 4, 5, 5, 5];
const POND = [[2, 5], [3, 5], [4, 5], [2, 3], [3, 3]];
const isRiver = (gx, gy) => RIVER[gx] === gy;

/* ================= terrains & species =================
   at: [gx, gy, dx, dy]  — tile, then pixel offset from the tile's top centre */
const TERRAINS = {
  river: {
    name: '강', greenAt: 40,
    stages: [[0, '마른 강변'], [10, '갈대 강변'], [40, '버드나무 강가'], [60, '비버의 강'], [80, '습지 생태계']],
    height: () => 1,
    water: (gx, gy, got) => isRiver(gx, gy) || (got.has('dam') && POND.some(([x, y]) => x === gx && y === gy)),
    species: [
      { id: 'reed', name: '갈대', e: '🌾', min: 10, req: [], note: '강변에 처음 자리 잡는 풀', at: [[1, 2], [6, 4], [7, 6], [0, 4], [5, 4, 10, 4]], d: 'reed' },
      { id: 'fish', name: '피라미', e: '🐟', min: 20, req: [], note: '물이 맑아지면 찾아와요', at: [[3, 4], [6, 5, -8, 2]], d: 'fish' },
      { id: 'willow', name: '버드나무', e: '🌳', min: 40, req: ['reed'], note: '갈대가 흙을 붙잡아야 자라요', at: [[6, 2], [1, 6], [4, 1]], d: 'willow' },
      { id: 'beaver', name: '비버', e: '🦫', min: 60, req: ['willow'], note: '버드나무 가지로 댐을 지어요', at: [[5, 6, -4, -2]], d: 'beaver' },
      { id: 'dam', name: '비버 댐', e: '🪵', min: 60, req: ['beaver'], note: '강물을 막아 연못을 만들어요', at: [[5, 5]], d: 'dam' },
      { id: 'frog', name: '개구리', e: '🐸', min: 70, req: ['dam'], note: '댐이 만든 연못에 살아요', at: [[3, 5], [2, 3, 6, 0]], d: 'frog' },
      { id: 'heron', name: '왜가리', e: '🪿', min: 80, req: ['frog', 'fish'], note: '개구리와 물고기를 먹으러 와요', at: [[4, 6, -6, 0]], d: 'heron' },
    ],
  },
  forest: {
    name: '민둥산', greenAt: 90,
    stages: [[0, '바위투성이 민둥산'], [5, '이끼 낀 산'], [40, '어린 숲'], [90, '깊은 숲']],
    height: (gx, gy) => 1 + Math.round(4 * Math.exp(-((gx - 3.5) ** 2 + (gy - 3.5) ** 2) / 6)),
    water: () => false,
    // rocks crack into soil one by one as study time accumulates
    rocks: [[3, 3, 8], [4, 3, 14], [3, 4, 20], [4, 4, 28], [2, 4, 34], [5, 3, 42], [3, 2, 50], [5, 5, 58], [2, 2, 64]],
    species: [
      { id: 'moss', name: '이끼', e: '🌿', min: 5, req: [], note: '바위 틈에 가장 먼저 와요', at: [[1, 6], [5, 6], [6, 2], [2, 1], [0, 3]], d: 'moss' },
      { id: 'fern', name: '고사리', e: '🌱', min: 15, req: ['moss'], note: '이끼가 만든 흙에서 자라요', at: [[2, 5], [6, 4], [4, 6]], d: 'fern' },
      { id: 'pine', name: '소나무', e: '🌲', min: 30, req: ['fern'], note: '척박한 산비탈에도 뿌리내려요', at: [[4, 1], [1, 3], [6, 5]], d: 'pine' },
      { id: 'oak', name: '참나무', e: '🌳', min: 45, req: ['pine'], note: '숲의 뼈대가 되는 나무', at: [[2, 3], [5, 2], [3, 6]], d: 'oak' },
      { id: 'squirrel', name: '다람쥐', e: '🐿️', min: 60, req: ['oak'], note: '도토리를 모으며 살아요', at: [[3, 4, 4, 0]], d: 'squirrel' },
      { id: 'woodpecker', name: '오색딱따구리', e: '🐦', min: 90, req: ['oak'], note: '나무에 구멍을 뚫어요', at: [[5, 2, 5, -22]], d: 'woodpecker' },
      { id: 'owl', name: '올빼미', e: '🦉', min: 120, req: ['woodpecker'], note: '딱따구리가 남긴 구멍에 둥지를 틀어요', at: [[2, 3, -2, -40]], d: 'owl' },
    ],
  },
  meadow: {
    name: '초원', greenAt: 20,
    stages: [[0, '맨 들판'], [5, '풀밭'], [20, '꽃밭'], [90, '열매 맺는 초원']],
    height: (gx, gy) => (gx < 2 && gy < 2 ? 2 : 1),
    water: () => false,
    species: [
      { id: 'grass', name: '들풀', e: '🌱', min: 5, req: [], note: '들판을 덮는 첫 풀', at: [[1, 3], [3, 1], [5, 2], [2, 5], [6, 4], [4, 6], [6, 6], [0, 5]], d: 'grass' },
      { id: 'flower', name: '들꽃', e: '🌼', min: 20, req: ['grass'], note: '풀밭이 자리 잡으면 피어요', at: [[2, 2], [4, 3], [6, 2], [3, 6], [5, 5], [1, 5]], d: 'flower' },
      { id: 'rabbit', name: '토끼', e: '🐇', min: 40, req: ['grass'], note: '풀을 뜯으러 와요', at: [[3, 4]], d: 'rabbit' },
      { id: 'bee', name: '꿀벌', e: '🐝', min: 60, req: ['flower'], note: '꽃가루를 옮겨 열매를 맺게 해요', at: [[4, 3], [5, 5]], d: 'bee' },
      { id: 'apple', name: '사과나무', e: '🍎', min: 90, req: ['bee'], note: '꿀벌이 꽃가루를 옮겨야 열려요', at: [[6, 6], [2, 6], [7, 3]], d: 'apple' },
      { id: 'fox', name: '여우', e: '🦊', min: 120, req: ['rabbit'], note: '토끼가 늘면 나타나요', at: [[1, 6, 4, 0]], d: 'fox' },
    ],
  },
};

/* ================= state ================= */
const KEY = 'sup-ecosystem-v2';
let state = { terrain: 'river', minutes: { river: 0, forest: 0, meadow: 0 }, seen: {}, demo: true };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.minutes) state = Object.assign(state, s); } catch (e) {}
if (!TERRAINS[state.terrain]) state.terrain = 'river';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

let running = false, startAt = 0, sessionMin = 0, tickId = null;
let got = new Set(), appear = {};

function unlocked(tKey, minutes) {
  const set = new Set();
  for (const sp of TERRAINS[tKey].species) if (minutes >= sp.min && sp.req.every(r => set.has(r))) set.add(sp.id);
  return set;
}
const effMinutes = () => state.minutes[state.terrain] + (running ? sessionMin : 0);
const fmt = m => { const t = Math.floor(m); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

/* ================= drawing helpers ================= */
const cv = $('cv'), ctx = cv.getContext('2d');
function el(x, y, rx, ry, c, rot) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, 7); ctx.fill(); }
function line(x1, y1, x2, y2, c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const rgb = a => 'rgb(' + a.map(v => Math.round(clamp(v, 0, 255))).join(',') + ')';
const mixA = (c1, c2, t) => { const a = hex(c1), b = hex(c2); t = clamp(t, 0, 1); return a.map((v, i) => v + (b[i] - v) * t); };
const shade = (a, k) => rgb(a.map(v => v * k));
const sway = (t, seed, amt) => reduceMotion ? 0 : Math.sin(t * 1.2 + seed) * amt;

function drawTile(gx, gy, h, top, isWater, t) {
  const [x, y] = iso(gx, gy, h), d = (h + 1.2) * HZ, hw = TW / 2, hh = TH / 2;
  // left face
  ctx.fillStyle = shade(top, isWater ? .72 : .78);
  ctx.beginPath(); ctx.moveTo(x - hw, y); ctx.lineTo(x, y + hh); ctx.lineTo(x, y + hh + d); ctx.lineTo(x - hw, y + d); ctx.fill();
  // right face
  ctx.fillStyle = shade(top, isWater ? .6 : .64);
  ctx.beginPath(); ctx.moveTo(x + hw, y); ctx.lineTo(x, y + hh); ctx.lineTo(x, y + hh + d); ctx.lineTo(x + hw, y + d); ctx.fill();
  // top
  ctx.fillStyle = rgb(top);
  ctx.beginPath(); ctx.moveTo(x, y - hh); ctx.lineTo(x + hw, y); ctx.lineTo(x, y + hh); ctx.lineTo(x - hw, y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1; ctx.stroke();
  if (isWater) {
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.2;
    for (let k = 0; k < 2; k++) {
      const p = reduceMotion ? .3 : ((t * .25 + hash(gx, gy) + k * .5) % 1);
      const lx = x - hw * .5 + p * hw, ly = y - hh * .35 + k * hh * .55 + p * hh * .25;
      line(lx - 6, ly, lx + 6, ly - 3, 'rgba(255,255,255,.4)', 1.2);
    }
  }
}

function drawRock(x, y, s, crack) {
  const r = 14 * s;
  el(x + 2, y + 1, r * 1.35, r * .42, 'rgba(30,20,10,.25)');
  el(x - r * .4, y - r * .3, r * .78, r * .6, '#756d66', -.2); el(x + r * .45, y - r * .22, r * .62, r * .5, '#857d75', .3);
  el(x, y - r * .62, r * .74, r * .64, '#948b82'); el(x - r * .18, y - r * .95, r * .32, r * .14, 'rgba(255,255,255,.22)');
  if (crack > 0) {
    ctx.strokeStyle = '#3a332e'; ctx.lineWidth = 1.3; ctx.beginPath();
    let cx = x - r * .05, cy = y - r * 1.2; ctx.moveTo(cx, cy);
    for (let k = 0; k < Math.ceil(crack * 5); k++) { cx += (k % 2 ? 1 : -1) * r * .22; cy += r * .28; ctx.lineTo(cx, cy); }
    ctx.stroke();
    ctx.strokeStyle = '#6fa44a'; ctx.lineWidth = 1.6; ctx.beginPath();
    ctx.moveTo(x - r * .9, y); ctx.quadraticCurveTo(x - r * .6, y - r * .5 * crack, x - r * .1, y - r * .7 * crack); ctx.stroke();
  }
}

/* creature & plant painters: (x, y) = feet on tile, s = scale, t = time, i = instance seed */
const DRAW = {
  tree(x, y, s, t, i, kind) {
    const h = 48 * s, sw = sway(t, i * 1.7, h * .025);
    el(x + 6 * s, y + 2 * s, 16 * s, 6 * s, 'rgba(20,30,20,.25)');
    const trunk = kind === 'birch' ? '#ece6dc' : '#6b4a2f';
    line(x, y, x + sw, y - h * .62, trunk, Math.max(2, 4.5 * s));
    const cx = x + sw, cy = y - h * .78;
    if (kind === 'pine') {
      for (let k = 0; k < 3; k++) {
        const yy = y - h * (.38 + k * .22), w = 15 * s * (1.25 - k * .28);
        ctx.fillStyle = k % 2 ? '#3f6e3a' : '#335f31';
        ctx.beginPath(); ctx.moveTo(cx - w, yy + 5 * s); ctx.quadraticCurveTo(cx - w * .2, yy - 10 * s, cx, yy - 12 * s);
        ctx.quadraticCurveTo(cx + w * .2, yy - 10 * s, cx + w, yy + 5 * s); ctx.fill();
      }
      return;
    }
    const C = { oak: ['#4f7d36', '#689a44'], willow: ['#7aa84a', '#9cc463'], apple: ['#4f8a3a', '#6ea64a'] }[kind];
    el(cx - 10 * s, cy + 4 * s, 14 * s, 11 * s, C[0]); el(cx + 10 * s, cy + 3 * s, 13 * s, 11 * s, C[0]);
    el(cx, cy - 6 * s, 16 * s, 13 * s, C[1]); el(cx - 5 * s, cy - 11 * s, 7 * s, 4 * s, 'rgba(255,255,255,.15)');
    if (kind === 'willow') {
      ctx.strokeStyle = '#8fbb55'; ctx.lineWidth = 1.4 * s;
      for (let k = 0; k < 7; k++) {
        const bx = cx - 18 * s + k * 6 * s, by = cy + 2 * s, l = (14 + (k % 3) * 5) * s, w = sway(t, k + i, 2 * s);
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + w, by + l * .6, bx + w * 1.5, by + l); ctx.stroke();
      }
    }
    if (kind === 'apple') for (let k = 0; k < 6; k++) el(cx + Math.cos(k * 1.9 + i) * 12 * s, cy - 2 * s + Math.sin(k * 2.3 + i) * 8 * s, 2.4 * s, 2.4 * s, '#d8403a');
  },
  willow(x, y, s, t, i) { DRAW.tree(x, y, s, t, i, 'willow'); },
  oak(x, y, s, t, i) { DRAW.tree(x, y, s * 1.05, t, i, 'oak'); },
  pine(x, y, s, t, i) { DRAW.tree(x, y, s, t, i, 'pine'); },
  apple(x, y, s, t, i) { DRAW.tree(x, y, s * .9, t, i, 'apple'); },
  reed(x, y, s, t, i) {
    for (let k = 0; k < 5; k++) {
      const bx = x - 9 * s + k * 4.5 * s, l = (15 + (k % 2) * 5) * s, w = sway(t, k + i, 2.5 * s);
      line(bx, y, bx + w, y - l, '#8a9a4a', 1.5 * s); el(bx + w, y - l - 2 * s, 1.6 * s, 3.4 * s, '#7a5a3a');
    }
  },
  moss(x, y, s, t, i) { for (let k = 0; k < 5; k++) el(x + Math.cos(k * 2.4 + i) * 12 * s, y + Math.sin(k * 1.7 + i) * 5 * s, 5 * s, 2.4 * s, k % 2 ? '#6f9a45' : '#86b356'); },
  fern(x, y, s, t, i) {
    for (let k = -2; k <= 2; k++) {
      const w = sway(t, i + k, 1.5 * s); ctx.strokeStyle = '#4f8a3a'; ctx.lineWidth = 1.6 * s;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + k * 5 * s, y - 12 * s, x + k * 9 * s + w, y - 14 * s + Math.abs(k) * 4 * s); ctx.stroke();
    }
  },
  grass(x, y, s, t, i) {
    for (let k = 0; k < 4; k++) {
      const bx = x - 7 * s + k * 5 * s, w = sway(t, i + k, 1.6 * s);
      line(bx, y, bx - 2 * s + w, y - 8 * s, '#5f9a3e', 1.4 * s); line(bx, y, bx + 2 * s + w, y - 9 * s, '#73ad4b', 1.4 * s);
    }
  },
  flower(x, y, s, t, i) {
    const cols = ['#f4d34a', '#f2a8c0', '#f7f3ea'];
    for (let k = 0; k < 3; k++) {
      const bx = x - 8 * s + k * 8 * s, by = y + (k % 2) * 3 * s, w = sway(t, i + k, 1.5 * s);
      line(bx, by, bx + w, by - 11 * s, '#5f9a3e', 1.3 * s);
      el(bx + w, by - 12 * s, 3.2 * s, 2.6 * s, cols[(k + i) % 3]); el(bx + w, by - 12 * s, 1.2 * s, 1.2 * s, '#c9862a');
    }
  },
  fish(x, y, s, t, i) {
    const p = reduceMotion ? 0 : Math.sin(t * .8 + i * 2), fx = x + p * 10 * s, dir = Math.cos(t * .8 + i * 2) >= 0 ? 1 : -1;
    ctx.globalAlpha = .85;
    el(fx, y, 7 * s, 2.8 * s, '#b9a57a', -.45 * dir);
    ctx.fillStyle = '#a08f60'; ctx.beginPath(); ctx.moveTo(fx - dir * 6 * s, y + dir * 3 * s); ctx.lineTo(fx - dir * 11 * s, y + dir * 2 * s); ctx.lineTo(fx - dir * 9 * s, y + dir * 7 * s); ctx.fill();
    ctx.globalAlpha = 1;
  },
  beaver(x, y, s, t) {
    const by = y + (reduceMotion ? 0 : Math.sin(t * 3) * 1.2 * s), d = -1;
    el(x - d * 13 * s, by - 1 * s, 8 * s, 3 * s, '#3f2a1c', .4);
    el(x, by - 5 * s, 12 * s, 7 * s, '#7a4e2c'); el(x + d * 10 * s, by - 9 * s, 6 * s, 5.2 * s, '#865834');
    el(x + d * 15 * s, by - 8 * s, 2.2 * s, 1.8 * s, '#3a2416'); el(x + d * 11 * s, by - 11 * s, 1.1 * s, 1.1 * s, '#111');
    el(x + d * 7 * s, by - 13 * s, 1.6 * s, 1.4 * s, '#5a3a22');
    line(x + d * 6 * s, by - 10 * s, x + d * 24 * s, by - 3 * s, '#6b4a2f', 2.2 * s); el(x + d * 21 * s, by - 6 * s, 3 * s, 1.6 * s, '#6fa44a');
  },
  dam(x, y, s, t, i) {
    // logs laid across the river (along the grid's y axis)
    for (let k = 0; k < 9; k++) {
      const f = k / 8 - .5, lx = x - f * TW * .62 + (hash(k, i) - .5) * 4, ly = y + f * TH * .62 - (k % 3) * 3 * s;
      el(lx, ly, 10 * s, 2.6 * s, k % 2 ? '#6b4a2f' : '#5a3e28', .45);
      el(lx + 8 * s, ly - 3.5 * s, 2 * s, 1.6 * s, '#c9a57a');
    }
    el(x - 4 * s, y - 10 * s, 14 * s, 8 * s, '#5e4430'); el(x - 4 * s, y - 13 * s, 10 * s, 5 * s, '#6e5038');
  },
  frog(x, y, s, t, i) {
    el(x, y, 10 * s, 4 * s, '#4d8a3c'); el(x + 6 * s, y - 1 * s, 2 * s, 1.4 * s, '#f2d8e0');
    const hop = reduceMotion ? 0 : Math.max(0, Math.sin(t * 1.5 + i * 3)) ** 8 * 6 * s;
    el(x - 1 * s, y - 3 * s - hop, 5.5 * s, 3.6 * s, '#5f9a48');
    el(x - 4 * s, y - 6.5 * s - hop, 1.9 * s, 1.9 * s, '#7cbf5a'); el(x + 1.5 * s, y - 6.5 * s - hop, 1.9 * s, 1.9 * s, '#7cbf5a');
    el(x - 4 * s, y - 6.7 * s - hop, .8 * s, .8 * s, '#111'); el(x + 1.5 * s, y - 6.7 * s - hop, .8 * s, .8 * s, '#111');
  },
  heron(x, y, s, t) {
    line(x - 2 * s, y, x - 1 * s, y - 13 * s, '#5a5a5a', 1.3 * s); line(x + 2 * s, y, x + 1 * s, y - 13 * s, '#5a5a5a', 1.3 * s);
    el(x, y - 18 * s, 9 * s, 5.5 * s, '#9aa3a8', -.3); el(x - 7 * s, y - 16 * s, 5 * s, 2 * s, '#7d868b', -.2);
    const look = reduceMotion ? 0 : Math.sin(t * .5) * 2 * s;
    ctx.strokeStyle = '#c4cbcf'; ctx.lineWidth = 2.4 * s; ctx.beginPath();
    ctx.moveTo(x + 6 * s, y - 21 * s); ctx.quadraticCurveTo(x + 1 * s, y - 28 * s, x + 6 * s + look, y - 34 * s); ctx.stroke();
    el(x + 7 * s + look, y - 35 * s, 3.4 * s, 2.6 * s, '#e8ecee'); line(x + 9 * s + look, y - 36 * s, x + 15 * s + look, y - 37 * s, '#2a2a2a', 1 * s);
    line(x + 9 * s + look, y - 35 * s, x + 17 * s + look, y - 34 * s, '#e0b040', 1.4 * s); el(x + 8 * s + look, y - 36 * s, .8 * s, .8 * s, '#111');
  },
  squirrel(x, y, s, t) {
    const b = reduceMotion ? 0 : Math.abs(Math.sin(t * 2.2)) * 2 * s;
    el(x - 7 * s, y - 11 * s - b, 5 * s, 9 * s, '#a8643a', -.35); el(x - 8 * s, y - 15 * s - b, 3 * s, 4 * s, '#c48250', -.35);
    el(x, y - 5 * s - b, 5 * s, 6 * s, '#b8703f'); el(x + 1 * s, y - 3 * s - b, 3 * s, 3.5 * s, '#e8d2b0');
    el(x + 3 * s, y - 12 * s - b, 3.6 * s, 3.2 * s, '#c47a45'); el(x + 2 * s, y - 15.5 * s - b, 1.2 * s, 2 * s, '#c47a45');
    el(x + 4.5 * s, y - 12.5 * s - b, .8 * s, .8 * s, '#111'); el(x + 4 * s, y - 6 * s - b, 1.6 * s, 1.8 * s, '#7a5a30');
  },
  woodpecker(x, y, s, t) {
    const peck = reduceMotion ? 0 : (Math.sin(t * 14) > .6 ? 1.5 * s : 0);
    el(x, y, 3.2 * s, 5.5 * s, '#222'); el(x + .5 * s, y + 1 * s, 1.6 * s, 3 * s, '#f2f0ea');
    el(x + 1.5 * s + peck, y - 5 * s, 2.6 * s, 2.4 * s, '#2a2a2a'); el(x + 1 * s + peck, y - 6.5 * s, 1.8 * s, 1.2 * s, '#c8323a');
    line(x + 3.5 * s + peck, y - 5 * s, x + 6 * s + peck, y - 5 * s, '#444', 1 * s); el(x - .5 * s, y + 5 * s, 1.4 * s, 1 * s, '#c8323a');
  },
  owl(x, y, s, t) {
    const blink = !reduceMotion && (t % 4) > 3.85;
    el(x, y, 6.5 * s, 8.5 * s, '#7a5a3a'); el(x, y - 4 * s, 5.5 * s, 4.2 * s, '#c9a57a');
    if (blink) { line(x - 4 * s, y - 4.5 * s, x - 1 * s, y - 4.5 * s, '#3a2a1a', 1 * s); line(x + 1 * s, y - 4.5 * s, x + 4 * s, y - 4.5 * s, '#3a2a1a', 1 * s); }
    else { el(x - 2.5 * s, y - 4.5 * s, 2 * s, 2 * s, '#f0c84a'); el(x + 2.5 * s, y - 4.5 * s, 2 * s, 2 * s, '#f0c84a'); el(x - 2.5 * s, y - 4.5 * s, .9 * s, .9 * s, '#111'); el(x + 2.5 * s, y - 4.5 * s, .9 * s, .9 * s, '#111'); }
    ctx.fillStyle = '#d0a040'; ctx.beginPath(); ctx.moveTo(x - 1 * s, y - 2.6 * s); ctx.lineTo(x + 1 * s, y - 2.6 * s); ctx.lineTo(x, y - .6 * s); ctx.fill();
    for (let k = 0; k < 3; k++) el(x - 2 * s + k * 2 * s, y + 3 * s, .9 * s, .6 * s, '#5a4028');
  },
  rabbit(x, y, s, t) {
    const hop = reduceMotion ? 0 : Math.max(0, Math.sin(t * 2.4)) ** 4 * 6 * s;
    el(x, y + 1 * s, 8 * s, 2.5 * s, 'rgba(20,30,20,.2)');
    el(x - 7 * s, y - 6 * s - hop, 2.6 * s, 2.4 * s, '#fbfaf6');
    el(x, y - 5 * s - hop, 7.5 * s, 5.2 * s, '#d8d2c8'); el(x + 6 * s, y - 9 * s - hop, 4.2 * s, 3.6 * s, '#e2ddd3');
    el(x + 5 * s, y - 15 * s - hop, 1.4 * s, 4.6 * s, '#e2ddd3', -.15); el(x + 7.5 * s, y - 15 * s - hop, 1.4 * s, 4.6 * s, '#e2ddd3', .25);
    el(x + 7.5 * s, y - 9.5 * s - hop, .8 * s, .8 * s, '#111'); el(x + 10 * s, y - 8.5 * s - hop, .9 * s, .7 * s, '#d08a90');
  },
  bee(x, y, s, t, i) {
    const a = reduceMotion ? i : t * 2.2 + i * 3, bx = x + Math.cos(a) * 16 * s, by = y - 18 * s + Math.sin(a * 1.4) * 5 * s;
    const f = reduceMotion ? 0 : Math.sin(t * 40) * 1.5 * s;
    el(bx - 1 * s, by - 3 * s - f, 2.4 * s, 1.6 * s, 'rgba(255,255,255,.75)', -.4); el(bx + 1.5 * s, by - 3 * s + f, 2.4 * s, 1.6 * s, 'rgba(255,255,255,.75)', .4);
    el(bx, by, 3.6 * s, 2.5 * s, '#f0c030'); line(bx, by - 2.2 * s, bx, by + 2.2 * s, '#2a2a2a', 1.1 * s);
  },
  fox(x, y, s, t) {
    const tw = reduceMotion ? 0 : Math.sin(t * 1.6) * .15;
    el(x, y + 1 * s, 12 * s, 3 * s, 'rgba(20,30,20,.2)');
    el(x - 11 * s, y - 7 * s, 9 * s, 3.8 * s, '#d0682a', .45 + tw); el(x - 17 * s, y - 10 * s, 3 * s, 2.4 * s, '#f6f0e6', .45 + tw);
    line(x - 4 * s, y, x - 4 * s, y - 5 * s, '#4a2a1a', 1.6 * s); line(x + 5 * s, y, x + 5 * s, y - 5 * s, '#4a2a1a', 1.6 * s);
    el(x, y - 7 * s, 9 * s, 5 * s, '#d8742e'); el(x + 2 * s, y - 5 * s, 5 * s, 2.5 * s, '#f2e6d4');
    el(x + 9 * s, y - 11 * s, 4.6 * s, 4 * s, '#e07e34'); el(x + 13 * s, y - 10 * s, 2.6 * s, 1.8 * s, '#f2e6d4');
    ctx.fillStyle = '#c4622a';
    ctx.beginPath(); ctx.moveTo(x + 6 * s, y - 13 * s); ctx.lineTo(x + 7 * s, y - 19 * s); ctx.lineTo(x + 9.5 * s, y - 14 * s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 9.5 * s, y - 14 * s); ctx.lineTo(x + 11.5 * s, y - 19 * s); ctx.lineTo(x + 12.5 * s, y - 13 * s); ctx.fill();
    el(x + 10 * s, y - 12 * s, .9 * s, .9 * s, '#111'); el(x + 15.5 * s, y - 10.5 * s, 1 * s, .8 * s, '#222');
  },
};

/* ================= scene ================= */
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.width * dpr * H / W));
}
const easeBack = p => { const c = 1.7; p = clamp(p, 0, 1); return 1 + (c + 1) * (p - 1) ** 3 + c * (p - 1) ** 2; };

function frame(now) {
  const t = now / 1000, tk = state.terrain, T = TERRAINS[tk], m = effMinutes();
  const f = clamp(m / T.greenAt, 0, 1);
  ctx.setTransform(cv.width / W, 0, 0, cv.width / W, 0, 0);

  // sky, sun, clouds
  const sk = ctx.createLinearGradient(0, 0, 0, H); sk.addColorStop(0, '#8ec4d8'); sk.addColorStop(.8, '#ecdfc6');
  ctx.fillStyle = sk; ctx.fillRect(0, 0, W, H);
  el(620, 62, 24, 24, 'rgba(255,248,220,.95)'); el(620, 62, 44, 44, 'rgba(255,248,220,.18)');
  for (let k = 0; k < 3; k++) {
    const cx = ((t * (reduceMotion ? 0 : 4 + k * 2) + k * 260) % (W + 200)) - 100, cy = 40 + k * 24;
    el(cx, cy, 30, 10, 'rgba(255,255,255,.75)'); el(cx + 18, cy - 6, 20, 9, 'rgba(255,255,255,.75)'); el(cx - 16, cy - 3, 16, 8, 'rgba(255,255,255,.7)');
  }

  const soil = '#8d6c4a', green = tk === 'forest' ? '#5f8f45' : '#79aa52';
  const objs = {};
  for (const sp of T.species) if (got.has(sp.id)) sp.at.forEach(([gx, gy, dx, dy], i) => {
    (objs[gx + ',' + gy] = objs[gx + ',' + gy] || []).push({ sp, dx: dx || 0, dy: dy || 0, i });
  });
  const rockAt = {}; (T.rocks || []).forEach(([gx, gy, min]) => (rockAt[gx + ',' + gy] = min));

  for (let d = 0; d <= (GN - 1) * 2; d++) for (let gx = 0; gx < GN; gx++) {
    const gy = d - gx; if (gy < 0 || gy >= GN) continue;
    const water = T.water(gx, gy, got);
    const h = water ? .35 : T.height(gx, gy);
    // patchy greening: each tile turns green at its own pace
    const tf = clamp(f * 1.6 - hash(gx, gy) * .6, 0, 1);
    let top = water ? hex('#5fa3c6') : mixA(soil, green, tf);
    if (!water && tk === 'forest') top = mixA(rgbHex(top), '#8a8178', clamp((1 - f) * (h - 1) * .35, 0, .6));
    top = top.map(v => v * (.96 + hash(gy, gx) * .08));
    drawTile(gx, gy, h, top, water, t);
    const [x, y] = iso(gx, gy, h);
    const rk = rockAt[gx + ',' + gy];
    if (rk != null && m < rk) drawRock(x, y + 2, 1.4, clamp(1 - (rk - m) / 8, 0, 1));
    for (const o of objs[gx + ',' + gy] || []) {
      const a = appear[o.sp.id], p = a == null ? 1 : easeBack((now - a) / 650);
      if (p <= 0) continue;
      DRAW[o.sp.d](x + o.dx * 1.3, y + o.dy * 1.3, p * 1.3, t, o.i + gx * 3 + gy);
    }
  }
  requestAnimationFrame(frame);
}
function rgbHex(a) { return '#' + a.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); }

/* ================= UI ================= */
function renderTabs() {
  $('tabs').innerHTML = '';
  for (const [k, t] of Object.entries(TERRAINS)) {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.setAttribute('role', 'tab'); b.id = 'tab-' + k;
    b.textContent = t.name; b.setAttribute('aria-selected', k === state.terrain);
    b.disabled = running && k !== state.terrain;
    b.onclick = () => { state.terrain = k; appear = {}; got = unlocked(k, effMinutes()); save(); render(true); };
    $('tabs').appendChild(b);
  }
}

function render(quiet) {
  const T = TERRAINS[state.terrain], m = effMinutes(), now = unlocked(state.terrain, m);
  const fresh = [];
  for (const sp of T.species) {
    if (now.has(sp.id) && !got.has(sp.id)) { if (!quiet) { appear[sp.id] = performance.now(); fresh.push(sp); } }
    if (now.has(sp.id) && !state.seen[sp.id]) { state.seen[sp.id] = true; save(); }
  }
  got = now;
  if (fresh.length) toast(fresh.map(s => s.e + ' ' + s.name).join(', ') + ' 출현!');

  let stageName = T.stages[0][1];
  for (const [min, name] of T.stages) if (m >= min) stageName = name;
  $('stage').textContent = T.name + ' · ' + stageName;

  const next = T.species.find(sp => !got.has(sp.id));
  if (next) {
    const missing = next.req.filter(r => !got.has(r)).map(r => T.species.find(s => s.id === r).name);
    const prev = Math.max(0, ...T.species.filter(s => got.has(s.id)).map(s => s.min));
    $('next').innerHTML = '다음 출현 <b>' + next.e + ' ' + next.name + '</b> · ' + next.min + '분' + (missing.length ? ' · ' + missing.join(', ') + ' 필요' : '');
    $('bar').style.width = clamp(((m - prev) / Math.max(1, next.min - prev)) * 100, 0, 100) + '%';
  } else {
    $('next').innerHTML = '<b>이 지형의 생태계가 완성됐어요</b>';
    $('bar').style.width = '100%';
  }

  $('logTitle').textContent = T.name + ' 도감 · ' + got.size + ' / ' + T.species.length;
  $('log').innerHTML = T.species.map(sp => {
    const ok = got.has(sp.id);
    const cond = sp.req.length ? sp.req.map(r => T.species.find(s => s.id === r).name).join(', ') + ' 필요' : '조건 없음';
    return '<li class="' + (ok ? '' : 'locked') + '"><span class="e">' + sp.e + '</span><span class="n"><strong>' +
      (ok || state.seen[sp.id] ? sp.name : '???') + '</strong><span>' + (ok ? sp.note : cond) + '</span></span><span class="m">' +
      sp.min + '분</span></li>';
  }).join('');
  $('clock').textContent = fmt(running ? sessionMin : 0);
}

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2600);
}
function notice(msg) { $('notice').textContent = msg; $('notice').hidden = !msg; }

function tick() {
  const sec = (Date.now() - startAt) / 1000;
  sessionMin = state.demo ? sec : sec / 60;
  render(false);
}
function start() {
  running = true; startAt = Date.now(); sessionMin = 0;
  notice(''); $('scene').classList.remove('drought');
  $('startBtn').textContent = '공부 마치기'; $('startBtn').classList.add('stop');
  $('demo').disabled = true; renderTabs();
  tickId = setInterval(tick, 250); tick();
}
function stop(commit) {
  clearInterval(tickId);
  if (commit) {
    state.minutes[state.terrain] += sessionMin;
    toast(TERRAINS[state.terrain].name + '에 ' + Math.floor(sessionMin) + '분 기록');
  }
  running = false; sessionMin = 0; save();
  $('startBtn').textContent = '공부 시작'; $('startBtn').classList.remove('stop');
  $('demo').disabled = false; renderTabs(); render(true);
}

$('startBtn').onclick = () => (running ? stop(true) : start());
$('demo').onchange = e => { state.demo = e.target.checked; save(); };
$('resetBtn').onclick = () => {
  if (running) stop(false);
  state.minutes = { river: 0, forest: 0, meadow: 0 }; state.seen = {}; appear = {}; got = new Set();
  notice(''); $('scene').classList.remove('drought'); save(); render(true);
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) {
    const lost = Math.floor(sessionMin);
    stop(false);
    $('scene').classList.add('drought');
    notice('화면을 벗어나서 이번 세션 ' + lost + '분은 기록되지 않았어요. 그동안 찾아온 생물도 떠났어요.');
  }
});
window.addEventListener('resize', resize);

$('demo').checked = state.demo;
got = unlocked(state.terrain, effMinutes());
renderTabs(); render(true); resize();
requestAnimationFrame(frame);
})();
</script>
</body>
