<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숲공부 생태계 타이머</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column field journal — floating block island on top, HUD + timer, then the visitor log */
:root {
  --bg: #eef1ea;
  --surface: #f8faf5;
  --ink: #1d2a22;
  --muted: #5d6b61;
  --line: #d3dacd;
  --accent: #2c6e8f;
  --moss: #4d7a39;
  --warn: #b5562b;
  --gold: #b88a1e;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121814; --surface: #1a221d; --ink: #e3eadf; --muted: #9aa89d; --line: #2c3830;
    --accent: #6cb4d6; --moss: #8cc070; --warn: #e08a5e; --gold: #e6bb4f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1a221d; --ink: #e3eadf; --muted: #9aa89d; --line: #2c3830;
  --accent: #6cb4d6; --moss: #8cc070; --warn: #e08a5e; --gold: #e6bb4f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: .01em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hud { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.lv { font-family: var(--font-display); font-size: 20px; min-width: 52px; }
.xp { flex: 1 1 140px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.xp small { color: var(--muted); font-size: 12px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.bar { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
.cur { display: flex; gap: 6px; }
.chip { font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); white-space: nowrap; }

/* the island is an illustration with its own fixed daylight palette */
.scene {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 720 / 540; border-radius: 16px; overflow: hidden;
  background: #9cc8ec; border: 1px solid var(--line); touch-action: manipulation;
}
.scene canvas { display: block; width: 100%; height: 100%; cursor: pointer; transition: filter 1s; }
.scene.drought canvas { filter: saturate(.25) sepia(.35) brightness(1.05); }
.stage {
  position: absolute; left: 12px; top: 10px; font-family: var(--font-display); font-size: 15px;
  background: rgba(248, 250, 245, .9); color: #1d2a22; padding: 3px 10px; border-radius: 999px; pointer-events: none;
}
.hint {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100% - 24px);
  font-size: 13px; background: rgba(29, 42, 34, .82); color: #f3f6ef; padding: 5px 12px; border-radius: 999px; pointer-events: none; text-align: center;
}

.timer { display: flex; flex-direction: column; gap: 10px; }
.clock { font-family: var(--font-num); font-size: 44px; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font-family: var(--font-display); font-size: 18px; padding: 10px 22px; border-radius: 12px; border: none; background: var(--moss); color: var(--bg); cursor: pointer; }
.btn.stop { background: var(--warn); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 15px; padding: 8px 14px; }
.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin-left: auto; }
.rules { color: var(--muted); font-size: 13px; margin: 0; }
.notice { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border-left: 3px solid var(--warn); }

.log h2 { font-family: var(--font-display); font-weight: 400; font-size: 21px; margin: 0 0 6px; }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; }
@media (max-width: 480px) { .log ol { grid-template-columns: 1fr; } }
.log li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.log li .e { font-size: 22px; text-align: center; }
.log li .n { min-width: 0; }
.log li .n strong { font-family: var(--font-display); font-weight: 400; font-size: 16px; display: block; }
.log li .n span { color: var(--muted); font-size: 13px; }
.log li.locked .e { filter: grayscale(1) opacity(.35); }
.log li.locked strong { color: var(--muted); }

.sheet-back { position: fixed; inset: 0; background: rgba(10, 16, 12, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 620px; max-height: 82%; overflow-y: auto; background: var(--surface); color: var(--ink);
  border-radius: 18px 18px 0 0; padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.sheet h3 { font-family: var(--font-display); font-weight: 400; font-size: 21px; margin: 0; }
.biomes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 420px) { .biomes { grid-template-columns: repeat(2, 1fr); } }
.biome {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px 10px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; min-width: 0; text-align: center;
}
.biome img { width: 72px; height: 72px; image-rendering: pixelated; }
.biome b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.biome span { font-size: 12px; color: var(--muted); }
.biome .cost { font-family: var(--font-num); font-size: 12px; color: var(--ink); }
.biome:disabled { cursor: not-allowed; opacity: .5; }
.biome:disabled .cost { color: var(--warn); }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-family: var(--font-display);
  font-size: 16px; max-width: calc(100% - 32px); text-align: center; z-index: 30;
}
footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>숲공부</h1>
    <p>묘목 한 칸에서 시작해요. 손님이 찾아오면 레벨이 오르고, 땅이 십자로 넓어져요.</p>
  </header>

  <div class="hud">
    <div class="lv" id="lv">Lv 1</div>
    <div class="xp"><div class="bar"><i id="xpbar"></i></div><small id="xptext">0 / 15</small></div>
    <div class="cur">
      <span class="chip" id="cSeed" title="씨앗">🌱 0</span>
      <span class="chip" id="cDrop" title="물방울">💧 0</span>
      <span class="chip" id="cStone" title="돌">🪨 0</span>
    </div>
  </div>

  <div class="scene" id="scene">
    <canvas id="cv" aria-label="공중에 뜬 블록 섬. 빈 땅을 눌러 지형을 정해요."></canvas>
    <div class="stage" id="stage"></div>
    <div class="hint" id="hint" hidden></div>
  </div>

  <section class="timer">
    <div class="clock" id="clock">00:00</div>
    <div class="row">
      <button class="btn" id="startBtn" type="button">공부 시작</button>
      <button class="btn ghost" id="resetBtn" type="button">처음부터</button>
      <label class="toggle"><input type="checkbox" id="demo" checked> 시연 모드 (1초 = 1분)</label>
    </div>
    <p class="rules">씨앗은 공부 1분마다 1개. 물방울은 5분 넘게 공부하고 마치면 2개, 돌은 25분 넘게 한 번에 공부하고 마치면 3개. 경험치는 공부 1분마다 1, 새 손님마다 10.</p>
    <div class="notice" id="notice" hidden></div>
  </section>

  <section class="log">
    <h2 id="logTitle">손님 도감</h2>
    <ol id="log"></ol>
  </section>

  <footer>공부 중에 화면을 벗어나면 그 세션은 없던 일이 돼요. 기록은 이 브라우저에만 저장돼요.</footer>
</div>

<div class="sheet-back" id="sheetBack" hidden>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h3 id="sheetTitle">이 땅을 무엇으로 만들까요?</h3><button class="btn ghost" id="sheetClose" type="button">닫기</button></div>
    <div class="biomes" id="biomes"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
'use strict';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };

/* ================= pixel textures (16×16, generated) ================= */
function mkTex(seed, fn) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d'), r = mulberry(seed);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const col = fn(x, y, r); if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } }
  return c;
}
const pick = (a, r) => a[Math.floor(r() * a.length)];
const P = {
  grass: ['#5e9c3b', '#67a843', '#6fb14a', '#589236', '#62a03e'],
  dirt: ['#8a5a3b', '#7a4f33', '#966540', '#6d452c', '#835536'],
  stone: ['#8d8d8d', '#7e7e7e', '#9a9a9a', '#717171', '#868686'],
  water: ['#3d7fc4', '#4688cc', '#3572b4', '#4f93d6'],
  swamp: ['#4b6a40', '#56764a', '#41603a', '#5d7d4c'],
};
const TEX = {
  grassTop: mkTex(11, (x, y, r) => pick(P.grass, r)),
  grassSide: mkTex(12, (x, y, r) => y < 3 + (r() < .5 ? 1 : 0) + ((x * 7 % 5) === 0 ? 1 : 0) ? pick(P.grass, r) : pick(P.dirt, r)),
  dirt: mkTex(13, (x, y, r) => pick(P.dirt, r)),
  coarse: mkTex(14, (x, y, r) => r() < .18 ? pick(['#9a9086', '#6d6258'], r) : pick(P.dirt, r)),
  stone: mkTex(15, (x, y, r) => r() < .08 ? '#5f5f5f' : pick(P.stone, r)),
  snow: mkTex(16, (x, y, r) => r() < .7 ? pick(['#f4f7fa', '#e6ecf2', '#fafcfe'], r) : pick(P.stone, r)),
  water: [0, 1, 2, 3].map(f => mkTex(20 + f, (x, y, r) => ((x + y * 2 + f * 4) % 16 < 2 && r() < .8) ? '#7db4e8' : pick(P.water, r))),
  waterSide: mkTex(25, (x, y, r) => pick(['#2f6aa8', '#3572b4', '#2a5f98'], r)),
  swamp: mkTex(26, (x, y, r) => r() < .06 ? '#7a9a52' : pick(P.swamp, r)),
  oakLog: mkTex(30, (x, y, r) => x % 4 === 0 ? '#4e3a22' : pick(['#6b5232', '#5f4829', '#76593a'], r)),
  birchLog: mkTex(31, (x, y, r) => (r() < .12 || (y % 6 === 2 && x > 3 && x < 10)) ? '#2b2b2b' : pick(['#e9e5db', '#dcd7cb', '#f2efe7'], r)),
  spruceLog: mkTex(32, (x, y, r) => x % 3 === 0 ? '#2e2014' : pick(['#4a3520', '#3f2d1b', '#553d25'], r)),
  logTop: mkTex(33, (x, y, r) => { const d = Math.hypot(x - 7.5, y - 7.5); return d > 7 ? '#5f4829' : (Math.floor(d) % 2 ? '#b8935c' : '#a6814c'); }),
  oakLeaf: mkTex(40, (x, y, r) => r() < .1 ? '#24501a' : pick(['#3f7d2a', '#4a8f32', '#356a24', '#43852d'], r)),
  birchLeaf: mkTex(41, (x, y, r) => r() < .1 ? '#3f6a28' : pick(['#6aa043', '#7bb24f', '#5c8f3a'], r)),
  spruceLeaf: mkTex(42, (x, y, r) => r() < .1 ? '#1b3a20' : pick(['#2f5a34', '#3a6a3e', '#264a2b'], r)),
  cherryLeaf: mkTex(43, (x, y, r) => r() < .08 ? '#d97ea2' : pick(['#f2b6cc', '#f7c8d8', '#eba3bf', '#fbe0ea'], r)),
};

/* ================= world ================= */
const W = 720, H = 540, TW = 64, TH = 32, BH = 34, N = 9, C = 4, BOTTOM = -1.6, MAXLV = 5;
const LV_XP = [0, 0, 15, 50, 110, 200]; // xp needed to reach level n
const ring = (gx, gy) => Math.abs(gx - C) + Math.abs(gy - C);
const key = (gx, gy) => gx + ',' + gy;

const BIOMES = {
  sapling: { name: '어미나무', top: 'grassTop', side: 'grassSide', h: 1 },
  empty: { name: '빈 땅', top: 'coarse', side: 'dirt', h: 1 },
  plains: { name: '초원', cost: { seed: 3 }, top: 'grassTop', side: 'grassSide', h: 1, hint: '토끼·여우' },
  meadow: { name: '꽃밭', cost: { seed: 6 }, top: 'grassTop', side: 'grassSide', h: 1, hint: '나비·꿀벌' },
  oak: { name: '참나무 숲', cost: { seed: 8 }, top: 'grassTop', side: 'grassSide', h: 1, tree: 'oak', hint: '다람쥐·딱따구리' },
  birch: { name: '자작나무 숲', cost: { seed: 10 }, top: 'grassTop', side: 'grassSide', h: 1, tree: 'birch', hint: '박새' },
  cherry: { name: '벚나무 숲', cost: { seed: 14 }, top: 'grassTop', side: 'grassSide', h: 1, tree: 'cherry', tint: 'rgba(255,214,228,.12)', hint: '동박새' },
  taiga: { name: '침엽수림', cost: { seed: 10, stone: 1 }, top: 'grassTop', side: 'grassSide', h: 1, tree: 'spruce', tint: 'rgba(20,50,35,.22)', hint: '노루' },
  river: { name: '강', cost: { drop: 2 }, top: 'water', side: 'waterSide', h: .8, water: true, hint: '피라미·비버' },
  swamp: { name: '습지', cost: { drop: 2, seed: 4 }, top: 'swamp', side: 'grassSide', h: .86, hint: '개구리·반딧불이' },
  mountain: { name: '돌산', cost: { stone: 2 }, top: 'stone', side: 'stone', h: 2, hint: '산양·검독수리' },
};
const BUYABLE = ['plains', 'meadow', 'oak', 'birch', 'cherry', 'taiga', 'river', 'swamp', 'mountain'];
const CUR = { seed: '🌱', drop: '💧', stone: '🪨' };

// trees: trunk + stacked leaf blocks, sizes in TW units; top = canopy height for perching
const TREES = {
  oak: { log: 'oakLog', leaf: 'oakLeaf', tw: .16, th: .46, leaves: [[.64, .34, .38], [.4, .2, .72]], top: .92 },
  birch: { log: 'birchLog', leaf: 'birchLeaf', tw: .13, th: .62, leaves: [[.46, .3, .5], [.3, .16, .8]], top: .96 },
  cherry: { log: 'oakLog', leaf: 'cherryLeaf', tw: .16, th: .4, leaves: [[.74, .3, .34], [.5, .2, .64]], top: .84 },
  spruce: { log: 'spruceLog', leaf: 'spruceLeaf', tw: .13, th: .3, leaves: [[.66, .16, .16], [.52, .16, .34], [.38, .16, .52], [.22, .14, .68]], top: .82 },
  mother3: { log: 'oakLog', leaf: 'oakLeaf', tw: .2, th: .56, leaves: [[.86, .4, .48], [.56, .26, .88]], top: 1.14 },
  mother2: { log: 'oakLog', leaf: 'oakLeaf', tw: .13, th: .3, leaves: [[.46, .26, .26]], top: .52 },
  mother1: { log: 'oakLog', leaf: 'oakLeaf', tw: 0, th: 0, leaves: [[.28, .2, 0]], top: .2 },
};
const STAGE_MIN = [0, 4, 12, 30];
const STAGE_NAME = ['새싹', '덤불', '어린나무', '큰나무'];
const stageOf = m => STAGE_MIN.reduce((s, v, i) => (m >= v ? i : s), 0);

/* ================= visitors (real species) ================= */
const tileJit = (gx, gy) => [(hash(gx, gy) - .5) * TW * .14, (hash(gy, gx) - .5) * TH * .2];
const VISITORS = [
  { id: 'ladybug', name: '무당벌레', e: '🐞', need: '어미나무가 덤불로 자라면', cond: M => M.stage >= 1, at: M => [M.center, 'leafside'], d: 'ladybug' },
  { id: 'sparrow', name: '참새', e: '🐦', need: '어미나무가 어린나무가 되면', cond: M => M.stage >= 2, at: M => [M.center, 'perch'], d: 'sparrow' },
  { id: 'butterfly', name: '배추흰나비', e: '🦋', need: '꽃밭 1칸', cond: M => M.n('meadow') >= 1, at: M => [M.of('meadow')[0], 'air'], d: 'butterfly' },
  { id: 'bee', name: '꿀벌', e: '🐝', need: '꽃밭 2칸', cond: M => M.n('meadow') >= 2, at: M => [M.of('meadow')[1], 'air'], d: 'bee' },
  { id: 'rabbit', name: '멧토끼', e: '🐇', need: '초원 2칸', cond: M => M.n('plains') >= 2, at: M => [M.of('plains')[0], 'ground'], d: 'rabbit' },
  { id: 'squirrel', name: '다람쥐', e: '🐿️', need: '참나무 숲 1칸', cond: M => M.n('oak') >= 1, at: M => [M.of('oak')[0], 'base'], d: 'squirrel' },
  { id: 'tit', name: '박새', e: '🐦', need: '자작나무 숲 1칸', cond: M => M.n('birch') >= 1, at: M => [M.of('birch')[0], 'perch'], d: 'tit' },
  { id: 'woodpecker', name: '오색딱따구리', e: '🐦', need: '참나무·자작나무 숲 합쳐 3칸', cond: M => M.n('oak') + M.n('birch') >= 3, at: M => [M.of('oak').concat(M.of('birch')).slice(-1)[0], 'trunk'], d: 'woodpecker' },
  { id: 'whiteeye', name: '동박새', e: '🐦', need: '벚나무 숲 1칸', cond: M => M.n('cherry') >= 1, at: M => [M.of('cherry')[0], 'perch'], d: 'whiteeye' },
  { id: 'fox', name: '여우', e: '🦊', need: '초원 2칸 + 숲 2칸', cond: M => M.n('plains') >= 2 && M.n('oak') + M.n('birch') + M.n('taiga') >= 2, at: M => [M.of('plains').slice(-1)[0], 'ground'], d: 'fox' },
  { id: 'roe', name: '노루', e: '🦌', need: '침엽수림 2칸', cond: M => M.n('taiga') >= 2, at: M => [M.of('taiga')[1], 'ground'], d: 'roe' },
  { id: 'fish', name: '피라미', e: '🐟', need: '강 2칸', cond: M => M.n('river') >= 2, at: M => [M.of('river')[0], 'water'], d: 'fish' },
  { id: 'beaver', name: '비버', e: '🦫', need: '참나무·자작나무 숲 옆에 강', cond: M => !!M.riverByWood(), at: M => [M.riverByWood(), 'water'], d: 'beaver' },

    el(x - 4 * s, y - 6.7 * s - hop, .8 * s, .8 * s, '#111'); el(x + 1.5 * s, y - 6.7 * s - hop, .8 * s, .8 * s, '#111');
  },
  heron(x, y, s, t) {
    line(x - 2 * s, y, x - 1 * s, y - 13 * s, '#5a5a5a', 1.3 * s); line(x + 2 * s, y, x + 1 * s, y - 13 * s, '#5a5a5a', 1.3 * s);
    el(x, y - 18 * s, 9 * s, 5.5 * s, '#9aa3a8', -.3); el(x - 7 * s, y - 16 * s, 5 * s, 2 * s, '#7d868b', -.2);
    const look = reduceMotion ? 0 : Math.sin(t * .5) * 2 * s;
    ctx.strokeStyle = '#c4cbcf'; ctx.lineWidth = 2.4 * s; ctx.beginPath();
    ctx.moveTo(x + 6 * s, y - 21 * s); ctx.quadraticCurveTo(x + 1 * s, y - 28 * s, x + 6 * s + look, y - 34 * s); ctx.stroke();
    el(x + 7 * s + look, y - 35 * s, 3.4 * s, 2.6 * s, '#e8ecee'); line(x + 9 * s + look, y - 36 * s, x + 15 * s + look, y - 37 * s, '#2a2a2a', 1 * s);
    line(x + 9 * s + look, y - 35 * s, x + 17 * s + look, y - 34 * s, '#e0b040', 1.4 * s); el(x + 8 * s + look, y - 36 * s, .8 * s, .8 * s, '#111');
  },
  goral(x, y, s, t) {
    const look = reduceMotion ? 0 : Math.sin(t * .4) * 1.5 * s;
    el(x, y + 1 * s, 11 * s, 3 * s, 'rgba(20,30,20,.25)');
    for (const lx of [-6, -3, 4, 7]) line(x + lx * s, y, x + lx * s, y - 8 * s, '#3a3430', 2 * s);
    el(x, y - 11 * s, 10 * s, 6 * s, '#857a6e'); el(x + 2 * s, y - 8 * s, 6 * s, 2.5 * s, '#a69a8c');
    el(x + 10 * s + look, y - 16 * s, 4.4 * s, 3.8 * s, '#8f8478'); el(x + 12.5 * s + look, y - 13.5 * s, 2.4 * s, 1.8 * s, '#f0ece4');
    line(x + 9 * s + look, y - 19 * s, x + 7.5 * s + look, y - 23 * s, '#2a2622', 1.4 * s); line(x + 11 * s + look, y - 19 * s, x + 10 * s + look, y - 23 * s, '#2a2622', 1.4 * s);
    el(x + 11.5 * s + look, y - 17 * s, .8 * s, .8 * s, '#111');
  },
  eagle(x, y, s, t, i) {
    const a = reduceMotion ? i : t * .5 + i, ex = x + Math.cos(a) * 46, ey = y - 78 + Math.sin(a) * 10;
    const f = reduceMotion ? 0 : Math.sin(t * 2) * 2;
    ctx.fillStyle = '#4a3624';
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.quadraticCurveTo(ex - 12, ey - 6 - f, ex - 24, ey - 2 - f); ctx.lineTo(ex - 10, ey + 2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.quadraticCurveTo(ex + 12, ey - 6 - f, ex + 24, ey - 2 - f); ctx.lineTo(ex + 10, ey + 2); ctx.closePath(); ctx.fill();
    el(ex, ey + 1, 4, 3, '#5a4230'); el(ex + 2, ey - 1, 2.2, 2, '#c9a06a');
  },
  firefly() {},
};

/* particles: cherry petals & fireflies */
let petals = [];
function particles(t, dt, open) {
  const cherries = open.filter(([, , b]) => b === 'cherry');
  if (!reduceMotion && cherries.length && petals.length < 30 && Math.random() < dt * 3 * cherries.length) {
    const [gx, gy] = cherries[Math.floor(Math.random() * cherries.length)];
    petals.push({ x: isoX(gx, gy) + (Math.random() - .5) * 40, y: isoY(gx, gy, 1) - TW * .7, vx: 6 + Math.random() * 8, vy: 10 + Math.random() * 6, life: 4, r: Math.random() * 6 });
  }
  for (const p of petals) { p.x += (p.vx + Math.sin(t * 2 + p.r) * 8) * dt; p.y += p.vy * dt; p.life -= dt; ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = '#f7c2d4'; ctx.fillRect(p.x, p.y, 2.4, 2.4); }
  ctx.globalAlpha = 1; petals = petals.filter(p => p.life > 0);
  if (present.has('firefly')) {
    const sw = open.filter(([, , b]) => b === 'swamp');
    ctx.globalCompositeOperation = 'lighter';
    sw.forEach(([gx, gy], j) => {
      for (let k = 0; k < 5; k++) {
        const a = t * (.6 + k * .1) + k * 2 + j, fx = isoX(gx, gy) + Math.cos(a) * 20, fy = isoY(gx, gy, 1) - 14 + Math.sin(a * 1.3) * 8;
        const g = .5 + .5 * Math.sin(t * 3 + k * 1.7 + j);
        const rg = ctx.createRadialGradient(fx, fy, 0, fx, fy, 6); rg.addColorStop(0, `rgba(230,255,140,${.9 * g})`); rg.addColorStop(1, 'rgba(230,255,140,0)');
        ctx.fillStyle = rg; ctx.fillRect(fx - 6, fy - 6, 12, 12);
      }
    });
    ctx.globalCompositeOperation = 'source-over';
  }
}

function openTiles() {
  const out = [];
  for (let gx = 0; gx < N; gx++) for (let gy = 0; gy < N; gy++) if (ring(gx, gy) <= state.lv - 1) out.push([gx, gy, state.tiles[key(gx, gy)] || 'empty']);
  return out;
}
function fitCamera() {
  const open = openTiles(), r = Math.min(state.lv, MAXLV - 1);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const add = (gx, gy) => { const x = isoX(gx, gy), y = isoY(gx, gy, 0); x0 = Math.min(x0, x - TW / 2); x1 = Math.max(x1, x + TW / 2); y0 = Math.min(y0, y - 3.4 * BH); y1 = Math.max(y1, y + TH / 2 - BOTTOM * BH); };
  open.forEach(([gx, gy]) => add(gx, gy));
  if (state.lv < MAXLV) for (let gx = 0; gx < N; gx++) for (let gy = 0; gy < N; gy++) if (ring(gx, gy) === r) add(gx, gy);
  camT.z = clamp(Math.min(W * .9 / (x1 - x0), H * .86 / (y1 - y0)), .5, 2.6);
  camT.x = (x0 + x1) / 2; camT.y = (y0 + y1) / 2 + 6 / camT.z;
}

function resize() {
  const r = cv.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.width * dpr * H / W));
}
const easeBack = p => { const c = 1.7; p = clamp(p, 0, 1); return 1 + (c + 1) * (p - 1) ** 3 + c * (p - 1) ** 2; };
let lastFrame = 0;
const clouds = [0, 1, 2, 3].map(k => ({ x: k * 210, y: 50 + (k % 2) * 60 + k * 8, w: 70 + (k * 37) % 50 }));

function frame(now) {
  const t = now / 1000, dt = Math.min(.1, (now - (lastFrame || now)) / 1000); lastFrame = now;
  const k = cv.width / W;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.imageSmoothingEnabled = false;
  // sky
  const sk = ctx.createLinearGradient(0, 0, 0, H); sk.addColorStop(0, '#6fa8e0'); sk.addColorStop(.7, '#bcdcf2'); sk.addColorStop(1, '#e4f0f6');
  ctx.fillStyle = sk; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,250,215,.25)'; ctx.fillRect(608, 36, 64, 64);
  ctx.fillStyle = '#fff6c8'; ctx.fillRect(620, 48, 40, 40);
  for (const c of clouds) {
    if (!reduceMotion) c.x += dt * 6; if (c.x > W + 120) c.x = -160;
    ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.fillRect(c.x, c.y, c.w, 14); ctx.fillRect(c.x + 14, c.y - 10, c.w * .55, 10);
    ctx.fillStyle = 'rgba(205,225,240,.6)'; ctx.fillRect(c.x, c.y + 14, c.w, 4);
  }
  // camera
  for (const p of ['x', 'y', 'z']) cam[p] += (camT[p] - cam[p]) * (reduceMotion ? 1 : Math.min(1, dt * 3));
  ctx.setTransform(k * cam.z, 0, 0, k * cam.z, k * (W / 2 - cam.x * cam.z), k * (H / 2 - cam.y * cam.z));

  const open = openTiles(), vis = visitorsNow(), byTile = {};
  for (const o of vis) (byTile[o.k] = byTile[o.k] || []).push(o);
  const nextRing = state.lv < MAXLV ? state.lv : -1;
  for (let d = 0; d <= (N - 1) * 2; d++) for (let gx = 0; gx < N; gx++) {
    const gy = d - gx; if (gy < 0 || gy >= N) continue;
    const rg = ring(gx, gy), kk = key(gx, gy);
    if (rg === nextRing) { // ghost of the next ring
      const x = isoX(gx, gy), y = isoY(gx, gy, 1);
      ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1; diamond(x, y, .92); ctx.stroke(); ctx.setLineDash([]);
      continue;
    }
    if (rg > state.lv - 1) continue;
    const b = state.tiles[kk] || 'empty', B = BIOMES[b];
    const ta = tileAppear[kk], p = ta == null ? 1 : clamp((now - ta) / 700, 0, 1), ep = easeBack(p);
    const x = isoX(gx, gy), y = isoY(gx, gy, B.h) + (1 - p) * BH * 3;
    if (p < 1) ctx.globalAlpha = p;
    terrain(x, y, b, t);
    ctx.globalAlpha = 1;
    if (b === 'empty') {
      const pul = reduceMotion ? .6 : .45 + .35 * Math.sin(t * 3 + gx + gy);
      ctx.fillStyle = `rgba(255,255,255,${pul})`; ctx.fillRect(x - 6, y - 1.5, 12, 3); ctx.fillRect(x - 1.5, y - 6, 3, 12);
    }
    const da = tileAppear['d' + kk], dp = da == null ? 1 : easeBack((now - da) / 650);
    if (dp > 0) decor(gx, gy, b, x, y, t, dp);
    if (selected === kk) { ctx.strokeStyle = '#fff6c8'; ctx.lineWidth = 2; diamond(x, y); ctx.stroke(); }
    for (const o of byTile[kk] || []) {
      if (o.v.d === 'firefly') continue;
      const a = appear[o.v.id], s = (a == null ? 1 : easeBack((now - a) / 650)) * .85;
      if (s <= 0) continue;
      const [jx, jy] = tileJit(gx, gy);
      let px = x + jx, py = y + jy;
      if (o.mode === 'perch' || o.mode === 'leafside') {
        const T = b === 'sapling' ? TREES['mother' + Math.max(1, stageOf(state.total))] : TREES[B.tree];
        if (o.mode === 'perch') { py -= TW * T.top + (b === 'sapling' ? 0 : 0); px += 2; }
        else { py -= TW * T.top * .55; px += TW * (T.leaves[0][0] * .3); }
        if (b === 'sapling') { px = x; py = y + 2 - TW * T.top + (o.mode === 'leafside' ? TW * T.top * .45 : 0); if (o.mode === 'leafside') px += TW * T.leaves[0][0] * .3; }
      } else if (o.mode === 'trunk') { px += 4; py -= TW * TREES[B.tree].th * .6; }
      else if (o.mode === 'base') { px += 12; py += 4; }
      else if (o.mode === 'ground') { px += (hash(gx + 3, gy) - .5) * 14; py += 3; }
      else if (o.mode === 'water') { py += 2; }
      if (o.mode === 'sky') { ctx.save(); DRAW.eagle(px, py, s, t, gx + gy); ctx.restore(); continue; }
      DRAW[o.v.d](px, py, s, t, gx * 3 + gy);
    }
  }
  particles(t, dt, open);
  requestAnimationFrame(frame);
}

/* ================= UI ================= */
function costText(c) { return Object.entries(c).map(([k, v]) => CUR[k] + ' ' + v).join('  '); }
const canPay = c => Object.entries(c).every(([k, v]) => state.cur[k] >= v);

let previews = {};
function makePreviews() {
  const main = ctx;
  for (const b of BUYABLE) {
    const c = document.createElement('canvas'); c.width = c.height = 144; ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
    ctx.setTransform(1.2, 0, 0, 1.2, 72, 108 - (BIOMES[b].h - 1) * BH * .3);
    terrainPreview(b);
    previews[b] = c.toDataURL();
  }
  ctx = main;
}
function terrainPreview(b) {
  const B = BIOMES[b], y = -B.h * BH * .55 + 8;
  // a short column for the preview
  terrainShort(0, y, b);
  decor(0, 0, b, 0, y, 0, 1);
}
function terrainShort(x, y, b) {
  const B = BIOMES[b], hw = TW / 2, hh = TH / 2, len = Math.min(B.h, 1) * BH;
  face(TEX[B.side], 16 * Math.min(B.h, 1), x - hw, y, hw, hh, 0, len, 'rgba(0,0,0,.16)');
  face(TEX[B.side], 16 * Math.min(B.h, 1), x, y + hh, hw, -hh, 0, len, 'rgba(0,0,0,.34)');
  const top = B.top === 'water' ? TEX.water[0] : TEX[B.top];
  face(top, 16, x, y - hh, hw, hh, -hw, hh, null);
  if (B.tint) { ctx.fillStyle = B.tint; diamond(x, y); ctx.fill(); }
}

function openSheet(k) {
  selected = k;
  $('biomes').innerHTML = '';
  for (const b of BUYABLE) {
    const B = BIOMES[b], btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'biome'; btn.id = 'biome-' + b; btn.disabled = !canPay(B.cost);
    btn.innerHTML = '<img alt="" src="' + previews[b] + '"><b>' + B.name + '</b><span>' + B.hint + '</span><span class="cost">' + costText(B.cost) + '</span>';
    btn.onclick = () => buy(k, b);
    $('biomes').appendChild(btn);
  }
  $('sheetBack').hidden = false;
}
function closeSheet() { $('sheetBack').hidden = true; selected = null; }
function buy(k, b) {
  const B = BIOMES[b]; if (!canPay(B.cost)) return;
  for (const [c, v] of Object.entries(B.cost)) state.cur[c] -= v;
  state.tiles[k] = b; tileAppear['d' + k] = performance.now();
  save(); closeSheet(); toast(B.name + ' 완성'); evaluate(false);
}

function evaluate(quiet) {
  const vis = visitorsNow(), ids = new Set(vis.map(o => o.v.id)), news = [];
  for (const o of vis) {
    if (!present.has(o.v.id) && !quiet) appear[o.v.id] = performance.now();
    if (!state.seen[o.v.id]) { state.seen[o.v.id] = true; state.xp += 10; news.push(o.v); }
  }
  present = ids;
  if (news.length && !quiet) toast(news.map(v => v.e + ' ' + v.name).join(', ') + ' 방문! 경험치 +' + news.length * 10);
  levelCheck(quiet);
  save(); renderUI();
}
function levelCheck(quiet) {
  while (state.lv < MAXLV && state.xp >= LV_XP[state.lv + 1]) {
    state.lv++;
    const now = performance.now(), r = state.lv - 1;
    let cnt = 0;
    for (let gx = 0; gx < N; gx++) for (let gy = 0; gy < N; gy++) if (ring(gx, gy) === r) { tileAppear[key(gx, gy)] = quiet ? null : now + cnt * 60; cnt++; }
    if (!quiet) setTimeout(() => toast('레벨 ' + state.lv + '! 새 땅 ' + cnt + '칸이 열렸어요'), 900);
    fitCamera();
  }
}

function renderUI() {
  const lv = state.lv, lo = LV_XP[lv], hi = LV_XP[lv + 1];
  $('lv').textContent = 'Lv ' + lv;
  if (lv >= MAXLV) { $('xpbar').style.width = '100%'; $('xptext').textContent = '최고 레벨'; }
  else { $('xpbar').style.width = clamp((state.xp - lo) / (hi - lo) * 100, 0, 100) + '%'; $('xptext').textContent = Math.floor(state.xp) + ' / ' + hi + ' 경험치'; }
  $('cSeed').textContent = '🌱 ' + Math.floor(state.cur.seed);
  $('cDrop').textContent = '💧 ' + state.cur.drop;
  $('cStone').textContent = '🪨 ' + state.cur.stone;
  const st = stageOf(state.total);
  $('stage').textContent = '어미나무 · ' + STAGE_NAME[st];
  const empties = openTiles().filter(o => o[2] === 'empty').length;
  $('hint').hidden = !empties; $('hint').textContent = '빈 땅을 눌러 지형 고르기 · ' + empties + '칸';
  $('logTitle').textContent = '손님 도감 · ' + Object.keys(state.seen).length + ' / ' + VISITORS.length;
  $('log').innerHTML = VISITORS.map(v => {
    const ok = state.seen[v.id], here = present.has(v.id);
    return '<li class="' + (ok ? '' : 'locked') + '"><span class="e">' + v.e + '</span><span class="n"><strong>' + (ok ? v.name : '???') +
      '</strong><span>' + (here ? '지금 머무는 중' : (ok ? '다시 오려면: ' : '') + v.need) + '</span></span></li>';
  }).join('');
  $('clock').textContent = fmt(running ? session : 0);
}
const fmt = m => { const t = Math.floor(m); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
function toast(msg) { const e = $('toast'); e.textContent = msg; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (e.hidden = true), 2600); }
function notice(msg) { $('notice').textContent = msg; $('notice').hidden = !msg; }

/* ================= session ================= */
function tick() {
  const now = Date.now(), d = (now - lastTick) / 1000 * (state.demo ? 1 : 1 / 60); lastTick = now;
  session += d; state.total += d; state.cur.seed += d; state.xp += d;
  evaluate(false);
}
function start() {
  snapshot = JSON.stringify(state);
  running = true; startAt = lastTick = Date.now(); session = 0;
  notice(''); $('scene').classList.remove('drought');
  $('startBtn').textContent = '공부 마치기'; $('startBtn').classList.add('stop'); $('demo').disabled = true;
  tickId = setInterval(tick, 200); renderUI();
}
function stop(commit) {
  clearInterval(tickId);
  running = false;
  if (commit) {
    const bonus = [];
    if (session >= 5) { state.cur.drop += 2; bonus.push('💧 2'); }
    if (session >= 25) { state.cur.stone += 3; bonus.push('🪨 3'); }
    toast(Math.floor(session) + '분 공부 완료' + (bonus.length ? ' · 보너스 ' + bonus.join(', ') : ''));
  }
  session = 0; save();
  $('startBtn').textContent = '공부 시작'; $('startBtn').classList.remove('stop'); $('demo').disabled = false;
  renderUI();
}
$('startBtn').onclick = () => (running ? stop(true) : start());
$('demo').onchange = e => { state.demo = e.target.checked; save(); };
$('resetBtn').onclick = () => {
  if (running) stop(false);
  state = fresh(); state.demo = $('demo').checked; present = new Set(); appear = {}; tileAppear = {};
  notice(''); $('scene').classList.remove('drought'); save(); fitCamera(); evaluate(true);
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) {
    const lost = Math.floor(session);
    stop(false);
    if (snapshot) { state = JSON.parse(snapshot); save(); }
    present = new Set(visitorsNow().map(o => o.v.id)); fitCamera(); renderUI();
    $('scene').classList.add('drought');
    notice('화면을 벗어나서 이번 세션 ' + lost + '분은 없던 일이 됐어요. 그동안 얻은 재화와 손님, 땅도 되돌아갔어요.');
  }
});

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width, sy = (e.clientY - r.top) * H / r.height;
  const wx = (sx - W / 2) / cam.z + cam.x, wy = (sy - H / 2) / cam.z + cam.y;
  let hit = null;
  for (const [gx, gy, b] of openTiles()) {
    const x = isoX(gx, gy), y = isoY(gx, gy, BIOMES[b].h);
    if (Math.abs(wx - x) / (TW / 2) + Math.abs(wy - y) / (TH / 2) <= 1 && (!hit || gx + gy > hit[0] + hit[1])) hit = [gx, gy, b];
  }
  if (hit && hit[2] === 'empty') openSheet(key(hit[0], hit[1]));
  else if (hit && hit[2] !== 'empty') toast(BIOMES[hit[2]].name);
});
$('sheetClose').onclick = closeSheet;
$('sheetBack').addEventListener('click', e => { if (e.target === $('sheetBack')) closeSheet(); });
window.addEventListener('resize', resize);

$('demo').checked = state.demo;
makePreviews();
present = new Set(visitorsNow().map(o => o.v.id));
fitCamera(); cam = { ...camT };
resize(); renderUI();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
