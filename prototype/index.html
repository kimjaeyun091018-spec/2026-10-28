<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숲공부 생태계 타이머</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column field journal — floating block island on top, HUD + timer, then the visitor log */
:root {
  --bg: #eef1ea;
  --surface: #f8faf5;
  --ink: #1d2a22;
  --muted: #5d6b61;
  --line: #d3dacd;
  --accent: #2c6e8f;
  --moss: #4d7a39;
  --warn: #b5562b;
  --gold: #b88a1e;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121814; --surface: #1a221d; --ink: #e3eadf; --muted: #9aa89d; --line: #2c3830;
    --accent: #6cb4d6; --moss: #8cc070; --warn: #e08a5e; --gold: #e6bb4f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1a221d; --ink: #e3eadf; --muted: #9aa89d; --line: #2c3830;
  --accent: #6cb4d6; --moss: #8cc070; --warn: #e08a5e; --gold: #e6bb4f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: .01em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hud { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.lv { font-family: var(--font-display); font-size: 20px; min-width: 52px; }
.xp { flex: 1 1 140px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.xp small { color: var(--muted); font-size: 12px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.bar { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }

/* the island is an illustration with its own fixed daylight palette */
.scene {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 720 / 540; border-radius: 16px; overflow: hidden;
  background: #2a3a58; border: 1px solid var(--line); touch-action: manipulation;
}
.scene canvas { display: block; width: 100%; height: 100%; cursor: pointer; transition: filter 1s; }
.scene.drought canvas { filter: saturate(.25) sepia(.35) brightness(1.05); }
.stage {
  position: absolute; left: 12px; top: 10px; font-family: var(--font-display); font-size: 15px;
  background: rgba(248, 250, 245, .9); color: #1d2a22; padding: 3px 10px; border-radius: 999px; pointer-events: none;
}
.hint {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100% - 24px);
  font-size: 13px; background: rgba(29, 42, 34, .82); color: #f3f6ef; padding: 5px 12px; border-radius: 999px; pointer-events: none; text-align: center;
}

.timer { display: flex; flex-direction: column; gap: 10px; }
.clock { font-family: var(--font-num); font-size: 44px; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font-family: var(--font-display); font-size: 18px; padding: 10px 22px; border-radius: 12px; border: none; background: var(--moss); color: var(--bg); cursor: pointer; }
.btn.stop { background: var(--warn); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 15px; padding: 8px 14px; }
.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin-left: auto; }
.rules { color: var(--muted); font-size: 13px; margin: 0; }
.notice { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border-left: 3px solid var(--warn); }

.log h2 { font-family: var(--font-display); font-weight: 400; font-size: 21px; margin: 0 0 6px; }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; }
@media (max-width: 480px) { .log ol { grid-template-columns: 1fr; } }
.log li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.log li .e { font-size: 22px; text-align: center; }
.log li .n { min-width: 0; }
.log li .n strong { font-family: var(--font-display); font-weight: 400; font-size: 16px; display: block; }
.log li .n span { color: var(--muted); font-size: 13px; }
.log li.locked .e { filter: grayscale(1) opacity(.35); }
.log li.locked strong { color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-family: var(--font-display);
  font-size: 16px; max-width: calc(100% - 32px); text-align: center; z-index: 30;
}
footer { color: var(--muted); font-size: 13px; }
.account { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; }
.account .who { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; }
.account .who b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.account .st { display: block; color: var(--muted); font-size: 12px; }
.account .st.err { color: var(--warn); }
.gbtn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.gbtn:disabled { opacity: .5; cursor: not-allowed; }
.gbtn svg { width: 16px; height: 16px; flex: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div class="wrap">
  <header>
    <h1>숲공부</h1>
    <p>구름 위 작은 섬, 묘목 한 칸에서 시작해요. 공부하면 레벨이 오르고, 땅이 십자로 넓어지며 어떤 지형이 생길지는 그때그때 달라요.</p>
  </header>

  <div class="account" id="account">
    <div class="who"><b id="accName">게스트</b><span class="st" id="accSt">이 브라우저에만 저장돼요</span></div>
    <button class="gbtn" id="gLogin" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.2 1.5-5 2.3-8.2 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>구글로 로그인</button>
    <button class="btn ghost" id="gLogout" type="button" hidden>로그아웃</button>
  </div>

  <div class="hud">
    <div class="lv" id="lv">Lv 1</div>
    <div class="xp"><div class="bar"><i id="xpbar"></i></div><small id="xptext">0 / 15</small></div>
  </div>

  <div class="scene" id="scene">
    <canvas id="cv" aria-label="구름 위에 뜬 섬. 공부할수록 땅이 넓어지고 손님이 찾아와요."></canvas>
    <div class="stage" id="stage"></div>
    <div class="hint" id="hint" hidden></div>
  </div>

  <section class="timer">
    <div class="clock" id="clock">00:00</div>
    <div class="row">
      <button class="btn" id="startBtn" type="button">공부 시작</button>
      <button class="btn ghost" id="resetBtn" type="button">처음부터</button>
      <label class="toggle"><input type="checkbox" id="demo" checked> 시연 모드 (1초 = 1분)</label>
    </div>
    <p class="rules">경험치는 공부 1분마다 1, 새 손님마다 10. 레벨이 오르면 새 땅이 열리고, 지형은 저절로 생겨요.</p>
    <div class="notice" id="notice" hidden></div>
  </section>

  <section class="log">
    <h2 id="logTitle">손님 도감</h2>
    <ol id="log"></ol>
  </section>

  <footer>공부 중에 화면을 벗어나면 그 세션은 없던 일이 돼요. 게스트 기록은 이 브라우저에만, 구글로 로그인하면 클라우드에도 저장돼요.</footer>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
'use strict';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };

/* ================= colour helpers ================= */
const hexRgb = c => c[0] === '#' ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : c.match(/[\d.]+/g).slice(0, 3).map(Number);
function tone(c, k) { // k > 0 lightens toward white, k < 0 darkens
  const a = hexRgb(c);
  return 'rgb(' + a.map(v => Math.round(k >= 0 ? v + (255 - v) * k : v * (1 + k))).join(',') + ')';
}
const rgba = (c, a) => { const v = hexRgb(c); return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')'; };

/* ================= world ================= */
const W = 720, H = 540, TW = 64, TH = 32, BH = 30, N = 9, C = 4, MAXLV = 5, SS = 3;
const LV_XP = [0, 0, 15, 50, 110, 200]; // xp needed to reach level n
const ring = (gx, gy) => Math.abs(gx - C) + Math.abs(gy - C);
const key = (gx, gy) => gx + ',' + gy;

const BIOMES = {
  sapling: { name: '어미나무', h: 1, base: '#4f8a45', light: '#8cc466' },
  empty: { name: '빈 땅', h: 1, base: '#6e5644', light: '#9c7e64' },
  plains: { name: '초원', h: 1, base: '#5a9447', light: '#93c96a', hint: '토끼·여우' },
  meadow: { name: '꽃밭', h: 1, base: '#5c9a4e', light: '#9ccf76', hint: '나비·꿀벌' },
  oak: { name: '참나무 숲', h: 1, tree: 'oak', base: '#3f7a40', light: '#72aa5a', hint: '다람쥐·딱따구리' },
  birch: { name: '자작나무 숲', h: 1, tree: 'birch', base: '#6a9e55', light: '#a6cf7e', hint: '박새' },
  cherry: { name: '벚나무 숲', h: 1, tree: 'cherry', base: '#6a9a5a', light: '#aacb8c', hint: '동박새' },
  taiga: { name: '침엽수림', h: 1, tree: 'spruce', base: '#2f5e4c', light: '#5f8f6e', hint: '노루' },
  river: { name: '강', h: .8, water: true, base: '#2a7aa2', light: '#6cc8dc', hint: '피라미·비버' },
  swamp: { name: '습지', h: .9, base: '#2f5a50', light: '#5c8670', hint: '개구리·반딧불이' },
  mountain: { name: '돌산', h: 1.9, rock: true, base: '#6d7286', light: '#aab0c2', hint: '산양·검독수리' },
};
const WILD = ['plains', 'meadow', 'oak', 'birch', 'cherry', 'taiga', 'river', 'swamp', 'mountain'];
// how many tiles of each biome every visitor needs together: random terrain leans toward what is still missing
const GOAL = { plains: 2, meadow: 2, oak: 2, birch: 1, cherry: 1, taiga: 2, river: 2, swamp: 2, mountain: 3 };

const STAGE_MIN = [0, 4, 12, 30];
const STAGE_NAME = ['새싹', '덤불', '어린나무', '큰나무'];
const stageOf = m => STAGE_MIN.reduce((s, v, i) => (m >= v ? i : s), 0);
// perch height (px above ground), canopy centre for crawling insects, trunk height for woodpeckers
const TREE_TOP = { oak: 56, birch: 60, cherry: 48, spruce: 58, m1: 15, m2: 36, m3: 82 };
const CANOPY = { oak: -42, birch: -48, cherry: -36, spruce: -36, m1: -8, m2: -27, m3: -60 };
const treeOf = b => b === 'sapling' ? (stageOf(state.total) ? 'm' + stageOf(state.total) : null) : (BIOMES[b] && BIOMES[b].tree) || null;

/* ================= visitors (real species) ================= */
const VISITORS = [
  { id: 'ladybug', name: '무당벌레', e: '🐞', need: '어미나무가 덤불로 자라면', cond: M => M.stage >= 1 },
  { id: 'sparrow', name: '참새', e: '🐦', need: '어미나무가 어린나무가 되면', cond: M => M.stage >= 2 },
  { id: 'butterfly', name: '배추흰나비', e: '🦋', need: '꽃밭 1칸', cond: M => M.n('meadow') >= 1 },
  { id: 'bee', name: '꿀벌', e: '🐝', need: '꽃밭 2칸', cond: M => M.n('meadow') >= 2 },
  { id: 'rabbit', name: '멧토끼', e: '🐇', need: '초원 2칸', cond: M => M.n('plains') >= 2 },
  { id: 'squirrel', name: '다람쥐', e: '🐿️', need: '참나무 숲 1칸', cond: M => M.n('oak') >= 1 },
  { id: 'tit', name: '박새', e: '🐦', need: '자작나무 숲 1칸', cond: M => M.n('birch') >= 1 },
  { id: 'woodpecker', name: '오색딱따구리', e: '🐦', need: '참나무·자작나무 숲 합쳐 3칸', cond: M => M.n('oak') + M.n('birch') >= 3 },
  { id: 'whiteeye', name: '동박새', e: '🐦', need: '벚나무 숲 1칸', cond: M => M.n('cherry') >= 1 },
  { id: 'fox', name: '여우', e: '🦊', need: '초원 2칸 + 숲 2칸', cond: M => M.n('plains') >= 2 && M.n('oak') + M.n('birch') + M.n('taiga') >= 2 },
  { id: 'roe', name: '노루', e: '🦌', need: '침엽수림 2칸', cond: M => M.n('taiga') >= 2 },
  { id: 'fish', name: '피라미', e: '🐟', need: '강 2칸', cond: M => M.n('river') >= 2 },
  { id: 'beaver', name: '비버', e: '🦫', need: '참나무·자작나무 숲 옆에 강', cond: M => !!M.riverByWood() },
  { id: 'frog', name: '참개구리', e: '🐸', need: '습지 1칸', cond: M => M.n('swamp') >= 1 },
  { id: 'firefly', name: '반딧불이', e: '✨', need: '습지 2칸', cond: M => M.n('swamp') >= 2 },
  { id: 'heron', name: '왜가리', e: '🪿', need: '습지 1칸 + 강 2칸', cond: M => M.n('swamp') >= 1 && M.n('river') >= 2 },
  { id: 'goral', name: '산양', e: '🐐', need: '돌산 2칸', cond: M => M.n('mountain') >= 2 },
  { id: 'eagle', name: '검독수리', e: '🦅', need: '돌산 3칸', cond: M => M.n('mountain') >= 3 },
];
// how each visitor moves, and where
const MOTION = {
  ladybug: { type: 'crawl' },
  sparrow: { type: 'bird', perch: ['sapling', 'oak', 'birch', 'cherry'], ground: ['sapling', 'plains', 'meadow'], col: { back: '#8a6a4a', belly: '#eadfce', head: '#7a4a2a', cheek: '#f4efe6' } },
  tit: { type: 'bird', perch: ['birch', 'oak'], ground: ['birch', 'oak', 'plains'], col: { back: '#6f8a6a', belly: '#f2ecd2', head: '#1e1e22', cheek: '#ffffff', stripe: '#1e1e22' } },
  whiteeye: { type: 'bird', perch: ['cherry'], ground: ['cherry', 'meadow'], col: { back: '#8fae34', belly: '#ebe5c4', head: '#a2c03c', cheek: '#c9d870', ring: 1 } },
  woodpecker: { type: 'cling', area: ['oak', 'birch'] },
  butterfly: { type: 'flutter', n: 2, area: ['meadow', 'plains'], speed: .45 },
  bee: { type: 'flutter', n: 2, area: ['meadow'], speed: .9 },
  rabbit: { type: 'hop', area: ['plains', 'meadow'], speed: 1.1, hopH: 9 },
  squirrel: { type: 'walk', area: ['oak', 'sapling', 'birch'], speed: 1.5, dash: 1 },
  fox: { type: 'walk', area: ['plains', 'meadow', 'oak', 'birch', 'taiga', 'sapling'], speed: .75 },
  roe: { type: 'walk', area: ['taiga', 'plains', 'meadow'], speed: .5 },
  goral: { type: 'walk', area: ['mountain'], speed: .35 },
  fish: { type: 'swim', n: 2, area: ['river'], speed: .6 },
  beaver: { type: 'swim', area: ['river'], speed: .35 },
  frog: { type: 'hop', area: ['swamp'], speed: .7, hopH: 7 },
  heron: { type: 'walk', area: ['swamp', 'river'], speed: .22 },
  eagle: { type: 'soar', area: ['mountain'] },
  firefly: { type: 'none' },
};

/* ================= state ================= */
const KEY = 'sup-island-v1';
const fresh = () => ({ lv: 1, xp: 0, total: 0, tiles: { [key(C, C)]: 'sapling' }, seen: {}, demo: true });
let state = fresh();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.tiles) state = Object.assign(fresh(), s); } catch (e) {}
const save = () => {
  state.t = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (!running) cloud.queue(); // only finished sessions reach the cloud
};

let running = false, startAt = 0, lastTick = 0, session = 0, tickId = null, snapshot = null;
let present = new Set(), appear = {}, tileAppear = {};

function model() {
  const by = {};
  for (const [k, b] of Object.entries(state.tiles)) if (ring(...k.split(',').map(Number)) <= state.lv - 1) (by[b] = by[b] || []).push(k);
  return {
    stage: stageOf(state.total),
    n: b => (by[b] || []).length,
    riverByWood() {
      for (const k of by.river || []) {
        const [x, y] = k.split(',').map(Number);
        if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => ['oak', 'birch'].includes(state.tiles[key(x + dx, y + dy)]))) return k;
      }
      return null;
    },
  };
}
function visitorsNow() { const M = model(); return VISITORS.filter(v => v.cond(M)); }

/* ================= automatic terrain ================= */
// Neighbouring tiles tend to match (forests and mountains come in patches), biomes some visitor still
// needs are favoured, and a river gets a wood beside it so the beaver can come.
function pickBiome(gx, gy) {
  const cnt = {}; for (const b of Object.values(state.tiles)) cnt[b] = (cnt[b] || 0) + 1;
  const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => state.tiles[key(gx + dx, gy + dy)]).filter(b => WILD.includes(b));
  const wood = b => b === 'oak' || b === 'birch';
  if (!model().riverByWood()) {

  running = true; startAt = lastTick = Date.now(); session = 0;
  notice(''); $('scene').classList.remove('drought');
  $('startBtn').textContent = '공부 마치기'; $('startBtn').classList.add('stop'); $('demo').disabled = true;
  tickId = setInterval(tick, 200); renderUI(); cloud.paint();
}
function stop(commit) {
  clearInterval(tickId);
  running = false;
  if (commit) {
    toast(Math.floor(session) + '분 공부 완료');
  }
  session = 0; save();
  $('startBtn').textContent = '공부 시작'; $('startBtn').classList.remove('stop'); $('demo').disabled = false;
  renderUI(); cloud.paint();
}
$('startBtn').onclick = () => (running ? stop(true) : start());
$('demo').onchange = e => { state.demo = e.target.checked; save(); };
$('resetBtn').onclick = () => {
  if (running) stop(false);
  state = fresh(); state.demo = $('demo').checked; present = new Set(); appear = {}; tileAppear = {}; agents = {}; lastStage = null;
  notice(''); $('scene').classList.remove('drought'); save(); fitCamera(); evaluate(true);
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) {
    const lost = Math.floor(session);
    stop(false);
    if (snapshot) { state = JSON.parse(snapshot); save(); }
    present = new Set(visitorsNow().map(v => v.id)); agents = {}; fitCamera(); renderUI();
    $('scene').classList.add('drought');
    notice('화면을 벗어나서 이번 세션 ' + lost + '분은 없던 일이 됐어요. 그동안 얻은 재화와 손님, 땅도 되돌아갔어요.');
  }
});

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width, sy = (e.clientY - r.top) * H / r.height;
  const wx = (sx - W / 2) / cam.z + cam.x, wy = (sy - H / 2) / cam.z + cam.y;
  let hit = null;
  for (const [gx, gy, b] of openTiles()) {
    const x = isoX(gx, gy), y = isoY(gx, gy, BIOMES[b].h);
    if (Math.abs(wx - x) / (TW / 2) + Math.abs(wy - y) / (TH / 2) <= 1 && (!hit || gx + gy > hit[0] + hit[1])) hit = [gx, gy, b];
  }
  if (hit) { const B = BIOMES[hit[2]]; toast(B.name + (B.hint ? ' · 찾아오는 손님: ' + B.hint : '')); }
});
window.addEventListener('resize', resize);

/* ================= Google login + cloud save (Firebase, shared with the Soul Knight-style game) ================= */
// Database path: forest/{uid} = { data: "state JSON", t: last save time }. Needs its own rule (see README).
const FIREBASE = {
  apiKey: 'AIzaSyD_bGIXNy_n0QEhYqaTUS6y97CPBc5tbdQ',
  authDomain: 'dongeon-shooter.firebaseapp.com',
  databaseURL: 'https://dongeon-shooter-default-rtdb.firebaseio.com',
};
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const ERR = {
  'auth/popup-blocked': '팝업이 막혔어요. 이 사이트의 팝업을 허용하고 다시 눌러 주세요',
  'auth/popup-closed-by-user': '로그인 창을 닫았어요',
  'auth/cancelled-popup-request': '로그인 창을 닫았어요',
  'auth/unauthorized-domain': '이 주소가 Firebase 승인된 도메인에 없어요',
  'auth/operation-not-allowed': 'Firebase에서 Google 로그인이 꺼져 있어요',
  'auth/network-request-failed': '인터넷 연결을 확인해 주세요',
};
const cloud = (() => {
  let sdk = null, user = null, timer = 0, dirty = false, ready = false;
  const setSt = (msg, err) => { $('accSt').textContent = msg; $('accSt').classList.toggle('err', !!err); };
  function paint() {
    $('accName').textContent = user ? (user.displayName || user.email || '구글 계정') : '게스트';
    $('gLogin').hidden = !!user; $('gLogout').hidden = !user;
    $('gLogin').disabled = !sdk || running;
    if (!user) setSt(sdk || !ready ? '이 브라우저에만 저장돼요' : '이 브라우저에만 저장돼요 · 구글 로그인을 쓸 수 없어요');
  }
  async function rest(method, body) {
    const tok = await user.getIdToken();
    const res = await fetch(`${FIREBASE.databaseURL}/forest/${user.uid}.json?auth=${encodeURIComponent(tok)}`,
      { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? '권한이 없어요 (데이터베이스 규칙에 forest를 추가해야 해요)' : (data && data.error) || 'HTTP ' + res.status);
    return data;
  }
  async function push() {
    clearTimeout(timer);
    if (!user || !dirty || running) return;
    dirty = false;
    try { await rest('PUT', { data: JSON.stringify(state), t: state.t || Date.now() }); setSt('클라우드에 저장됨'); }
    catch (e) { dirty = true; setSt('클라우드 저장 실패: ' + e.message, true); }
  }
  // newer save wins: cloud → this browser, or this browser → cloud
  async function sync() {
    if (!user || running) return;
    setSt('클라우드와 맞추는 중…');
    try {
      const r = await rest('GET');
      let cs = null; try { cs = r && r.data ? JSON.parse(r.data) : null; } catch (e) {}
      if (cs && cs.tiles && (Number(r.t) || 0) > (state.t || 0)) {
        state = Object.assign(fresh(), cs);
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
        reloadWorld();
        setSt('클라우드 기록을 불러왔어요');
        toast('클라우드에 있던 섬을 불러왔어요');
      } else { dirty = true; await push(); }
    } catch (e) { setSt('클라우드 연결 실패: ' + e.message, true); }
  }
  // load the SDK up front: the popup must open in the same tick as the click or it gets blocked
  Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js')]).then(([app, au]) => {
    const auth = au.getAuth(app.initializeApp(FIREBASE, 'forest'));
    au.setPersistence(auth, au.browserLocalPersistence).catch(() => {});
    sdk = { au, auth }; ready = true; paint();
    au.onAuthStateChanged(auth, u => { const was = user && user.uid; user = u; paint(); if (u && u.uid !== was) sync(); });
  }).catch(() => { ready = true; paint(); });
  $('gLogin').onclick = () => {
    if (!sdk || running) return;
    const provider = new sdk.au.GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
    sdk.au.signInWithPopup(sdk.auth, provider).catch(e => setSt(ERR[e && e.code] || (e && e.message) || String(e), true));
  };
  $('gLogout').onclick = async () => { await push(); sdk.au.signOut(sdk.auth); toast('로그아웃했어요. 섬은 이 브라우저에 남아 있어요'); };
  addEventListener('visibilitychange', () => { if (document.hidden) push(); });
  addEventListener('pagehide', push);
  paint();
  return {
    queue() { if (!user) return; dirty = true; clearTimeout(timer); timer = setTimeout(push, 2500); setSt('올리는 중…'); },
    paint,
  };
})();
function reloadWorld() {
  delete state.cur; fillTerrain();
  present = new Set(); appear = {}; tileAppear = {}; agents = {}; lastStage = stageOf(state.total);
  $('demo').checked = state.demo;
  present = new Set(visitorsNow().map(v => v.id));
  fitCamera(); renderUI();
}

delete state.cur; fillTerrain();
$('demo').checked = state.demo;
buildSprites();
lastStage = stageOf(state.total);
present = new Set(visitorsNow().map(v => v.id)); agents = {};
fitCamera(); cam = { ...camT };
resize(); renderUI();
requestAnimationFrame(frame);
})();
</script>
