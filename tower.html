<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원통 탑 시제품</title>
<style>
  :root { --bg: #0b0f0e; --fg: #cfe3c8; }
  html, body { margin: 0; height: 100%; user-select: none; -webkit-user-select: none; background: var(--bg); color: var(--fg); overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); }
  #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #help { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 12px; opacity: .7; pointer-events: none; white-space: nowrap; }
  #err { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c3" width="640" height="360"></canvas>
  <canvas id="hud" width="640" height="360"></canvas>
</div>
<div id="help">화면을 한 번 클릭한 뒤 조작 · A/D 이동 · Space 점프 · 왼쪽 클릭(또는 K): 덩굴 걸기 · 걸린 채 다시 클릭하면 풀며 날아가기 · 떠 있는 동안 또 클릭해서 다시 걸기 — 건 뒤 Space를 누르고 있는 동안 당기기 · 끝까지 당긴 뒤 Space로 놓으며 뛰기 · W 감기 · S 풀기 · S 웅크리기 · E 누른 채 상자 당기기 · W 지렛대·호출 · P 도트 배경</div>
<div id="err">이 브라우저에서는 3D(WebGL)를 쓸 수 없어 원통 탑 시제품을 열 수 없어요.</div>
<script type="module">
// 원통 탑 시제품 (plant-world-tower 브랜치)
// 노트(2026-11-18) 3~4쪽 「시점 구현 예상」: 탑 안쪽 둘레를 따라 걸으면 카메라 대신 원통이 돌아간다.
//  - 게임 논리는 원통을 펼친 2D 칸(가로 WC칸 = 둘레 한 바퀴, 세로 = 층)에서 돈다. 가로는 끝이 이어져 있음(감김)
//  - 3D: 펼친 x를 각도 θ = x / RP 로 바꿔 원통에 감는다. 카메라는 탑 가운데 빈 곳(중정)에서 바깥 벽을 바라봄
//  - 바깥쪽 벽에 문, 안쪽(중정 쪽)에 원형 난간 (노트 답변 5)
//  - 길이 이어진 층은 360° 회전. 벽으로 막히거나 바닥이 끊긴 층은 회전이 멈추고 캐릭터가 화면 끝으로 걸어감 (노트 4쪽, 답변 6)
import * as THREE from './lib/three.module.min.js';
import * as W3 from './world3d.js';   // 지하철(1구역)과 같은 도트 텍스처 (벽 타일·기둥·벤치·고사리·덩굴·빛줄기·열차)

const T = 16, VW = 320, VH = 180, RS = 2;
const WC = 96, BAND = 10, NB = 6, H = NB * BAND;     // 둘레 96칸, 층마다 10줄(마지막 줄이 바닥), 6층
const C = WC * T, RP = C / (2 * Math.PI);            // 둘레 1536px → 캐릭터가 걷는 반지름 ≈ 244
const RIN = RP - 18, ROUT = RP + 72;                 // 블록 앞면·난간(중정 쪽) / 바깥 벽. 걷는 면 뒤로 깊이를 둬서 기둥·벤치·열차가 입체로 보임
// 맨 아래 승강장(B6)은 진짜 역처럼 더 넓음: 걷는 승강장(RIN~PLAT_R) → 선로가 깔린 낮은 바닥(TRENCH만큼 아래) → 역 벽(ST_R)
const PLAT_R = RP + 34, ST_R = RP + 176, TRENCH = 24;
const CB = 40, DIST = RP + CB, CAM_LIFT = 0;                        // 카메라는 탑 중심에서 40만큼 뒤 → 걷는 면까지 거리. 높이는 수평(옆에서 똑바로 봄, Limbo·Iron Bramble처럼)
const mod = (a, n) => ((a % n) + n) % n;
const wd = a => mod(a + C / 2, C) - C / 2;           // 둘레를 감안한 가로 거리
const floorRow = b => b * BAND + BAND - 1;

// ---------- 지도 (펼친 원통) ----------
// '#' 막힘, '.' 빈칸, '!' 끊긴 바닥(낭떠러지: 지나갈 수 없고 카메라 회전이 멈춤), 'x' 가시 덩굴(닿으면 죽음, 막히지 않음)
const map = Array.from({ length: H }, () => Array(WC).fill('.'));
const put = (x, y, c = '#') => { if (y >= 0 && y < H) map[y][mod(x, WC)] = c; };
const fill = (x0, x1, y0, y1, c = '#') => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) put(x, y, c); };
for (let b = 0; b < NB; b++) fill(0, WC - 1, floorRow(b), floorRow(b));
const SHAFT = 88;                                     // 인력 엘리베이터 승강로 (88~89칸)
for (let b = 0; b < NB - 1; b++) fill(SHAFT, SHAFT + 1, floorRow(b), floorRow(b), '.');
// B1 지상 출입층: 0칸 벽으로 막힘(반대쪽으로 돌아가 퍼즐을 건너뛰지 못하게)
// 퍼즐 1 「덩굴 다리」(PUZZLES.md): 시작(6칸)과 내려가는 구멍(30~32칸) 사이에 9칸 넓이 구멍(10~18칸) — 걸어서도 뛰어서도 못 건넘.
// 위의 쇠 들보(14~16칸, 2줄)에 덩굴을 걸고 Space로 끌어올려 흔들어 건넘. 떨어지면 아래(B2 바닥)의 가시 덩굴에 찔려 죽음
fill(0, 0, 0, 8);
fill(10, 18, 9, 9, '.'); fill(14, 16, 2, 2);
fill(9, 19, 18, 18, 'x');
fill(30, 32, 9, 9, '.'); fill(50, 53, 6, 6); fill(66, 67, 8, 8);
// B2 환풍구 층: 20·60칸 벽으로 막힘 → 21~59 구간 (바깥쪽 61~19 구간은 엘리베이터로만)
fill(20, 20, 10, 18); fill(60, 60, 10, 18);
fill(50, 52, 19, 19, '.'); fill(36, 39, 16, 16); fill(26, 27, 18, 18);
// B3 정비 통로: 한 바퀴 이어짐. B2 구멍(50~52) 아래는 2칸 높이 벽(47·57칸)에 갇힌 구덩이 — 덩굴 뭉치가 지킴
fill(47, 47, 27, 28); fill(57, 57, 27, 28);
fill(70, 72, 29, 29, '.'); fill(14, 17, 25, 25);
// B4 무너진 층: 5~14칸 바닥이 끊김
fill(5, 14, 39, 39, '!'); fill(56, 58, 38, 38); put(57, 37);
put(26, 38); put(35, 38);                             // 덩굴 뭉치가 오가는 구역(27~34)의 낮은 턱 — 위에는 줄에 매달린 잔해(30~31칸)
// B5 개찰구: 한 바퀴 이어짐. 승강장(B6)으로는 엘리베이터로만
fill(20, 23, 46, 46); fill(70, 73, 46, 46); fill(60, 60, 47, 48);
// B6 지하철 1역 승강장: 바닥 (승강로도 막힘). 엘리베이터 아래 구역(82~94)을 2칸 벽이 둘러쌈 — 덩굴 뭉치가 지킴
fill(81, 81, 57, 58); fill(95, 95, 57, 58);

const FLOORS = [
  ['B1 · 지상 출입층', '건널 수 없는 구멍'],
  ['B2 · 환풍구 층', '벽으로 막혀 있다'],
  ['B3 · 정비 통로', '구덩이 속에 무언가 있다'],
  ['B4 · 무너진 층', '바닥이 끊겼다'],
  ['B5 · 개찰구', '엘리베이터만 아래로 간다'],
  ['지하철 1역 승강장', '피난 열차는 오지 않았다'],
];

const tileAt = (tx, ty) => (ty < 0 || ty >= H) ? '#' : map[ty][mod(tx, WC)];
const solidT = (tx, ty) => tileAt(tx, ty) === '#';
const solidP = (x, y) => solidT(Math.floor(x / T), Math.floor(y / T));
function hitBox(x, y, w, h) {
  for (let ty = Math.floor(y / T); ty <= Math.floor((y + h - 0.001) / T); ty++)
    for (let tx = Math.floor(x / T); tx <= Math.floor((x + w - 0.001) / T); tx++)
      if (solidT(tx, ty)) return true;
  return false;
}
// 카메라가 더 돌 수 없는 칸: 층 높이 전체를 막는 벽, 또는 끊긴 바닥
function isStop(col, b) {
  if (map[floorRow(b)][col] === '!') return true;
  for (let y = b * BAND; y < floorRow(b); y++) if (map[y][col] !== '#') return false;
  return true;
}
// 상자·잔해와 겹치는지 (둘레 감김 고려). 자기 자신은 뺌
function propHit(e) {
  for (const o of props) {
    if (o === e) continue;
    const dx = wd(o.x - e.x);
    if (dx < e.w && dx + o.w > 0 && o.y < e.y + e.h && o.y + o.h > e.y) return { o, ox: e.x + dx };
  }
  return null;
}
function move(e, dt) {
  let dx = e.vx * dt, dy = e.vy * dt;
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6) || 1;
  dx /= steps; dy /= steps;
  e.onGround = false;
  for (let s = 0; s < steps; s++) {
    e.x += dx;
    if (hitBox(e.x, e.y, e.w, e.h)) {
      if (dx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w - 0.01;
      else e.x = (Math.floor(e.x / T) + 1) * T + 0.01;
      e.vx = 0; dx = 0;
    }
    let ph = propHit(e);
    if (ph && dx) { e.x = dx > 0 ? ph.ox - e.w - 0.01 : ph.ox + ph.o.w + 0.01; e.hitProp = ph.o; e.vx = 0; dx = 0; }
    e.y += dy;
    if (hitBox(e.x, e.y, e.w, e.h)) {
      if (dy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h - 0.01; e.onGround = true; }
      else e.y = (Math.floor(e.y / T) + 1) * T + 0.01;
      e.vy = 0; dy = 0;
    }
    ph = propHit(e);
    if (ph && dy) {
      if (dy > 0) { e.y = ph.o.y - e.h - 0.01; e.onGround = true; } else e.y = ph.o.y + ph.o.h + 0.01;
      e.vy = 0; dy = 0;
    }
  }
  if (!e.onGround && e.vy >= 0 && hitBox(e.x, e.y + e.h + 0.5, e.w, 0.5)) e.onGround = true;
}

// ---------- 상호작용 ----------
const INTERACTS = [
  { col: 3, b: 0, kind: 'door', label: '지상 출입문', text: '밖은 포자가 짙다. 아래로, 지하철 1역까지 내려가자.' },
  { col: 74, b: 1, kind: 'door', label: '환풍구 정비실', text: '잠겨 있다. 안에서 기계 소리가 난다. (건물 안은 다음 단계에서 연결)' },
  { col: 60, b: 2, kind: 'door', label: '정비 창고', text: '문틈으로 덩굴이 꽉 차 있다.' },
  { col: 27, b: 3, kind: 'note', label: '벽 낙서', text: '「피난 열차는 오지 않는다」' },
  { col: 8, b: 4, kind: 'door', label: '역무실', text: '잠겨 있다. 유리창 너머로 꺼진 모니터가 보인다.' },
  { col: 44, b: 5, kind: 'train', label: '멈춘 열차', text: '열차는 칠 년째 멈춰 있다. 시제품은 여기까지.' },
  { col: 40, b: 3, kind: 'lever', label: '녹슨 지렛대', text: '줄이 풀리며 천장의 잔해가 떨어졌다.' },
];
// 엘리베이터는 B5~승강장만 다님 (위쪽 줄은 끊김). 위층 승강로는 그냥 깊은 구멍
for (const b of [NB - 2, NB - 1]) INTERACTS.push({ col: 86, b, kind: 'call', label: '엘리베이터 호출', text: '도르래 줄을 당겼다.' });

// ---------- 상태 ----------
const qs = new URLSearchParams(location.search);
const at = (qs.get('at') || '').split(',').map(Number);
const START = at.length === 2 && at.every(Number.isFinite) ? { x: at[0] * T, y: at[1] * T - 24 } : { x: 6 * T, y: floorRow(0) * T - 24 };
const P = { x: START.x, y: START.y, w: 9, h: 24, vx: 0, vy: 0, face: 1, inv: 0, coyote: 0, buffer: 0, act: null, onGround: false, onElev: false, walkT: 0, landT: 0, near: null, fallFrom: null, grab: null };
const STAND_H = 24, CROUCH_H = 18;                     // 잠수부 헬멧 주인공: 게임 키 26px (도트 52px)
function standUp() {                                   // 머리 위가 비었을 때만 일어섬
  if (!P.crouch) return true;
  if (hitBox(P.x, P.y - (STAND_H - P.h), P.w, STAND_H)) return false;
  P.y -= STAND_H - P.h; P.h = STAND_H; P.crouch = false; return true;
}
const ELEV_MIN = floorRow(NB - 2) * T, ELEV_MAX = floorRow(NB - 1) * T;
const elev = { x: SHAFT * T, w: 2 * T, y: ELEV_MIN, target: null, vy: 0 };
// 덩굴 뭉치: 무기로는 못 이김. 닿으면 즉사. 떨어지는 상자·잔해, 내려오는 엘리베이터에 깔리거나 높이 떨어지면 죽음
const enemies = [[52, 2], [30, 3], [90, 5]].map(([c, b]) =>
  ({ x: c * T, y: floorRow(b) * T - 12, w: 14, h: 12, vx: 0, vy: 0, dir: 1, hp: 1, flash: 0, stun: 0, t: c * 0.37, onGround: false, fallFrom: null }));
// 밀고 당기는 상자(B2), 줄에 매달린 잔해(B4, 지렛대로 떨어뜨림)
const props = [
  { kind: 'crate', x: 44 * T, y: floorRow(1) * T - T, w: T, h: T, vx: 0, vy: 0, held: false },
  { kind: 'debris', x: 30 * T, y: 30 * T, w: 2 * T, h: 2 * T, vx: 0, vy: 0, held: true },
];
// 기록 지점: 층에 처음 내려선 곳. 죽으면 그때의 상태(적·상자·엘리베이터)로 되돌림
let checkpoint = { x: START.x, y: START.y, band: 0, snap: null };
const snapshot = () => JSON.parse(JSON.stringify({ enemies, props: props.map(({ mesh, rope, ...o }) => o), elev }));
function restore(sn) {
  sn.enemies.forEach((e, i) => Object.assign(enemies[i], e));
  sn.props.forEach((o, i) => Object.assign(props[i], o));
  Object.assign(elev, sn.elev);
}
checkpoint.snap = snapshot();
let pixelMode = true;
let hook = null, vineFx = null;      // 덩굴 갈고리: 걸린 곳 {x, y, rest, ledge} · 빗나간 덩굴 효과
let state = 'play', timeNow = 0, camX = START.x, camY = START.y, dialog = null, banner = null, lastBand = -1, deathCause = '';

// ---------- 입력 ----------
const keys = {};
let jumpP = false, upP = false, enterP = false, hookP = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) {
    if (k === ' ') jumpP = true;
    if (k === 'w' || k === 'arrowup') upP = true;
    if (k === 'enter') enterP = true;
    if (k === 'k') hookP = true;                       // 덩굴 갈고리 (앞 위로)
    if (k === 'p') pixelMode = !pixelMode;           // 도트 배경 켜고 끄기 (비교용)
  }
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
// 마우스: 덩굴 갈고리 조준(HUD 640×360 좌표)과 누르기
const mouse = { x: 0, y: 0, down: false, pressed: false };
const wrapEl = document.getElementById('wrap');
const mousePos = e => { const r = wrapEl.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * 640; mouse.y = (e.clientY - r.top) / r.height * 360; };
wrapEl.addEventListener('mousemove', mousePos);
// 클릭하면 게임이 키보드 포커스를 받음 (아티팩트처럼 틀(iframe) 안에서 열릴 때 필요. 기본 동작을 막으면 포커스가 안 옴)
wrapEl.addEventListener('mousedown', e => {
  mousePos(e); const hadFocus = document.hasFocus(); window.focus();
  if (e.button === 0) { mouse.down = true; mouse.pressed = hadFocus; }   // 포커스를 받는 첫 클릭으로는 덩굴을 쏘지 않음
});
window.focus();
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
wrapEl.addEventListener('contextmenu', e => e.preventDefault());
const held = (...ks) => ks.some(k => keys[k]);

// ---------- 카메라 회전 범위 ----------
// 화면 반폭에 들어가는 걷는 면의 호 길이 (원통이라 가장자리는 조금 가까워 보임)
const HALF = (() => {
  const k = (VW / 2) / DIST; let lo = 0, hi = 1.4;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; (RP * Math.sin(m) / (RP * Math.cos(m) + CB) < k) ? lo = m : hi = m; }
  return lo * RP;
})();
const bandOf = y => Math.max(0, Math.min(NB - 1, Math.floor(y / (BAND * T))));
function camBounds() {
  const b = bandOf(P.y + P.h / 2), pc = Math.floor((P.x + P.w / 2) / T);
  if (isStop(mod(pc, WC), b)) return { b, ring: true };
  let L = null, R = null;
  for (let c = pc - 1; c > pc - WC; c--) if (isStop(mod(c, WC), b)) { L = (c + 1) * T; break; }
  for (let c = pc + 1; c < pc + WC; c++) if (isStop(mod(c, WC), b)) { R = c * T; break; }
  return L === null ? { b, ring: true } : { b, ring: false, L, R };
}

// ---------- 갱신 ----------
// Limbo처럼: 한 번에 죽고, 잠깐 어두워진 뒤 마지막 기록 지점에서 바로 다시 (CMD 한 줄만)
const DEATH = { blob: '덩굴 뭉치에게 먹힘', fall: '높은 곳에서 떨어짐', crush: '깔림', thorn: '가시 덩굴에 찔림' };
function die(cause) {
  if (state !== 'play' || P.inv > 0) return;
  state = 'dying'; deadT = 0; deathCause = cause; P.grab = null; hook = null;
}
let deadT = 0;
function respawn() {
  restore(checkpoint.snap);
  hook = null;
  Object.assign(P, { x: checkpoint.x, y: checkpoint.y, vx: 0, vy: 0, inv: 0.6, act: null, h: STAND_H, crouch: false, fallFrom: null, grab: null, onElev: false });
  camX = P.x; camY = P.y; state = 'play';
}
// 덩굴 쏘기: 마우스 쪽(키보드 K면 앞 위로). 벽·천장에 걸리면 매달림, 상자는 끌어당기고, 매달린 잔해는 줄을 끊음.

    if (!m.visible) return;

    placeOnRing(m, e.x + e.w / 2, e.y + e.h, RP); m.scale.x = e.dir; m.scale.y = e.hp > 0 ? 1 : 0.25 + 0.3 * e.squash;
  });
  // 엘리베이터
  placeOnRing(elevMesh, elev.x + elev.w / 2, elev.y, (RIN + ROUT) / 2);
  for (const r of elevMesh.userData.ropes) { const len = elev.y + T; r.scale.y = len; r.position.y = len / 2; }
  for (const [i, fm] of fans.entries()) fm.rotation.z = timeNow * (3 + i * 0.4);
  // 카메라: 탑 중심 조금 뒤에서 바깥을 봄
  const th = camX / RP;
  // 수평으로 옆에서 봄 (CAM_LIFT를 올리면 위에서 비스듬히 내려다봄)
  camera.position.set(-CB * Math.sin(th), -camY + CAM_LIFT, CB * Math.cos(th));
  camera.lookAt(Math.sin(th) * RP, -camY, -Math.cos(th) * RP);
  // 가까운 벽등에만 빛
  const look = new THREE.Vector3(...P3(RP, camX, camY));
  lamps.sort((a, b) => a.v.distanceToSquared(look) - b.v.distanceToSquared(look));
  for (const n of neons) {                               // 깜빡임: 대부분 켜져 있다가 가끔 끊김
    const f = Math.sin(timeNow * 7 + n.seed * 3) + Math.sin(timeNow * 23 + n.seed);
    n.on = f > -1.3; n.m.visible = n.on;
  }
  lampLights.forEach((L, i) => {
    const lp = lamps[i]; L.position.copy(lp.v);
    if (lp.neon) { L.color.set(lp.neon.col); L.intensity = lp.neon.on ? 260 : 0; } else { L.color.set('#ffc890'); L.intensity = 420; }
  });   // 역 형광등은 차가운 빛
  lantern.position.set(...P3(RP - 14, P.x + P.w / 2, P.y));
  renderPixel();
}

// ---------- HUD ----------
const hud = document.getElementById('hud'), hx = hud.getContext('2d');
function project(x, y, r = RP) { const v = new THREE.Vector3(...P3(r, x, y)).project(camera); return { x: (v.x + 1) / 2 * hud.width, y: (1 - v.y) / 2 * hud.height }; }
function bubble(text, x, y) {
  hx.font = '12px system-ui, sans-serif';
  const w = hx.measureText(text).width + 12;
  hx.fillStyle = 'rgba(10,16,14,.82)'; hx.fillRect(Math.round(x - w / 2), Math.round(y - 18), Math.round(w), 18);
  hx.fillStyle = '#e6efd8'; hx.textAlign = 'center'; hx.textBaseline = 'middle'; hx.fillText(text, x, y - 9);
}
function drawHud() {
  hx.clearRect(0, 0, hud.width, hud.height);
  // 원통 지도: 지금 층의 둘레, 화면에 보이는 호, 막힌 곳(빨강), 엘리베이터(노랑), 나(초록)
  const cx = 600, cy = 44, R = 26, ang = x => x / RP - Math.PI / 2;
  hx.lineWidth = 3; hx.strokeStyle = 'rgba(200,220,200,.25)'; hx.beginPath(); hx.arc(cx, cy, R, 0, 7); hx.stroke();
  hx.strokeStyle = 'rgba(200,230,190,.8)'; hx.beginPath(); hx.arc(cx, cy, R, ang(camX - HALF), ang(camX + HALF)); hx.stroke();
  const dot = (x, c, r = 3) => { hx.fillStyle = c; hx.beginPath(); hx.arc(cx + Math.cos(ang(x)) * R, cy + Math.sin(ang(x)) * R, r, 0, 7); hx.fill(); };
  dot(elev.x + elev.w / 2, '#e8c45a', 2.5);
  if (!camInfo.ring) { dot(camInfo.L, '#e05a4a', 2.5); dot(camInfo.R, '#e05a4a', 2.5); }
  dot(P.x + P.w / 2, '#9fe07a');
  hx.font = '11px system-ui, sans-serif'; hx.fillStyle = '#cfe3c8'; hx.textAlign = 'center'; hx.textBaseline = 'top';
  hx.fillText(`${camInfo.b < NB - 1 ? 'B' + (camInfo.b + 1) : '1역'} · ${camInfo.ring ? '360°' : '막힘'}`, cx, cy + R + 6);
  // 층 이름
  if (banner) {
    hx.globalAlpha = Math.min(1, banner.t * 2);
    hx.textAlign = 'center'; hx.textBaseline = 'top'; hx.fillStyle = '#e6efd8'; hx.font = 'bold 18px system-ui, sans-serif';
    hx.fillText(FLOORS[banner.b][0], 320, 40);
    hx.font = '12px system-ui, sans-serif'; hx.fillStyle = '#a9c0a0'; hx.fillText(FLOORS[banner.b][1], 320, 64);
    hx.globalAlpha = 1;
  }
  if (state === 'play') {                               // 덩굴 조준점
    hx.strokeStyle = hook ? 'rgba(160,230,130,.9)' : 'rgba(220,235,210,.6)'; hx.lineWidth = 1.5;
    hx.beginPath(); hx.arc(mouse.x, mouse.y, 5, 0, 7); hx.moveTo(mouse.x - 9, mouse.y); hx.lineTo(mouse.x - 6, mouse.y); hx.moveTo(mouse.x + 6, mouse.y); hx.lineTo(mouse.x + 9, mouse.y); hx.stroke();
  }
  if (state === 'play') {
    if (P.near) { const p = project(P.near.col * T + T, floorRow(P.near.b) * T - 34); bubble(`W  ${P.near.label}`, p.x, p.y); }
    else if (P.onElev) { const p = project(P.x + P.w / 2, P.y - 6); bubble('W/S  도르래 감기', p.x, p.y); }
    else if (P.grab) { const p = project(P.x + P.w / 2, P.y - 6); bubble('잡는 중 · 반대로 걸으면 당김', p.x, p.y); }
  }
  if (dialog) {
    hx.fillStyle = 'rgba(8,12,11,.85)'; hx.fillRect(60, 300, 520, 34);
    hx.fillStyle = '#e6efd8'; hx.font = '13px system-ui, sans-serif'; hx.textAlign = 'center'; hx.textBaseline = 'middle';
    hx.fillText(dialog.text, 320, 317);
  }
  if (state === 'dying') {                              // 어두워지며 CMD 한 줄 → 마지막 기록 지점에서 다시
    const k = Math.min(1, deadT / 0.9); hx.fillStyle = `rgba(2,6,4,${(k * 0.95).toFixed(3)})`; hx.fillRect(0, 0, hud.width, hud.height);
    if (deadT > 0.5) {
      hx.font = '13px ui-monospace, monospace'; hx.fillStyle = '#7fe07a'; hx.textAlign = 'left'; hx.textBaseline = 'top';
      const line = `BANGDOK-OS > MOSS-07 신호 끊김 · ${DEATH[deathCause] || ''} · 마지막 기록 지점으로`;
      hx.fillText(line.slice(0, Math.floor((deadT - 0.5) * 60)) + (Math.floor(deadT * 4) % 2 ? '_' : ''), 40, 170);
    }
  }
}

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else {
    deadT += dt; timeNow += dt;
    if (state === 'dying' && deadT >= 1.8) respawn();
  }
  render3D(); drawHud();
  jumpP = upP = enterP = hookP = false; mouse.pressed = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__tower = { P, elev, enemies, props, mouse, get vineFx() { return vineFx; }, project: (x, y) => project(x, y), get hook() { return hook; }, get timeNow() { return timeNow; }, get camX() { return camX; }, get state() { return state; }, get checkpoint() { return checkpoint; }, map };
</script>
</body>
