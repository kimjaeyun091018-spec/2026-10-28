<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원통 탑 시제품</title>
<style>
  :root { --bg: #0b0f0e; --fg: #cfe3c8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); }
  #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #help { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 12px; opacity: .7; pointer-events: none; white-space: nowrap; }
  #err { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c3" width="640" height="360"></canvas>
  <canvas id="hud" width="640" height="360"></canvas>
</div>
<div id="help">A/D 이동 · Space 점프 · S 웅크리기 · W 문·기록·호출 · J/클릭 칼 · 엘리베이터 위에서 W/S 도르래</div>
<div id="err">이 브라우저에서는 3D(WebGL)를 쓸 수 없어 원통 탑 시제품을 열 수 없어요.</div>
<script type="module">
// 원통 탑 시제품 (plant-world-tower 브랜치)
// 노트(2026-11-18) 3~4쪽 「시점 구현 예상」: 탑 안쪽 둘레를 따라 걸으면 카메라 대신 원통이 돌아간다.
//  - 게임 논리는 원통을 펼친 2D 칸(가로 WC칸 = 둘레 한 바퀴, 세로 = 층)에서 돈다. 가로는 끝이 이어져 있음(감김)
//  - 3D: 펼친 x를 각도 θ = x / RP 로 바꿔 원통에 감는다. 카메라는 탑 가운데 빈 곳(중정)에서 바깥 벽을 바라봄
//  - 바깥쪽 벽에 문, 안쪽(중정 쪽)에 원형 난간 (노트 답변 5)
//  - 길이 이어진 층은 360° 회전. 벽으로 막히거나 바닥이 끊긴 층은 회전이 멈추고 캐릭터가 화면 끝으로 걸어감 (노트 4쪽, 답변 6)
import * as THREE from './lib/three.module.min.js';
import * as W3 from './world3d.js';   // 지하철(1구역)과 같은 도트 텍스처 (벽 타일·기둥·벤치·고사리·덩굴·빛줄기·열차)

const T = 16, VW = 320, VH = 180, RS = 2;
const WC = 96, BAND = 10, NB = 6, H = NB * BAND;     // 둘레 96칸, 층마다 10줄(마지막 줄이 바닥), 6층
const C = WC * T, RP = C / (2 * Math.PI);            // 둘레 1536px → 캐릭터가 걷는 반지름 ≈ 244
const RIN = RP - 18, ROUT = RP + 72;                 // 블록 앞면·난간(중정 쪽) / 바깥 벽. 걷는 면 뒤로 깊이를 둬서 기둥·벤치·열차가 입체로 보임
// 맨 아래 승강장(B6)은 진짜 역처럼 더 넓음: 걷는 승강장(RIN~PLAT_R) → 선로가 깔린 낮은 바닥(TRENCH만큼 아래) → 역 벽(ST_R)
const PLAT_R = RP + 34, ST_R = RP + 176, TRENCH = 24;
const CB = 40, DIST = RP + CB, CAM_LIFT = 44;                       // 카메라는 탑 중심에서 40만큼 뒤 → 걷는 면까지 거리
const mod = (a, n) => ((a % n) + n) % n;
const wd = a => mod(a + C / 2, C) - C / 2;           // 둘레를 감안한 가로 거리
const floorRow = b => b * BAND + BAND - 1;

// ---------- 지도 (펼친 원통) ----------
// '#' 막힘, '.' 빈칸, '!' 끊긴 바닥(낭떠러지: 지나갈 수 없고 카메라 회전이 멈춤)
const map = Array.from({ length: H }, () => Array(WC).fill('.'));
const put = (x, y, c = '#') => { if (y >= 0 && y < H) map[y][mod(x, WC)] = c; };
const fill = (x0, x1, y0, y1, c = '#') => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) put(x, y, c); };
for (let b = 0; b < NB; b++) fill(0, WC - 1, floorRow(b), floorRow(b));
const SHAFT = 88;                                     // 인력 엘리베이터 승강로 (88~89칸)
for (let b = 0; b < NB - 1; b++) fill(SHAFT, SHAFT + 1, floorRow(b), floorRow(b), '.');
// B1 지상 출입층: 한 바퀴 이어짐
fill(30, 32, 9, 9, '.'); fill(14, 15, 8, 8); put(15, 7); fill(50, 53, 6, 6); fill(66, 67, 8, 8);
// B2 환풍구 층: 20·60칸 벽으로 막힘 → 21~59 구간 (바깥쪽 61~19 구간은 엘리베이터로만)
fill(20, 20, 10, 18); fill(60, 60, 10, 18);
fill(50, 52, 19, 19, '.'); fill(36, 39, 16, 16); fill(26, 27, 18, 18);
// B3 정비 통로: 한 바퀴 이어짐, 작은 언덕
fill(40, 41, 28, 28); fill(42, 43, 27, 28); fill(44, 45, 26, 28); fill(46, 47, 27, 28);
fill(70, 72, 29, 29, '.'); fill(14, 17, 25, 25);
// B4 무너진 층: 5~14칸 바닥이 끊김
fill(5, 14, 39, 39, '!'); fill(56, 58, 38, 38); put(57, 37); fill(30, 31, 30, 31);
// B5 개찰구: 한 바퀴 이어짐
fill(40, 42, 49, 49, '.'); fill(20, 23, 46, 46); fill(70, 73, 46, 46); fill(60, 60, 47, 48);
// B6 지하철 1역 승강장: 바닥 (승강로도 막힘)

const FLOORS = [
  ['B1 · 지상 출입층', '지하철 탑 — 제3구역 지하철 역'],
  ['B2 · 환풍구 층', '벽으로 막혀 있다'],
  ['B3 · 정비 통로', '한 바퀴 이어진 길'],
  ['B4 · 무너진 층', '바닥이 끊겼다'],
  ['B5 · 개찰구', ''],
  ['지하철 1역 승강장', '피난 열차는 오지 않았다'],
];

const tileAt = (tx, ty) => (ty < 0 || ty >= H) ? '#' : map[ty][mod(tx, WC)];
const solidT = (tx, ty) => tileAt(tx, ty) === '#';
const solidP = (x, y) => solidT(Math.floor(x / T), Math.floor(y / T));
function hitBox(x, y, w, h) {
  for (let ty = Math.floor(y / T); ty <= Math.floor((y + h - 0.001) / T); ty++)
    for (let tx = Math.floor(x / T); tx <= Math.floor((x + w - 0.001) / T); tx++)
      if (solidT(tx, ty)) return true;
  return false;
}
// 카메라가 더 돌 수 없는 칸: 층 높이 전체를 막는 벽, 또는 끊긴 바닥
function isStop(col, b) {
  if (map[floorRow(b)][col] === '!') return true;
  for (let y = b * BAND; y < floorRow(b); y++) if (map[y][col] !== '#') return false;
  return true;
}
function move(e, dt) {
  let dx = e.vx * dt, dy = e.vy * dt;
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6) || 1;
  dx /= steps; dy /= steps;
  e.onGround = false;
  for (let s = 0; s < steps; s++) {
    e.x += dx;
    if (hitBox(e.x, e.y, e.w, e.h)) {
      if (dx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w - 0.01;
      else e.x = (Math.floor(e.x / T) + 1) * T + 0.01;
      e.vx = 0; dx = 0;
    }
    e.y += dy;
    if (hitBox(e.x, e.y, e.w, e.h)) {
      if (dy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h - 0.01; e.onGround = true; }
      else e.y = (Math.floor(e.y / T) + 1) * T + 0.01;
      e.vy = 0; dy = 0;
    }
  }
  if (!e.onGround && e.vy >= 0 && hitBox(e.x, e.y + e.h + 0.5, e.w, 0.5)) e.onGround = true;
}

// ---------- 상호작용 ----------
const INTERACTS = [
  { col: 3, b: 0, kind: 'door', label: '지상 출입문', text: '밖은 포자가 짙다. 아래로, 지하철 1역까지 내려가자.' },
  { col: 74, b: 1, kind: 'door', label: '환풍구 정비실', text: '잠겨 있다. 안에서 기계 소리가 난다. (건물 안은 다음 단계에서 연결)' },
  { col: 60, b: 2, kind: 'door', label: '정비 창고', text: '문틈으로 덩굴이 꽉 차 있다.' },
  { col: 27, b: 3, kind: 'note', label: '벽 낙서', text: '「피난 열차는 오지 않는다」' },
  { col: 8, b: 4, kind: 'door', label: '역무실', text: '잠겨 있다. 유리창 너머로 꺼진 모니터가 보인다.' },
  { col: 44, b: 5, kind: 'train', label: '멈춘 열차', text: '열차는 칠 년째 멈춰 있다. 시제품은 여기까지 — 엘리베이터로 다시 올라갈 수 있다.' },
];
for (let b = 0; b < NB; b++) INTERACTS.push({ col: 86, b, kind: 'call', label: '엘리베이터 호출', text: '도르래 줄을 당겼다.' });

// ---------- 상태 ----------
const qs = new URLSearchParams(location.search);
const at = (qs.get('at') || '').split(',').map(Number);
const START = at.length === 2 && at.every(Number.isFinite) ? { x: at[0] * T, y: at[1] * T - 19 } : { x: 6 * T, y: floorRow(0) * T - 19 };
const P = { x: START.x, y: START.y, w: 8, h: 19, vx: 0, vy: 0, face: 1, hp: 100, inv: 0, coyote: 0, buffer: 0, slashCd: 0, act: null, onGround: false, onElev: false, walkT: 0, landT: 0, near: null };
const STAND_H = 19, CROUCH_H = 14;
function standUp() {                                   // 머리 위가 비었을 때만 일어섬
  if (!P.crouch) return true;
  if (hitBox(P.x, P.y - (STAND_H - P.h), P.w, STAND_H)) return false;
  P.y -= STAND_H - P.h; P.h = STAND_H; P.crouch = false; return true;
}
const elev = { x: SHAFT * T, w: 2 * T, y: floorRow(0) * T, target: null };
const ELEV_MIN = floorRow(0) * T, ELEV_MAX = floorRow(NB - 1) * T;
const enemies = [[25, 2], [55, 2], [40, 3], [24, 3], [10, 4], [62, 4], [30, 5], [75, 5]].map(([c, b]) =>
  ({ x: c * T, y: floorRow(b) * T - 12, w: 14, h: 12, vx: 0, vy: 0, dir: Math.random() < .5 ? 1 : -1, hp: 3, flash: 0, stun: 0, t: Math.random() * 2, onGround: false }));
let state = 'play', timeNow = 0, camX = START.x, camY = START.y, dialog = null, banner = null, lastBand = -1, slash = 0;

// ---------- 입력 ----------
const keys = {};
let jumpP = false, upP = false, atkP = false, enterP = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) {
    if (k === ' ') jumpP = true;
    if (k === 'w' || k === 'arrowup') upP = true;
    if (k === 'j' || k === 'k') atkP = true;
    if (k === 'enter') enterP = true;
  }
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.getElementById('wrap').addEventListener('mousedown', e => { if (e.button === 0) atkP = true; });
const held = (...ks) => ks.some(k => keys[k]);

// ---------- 카메라 회전 범위 ----------
// 화면 반폭에 들어가는 걷는 면의 호 길이 (원통이라 가장자리는 조금 가까워 보임)
const HALF = (() => {
  const k = (VW / 2) / DIST; let lo = 0, hi = 1.4;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; (RP * Math.sin(m) / (RP * Math.cos(m) + CB) < k) ? lo = m : hi = m; }
  return lo * RP;
})();
const bandOf = y => Math.max(0, Math.min(NB - 1, Math.floor(y / (BAND * T))));
function camBounds() {
  const b = bandOf(P.y + P.h / 2), pc = Math.floor((P.x + P.w / 2) / T);
  if (isStop(mod(pc, WC), b)) return { b, ring: true };
  let L = null, R = null;
  for (let c = pc - 1; c > pc - WC; c--) if (isStop(mod(c, WC), b)) { L = (c + 1) * T; break; }
  for (let c = pc + 1; c < pc + WC; c++) if (isStop(mod(c, WC), b)) { R = c * T; break; }
  return L === null ? { b, ring: true } : { b, ring: false, L, R };
}

// ---------- 갱신 ----------
function hurt(fromX, dmg) {
  if (P.inv > 0 || state !== 'play') return;
  P.hp -= dmg; P.inv = 0.9;
  P.vx = (wd(P.x - fromX) >= 0 ? 1 : -1) * 150; P.vy = -150;
  if (P.hp <= 0) { P.hp = 0; state = 'dying'; deadT = 0; }   // 1.4초 쓰러진 모습 → CMD 화면
}
let deadT = 0;
function respawn() {
  Object.assign(P, { x: START.x, y: START.y, vx: 0, vy: 0, hp: 100, inv: 1, act: null, h: STAND_H, crouch: false });
  camX = P.x; camY = P.y; state = 'play'; lastBand = -1;
}
function interact(o) {
  if (o.kind === 'call') { elev.target = floorRow(o.b) * T; dialog = { text: o.text, t: 2 }; return; }
  dialog = { text: `${o.label} — ${o.text}`, t: 4 };
}

function update(dt) {
  timeNow += dt;
  const pcx = P.x + P.w / 2;

  // 인력 엘리베이터: 올라탄 채 W/S로 도르래를 감음. 놓으면 가까운 층에 맞춰 섬. 층마다 호출 줄
  const ey0 = elev.y;
  if (P.onElev && held('w', 'arrowup')) { elev.y -= 75 * dt; elev.target = null; }
  else if (P.onElev && held('s', 'arrowdown')) { elev.y += 75 * dt; elev.target = null; }
  else {
    if (elev.target === null) {
      let best = ELEV_MIN;
      for (let b = 0; b < NB; b++) { const f = floorRow(b) * T; if (Math.abs(f - elev.y) < Math.abs(best - elev.y)) best = f; }
      elev.target = best;
    }
    const d = elev.target - elev.y, sp = (P.onElev ? 70 : 140) * dt;
    elev.y += Math.abs(d) <= sp ? d : Math.sign(d) * sp;
  }
  elev.y = Math.max(ELEV_MIN, Math.min(ELEV_MAX, elev.y));
  if (P.onElev && Math.abs(elev.y - ey0) > 0.001) {      // 움직이는 동안만 발판 위에 붙잡아 둠 (층에 서 있으면 걸어 나갈 수 있음)
    P.y += elev.y - ey0;
    P.x = Math.min(Math.max(P.x, elev.x + 1 + Math.round((pcx - elev.x) / C) * C), elev.x + elev.w - P.w - 1 + Math.round((pcx - elev.x) / C) * C);
  }

  // 상호작용 (W/↑). 근처에 아무것도 없으면 W는 점프. 엘리베이터 위에서는 W/S가 도르래
  const b = bandOf(P.y + P.h / 2);
  P.near = P.onGround ? INTERACTS.find(o => o.b === b && Math.abs(wd(pcx - (o.col * T + T))) < 14 &&
    !(o.kind === 'call' && Math.abs(elev.y - floorRow(o.b) * T) < 1)) || null : null;
  if (upP) { if (P.near) interact(P.near); else if (!P.onElev) jumpP = true; }
  if (dialog && (dialog.t -= dt) <= 0) dialog = null;

  const dir = (held('d', 'arrowright') ? 1 : 0) - (held('a', 'arrowleft') ? 1 : 0);
  if (dir) P.face = dir;
  if (P.act) { P.face = P.act.face; if ((P.act.t += dt) >= P.act.dur) P.act = null; }
  // 웅크리기 (S·↓, 땅에서. 엘리베이터 위에서는 S가 도르래): 작고 느리게, 조용히 → 덩굴 뭉치가 늦게 알아챔
  const wantCrouch = P.onGround && !P.onElev && held('s', 'arrowdown');
  if (wantCrouch && !P.crouch) { P.y += P.h - CROUCH_H; P.h = CROUCH_H; P.crouch = true; }
  else if (!wantCrouch && P.crouch) standUp();
  const accel = P.onGround ? 900 : 520, cap = P.crouch ? 40 : 92;
  if (dir) {
    const nv = P.vx + dir * accel * dt;
    if (Math.abs(nv) <= cap || Math.sign(nv) !== dir) P.vx = nv;
    else if (Math.abs(P.vx) < cap || Math.sign(P.vx) !== dir) P.vx = dir * cap;
  } else if (P.onGround) P.vx -= Math.sign(P.vx) * Math.min(Math.abs(P.vx), 900 * dt);
  if (Math.abs(P.vx) > cap) P.vx -= Math.sign(P.vx) * Math.min(Math.abs(P.vx) - cap, (P.onGround ? 900 : 160) * dt);

  P.coyote = P.onGround ? 0.1 : P.coyote - dt;
  P.buffer = jumpP ? 0.12 : P.buffer - dt;
  if (P.buffer > 0 && P.coyote > 0 && standUp()) { P.vy = -285; P.buffer = 0; P.coyote = 0; P.onElev = false; }
  const jumpHeld = held(' ') || (!P.onElev && held('w', 'arrowup'));
  if (!jumpHeld && P.vy < -100) P.vy += 1400 * dt;
  P.vy = Math.min(P.vy + 900 * dt, 400);

  const wasGround = P.onGround, prevBottom = P.y + P.h;
  move(P, dt);
  // 엘리베이터 발판 (위에서만 밟힘)
  P.onElev = false;
  const ecx = elev.x + elev.w / 2;
  if (P.vy >= 0 && Math.abs(wd(P.x + P.w / 2 - ecx)) < elev.w / 2 + P.w / 2 - 2 && prevBottom <= elev.y + 2 && P.y + P.h >= elev.y - 0.5) {
    P.y = elev.y - P.h; P.vy = 0; P.onGround = true; P.onElev = true;
  }
  if (P.onGround && !wasGround) P.landT = 0.08;
  P.landT -= dt;
  P.walkT = P.onGround && Math.abs(P.vx) > 10 ? P.walkT + dt : 0;
  if (P.y > H * T + 200) { P.y = START.y; P.x = START.x; }

  // 칼 (J·K·왼쪽 클릭)
  P.slashCd -= dt; slash -= dt;
  if (atkP && P.slashCd <= 0) {
    P.slashCd = 0.28; P.act = { name: 'whip', t: 0, dur: 0.22, face: P.face }; slash = 0.12;
    const px = P.x + P.w / 2, py = P.y + P.h / 2;
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      const dx = wd(e.x + e.w / 2 - px) * P.face, dy = e.y + e.h / 2 - py;
      if (dx > -4 && dx < 24 && Math.abs(dy) < 16) { e.hp--; e.flash = 0.15; e.stun = 0.35; e.vx = P.face * 130; e.vy = -110; }
    }
  }

  // 덩굴 뭉치: 걸어 다니다 벽·낭떠러지에서 돎, 닿으면 피해
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    e.t += dt; e.flash -= dt; e.stun -= dt;
    const ndx = wd(P.x + P.w / 2 - (e.x + e.w / 2)), ndy = P.y + P.h - (e.y + e.h);
    const chase = e.stun <= 0 && Math.abs(ndx) < (P.crouch ? 28 : 72) && Math.abs(ndy) < 20;
    if (chase) e.dir = Math.sign(ndx) || e.dir;
    if (e.stun <= 0) {
      const ahead = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
      if (e.onGround && (!solidP(ahead, e.y + e.h + 2) || solidP(ahead, e.y + e.h / 2))) e.dir *= -1;
      e.vx = e.dir * (chase ? 50 : 28);
    } else e.vx *= 1 - 4 * dt;
    e.vy = Math.min(e.vy + 900 * dt, 400);

  // 승강장 끝 기둥 줄 (천장까지) + 역 이름판(천장에 매달림) + 형광등
  const pillarMat = lam({ map: W3.pillarTex() });
  const boardTex = canvasTex(96, 24, g => {
    px(g, 0, 0, 96, 24, '#1d2a24'); px(g, 1, 1, 94, 22, '#2f7d45'); px(g, 3, 3, 90, 18, '#24402f');
    g.font = 'bold 12px sans-serif'; g.fillStyle = '#eef3e6'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('지하철 1역', 48, 13);
  });
  const tubeMat = new THREE.MeshBasicMaterial({ color: '#e6f2dc' }), wire = lam({ color: '#2a2a2a' });
  for (let k = 0; k < WC / 8; k++) {
    const col = k * 8 + 2, x = col * T + T / 2;
    if (col >= SHAFT - 2 && col <= SHAFT + 3) continue;
    const pl = new THREE.Mesh(new THREE.BoxGeometry(16, FL - CE, 16), pillarMat); placeOnRing(pl, x, (FL + CE) / 2, PLAT_R - 16); scene.add(pl);
    const tx = x + 4 * T;                                     // 기둥 사이 형광등 (천장에서 줄로 매달림)
    const tube = new THREE.Mesh(new THREE.BoxGeometry(34, 2.5, 5), tubeMat); placeOnRing(tube, tx, CE + 20, RP + 18); scene.add(tube);
    for (const d of [-14, 14]) { const w = new THREE.Mesh(new THREE.BoxGeometry(0.6, 18, 0.6), wire); placeOnRing(w, tx + d, CE + 10, RP + 18); scene.add(w); }
    stationLights.push(new THREE.Vector3(...P3(RP + 10, tx, CE + 34)));
    if (k % 2 === 0) {                                        // 역 이름판 (양면)
      const bd = new THREE.Mesh(new THREE.PlaneGeometry(48, 12), lam({ map: boardTex, side: THREE.DoubleSide })); placeOnRing(bd, x + 2 * T, CE + 26, PLAT_R - 4); scene.add(bd);
      for (const d of [-18, 18]) { const w = new THREE.Mesh(new THREE.BoxGeometry(0.6, 20, 0.6), wire); placeOnRing(w, x + 2 * T + d, CE + 10, PLAT_R - 4); scene.add(w); }
    }
  }
  // 역 벽의 광고판 (빛바랜 피난 안내)
  const posterTex = canvasTex(64, 40, g => {
    px(g, 0, 0, 64, 40, '#1d201d'); px(g, 2, 2, 60, 36, '#b8b09a'); px(g, 2, 2, 60, 10, '#8a3a30');
    g.font = 'bold 8px sans-serif'; g.fillStyle = '#f0e6d0'; g.fillText('피난 안내', 6, 10);
    g.fillStyle = '#4a4438'; g.fillText('열차 운행 중단', 6, 22); g.fillText('방독면 착용', 6, 32);
    noise(g, 64, 40, ['#4f6b34', '#8a8070', '#3f5a2c'], 120, 9);
  });
  for (let k = 0; k < 10; k++) {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(48, 30), lam({ map: posterTex })); placeOnRing(p, (k * 9.6 + 5) * T, TR - 52, ST_R - 1); scene.add(p);
  }
}
// 인력 엘리베이터: 발판 + 줄
const elevMesh = new THREE.Group();
{
  const wood = new THREE.MeshLambertMaterial({ color: '#7a5a3a' }), rope = new THREE.MeshLambertMaterial({ color: '#c8b088' });
  const plat = new THREE.Mesh(new THREE.BoxGeometry(elev.w, 5, ROUT - RIN - 4), wood); plat.position.y = -2.5; elevMesh.add(plat);
  const crank = new THREE.Mesh(new THREE.BoxGeometry(3, 14, 3), wood); crank.position.set(elev.w / 2 - 4, 7, -(ROUT - RIN) / 2 + 6); elevMesh.add(crank);
  elevMesh.userData.ropes = [-10, 10].map(dx => { const r = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), rope); r.position.x = dx; elevMesh.add(r); return r; });
  scene.add(elevMesh);
}

// 조명: 벽등 여러 개 중 카메라 앞 가까운 것만 실제 빛을 켬 (빛 개수 고정)
const lamps = [];
{
  const bulbMat = new THREE.MeshBasicMaterial({ color: '#ffd9a0' });
  // 층마다 기둥(8칸 간격). 앞면에 층 번호판과 등. 문·승강로·벽·끊긴 바닥·열차 앞에는 세우지 않음
  const pillarMat = new THREE.MeshLambertMaterial({ map: W3.pillarTex() });
  const benchMat = new THREE.MeshLambertMaterial({ map: W3.benchTex() });
  const PR = RP + 44;
  const blocked = (b, col) => INTERACTS.some(o => o.b === b && o.kind !== 'call' && Math.abs(col - o.col) <= 2) || (col >= SHAFT - 2 && col <= SHAFT + 3) ||
    (b === NB - 1 && col >= 26 && col <= 70);
  const floorOk = (b, col) => map[floorRow(b)][mod(col, WC)] === '#' && map[floorRow(b) - 1][mod(col, WC)] !== '#' && !isStop(mod(col, WC), b);
  for (let b = 0; b < NB; b++) {
    const top = b * BAND * T, fl = floorRow(b) * T, h = fl - top;
    for (let k = 0; k < WC / 8 && b < NB - 1; k++) {        // 승강장(B6)은 역 기둥을 따로 세움
      const col = k * 8 + 4;
      if (!floorOk(b, col) || blocked(b, col)) continue;
      const x = col * T + T / 2;
      const p = new THREE.Mesh(new THREE.BoxGeometry(18, h, 18), pillarMat); placeOnRing(p, x, top + h / 2, PR); scene.add(p);
      const bulb = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 3), bulbMat); placeOnRing(bulb, x + 6, top + 30, PR - 10); scene.add(bulb);
      lamps.push({ x, y: top + 30, v: new THREE.Vector3(...P3(PR - 22, x + 6, top + 34)) });
      // 벤치 (기둥 사이)
      const bx = col + 4;
      if ((k + b) % 2 === 0 && floorOk(b, bx) && floorOk(b, bx + 1) && !blocked(b, bx)) {
        const seat = new THREE.Mesh(new THREE.BoxGeometry(30, 8, 10), benchMat); placeOnRing(seat, bx * T + T, fl - 8, RP + 26); scene.add(seat);
        const back = new THREE.Mesh(new THREE.BoxGeometry(30, 14, 2), benchMat); placeOnRing(back, bx * T + T, fl - 17, RP + 31); scene.add(back);
      }
    }
    // 벽을 두르는 배관 (층마다 한 바퀴)
    const pipe = new THREE.Mesh(new THREE.TorusGeometry((b === NB - 1 ? ST_R : ROUT) - 5, 3, 6, WC), new THREE.MeshLambertMaterial({ color: '#5c6563' }));
    pipe.rotation.x = Math.PI / 2; pipe.position.y = -(top + 12); scene.add(pipe);
  }
  // 고사리 (바닥 위 여러 깊이, 가로세로 두 장) · 천장에서 늘어진 덩굴
  const fernMats = [3, 4, 5].map(sd => new THREE.MeshLambertMaterial({ map: W3.fernTex(sd), transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }));
  const vineMats = [1, 2, 3].map(sd => new THREE.MeshLambertMaterial({ map: W3.vineTex(sd), transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }));
  for (let b = 0; b < NB; b++) {
    for (let i = 0; i < 26; i++) {
      const col = Math.floor(hash(i, 60 + b) * WC);
      if (!floorOk(b, col)) continue;
      const x = col * T + hash(i, 61 + b) * T, r = RP + 6 + hash(i, 62 + b) * ((b === NB - 1 ? PLAT_R - 10 : ROUT) - RP - 12), sz = 14 + hash(i, 63 + b) * 16;
      for (const rot of [0, Math.PI / 2]) {
        const f = new THREE.Mesh(new THREE.PlaneGeometry(sz, sz), fernMats[i % 3]);
        placeOnRing(f, x, floorRow(b) * T - sz / 2 + 1, r); f.rotation.y += rot + hash(i, 64); scene.add(f);
      }
    }
    for (let i = 0; i < 14; i++) {
      const col = Math.floor(hash(i, 70 + b) * WC), x = col * T + 8, r = RP + 8 + hash(i, 71 + b) * (ROUT - RP - 14);
      if (b > 0 && map[b * BAND - 1][col] !== '#') continue;      // 위층 바닥이 있는 곳에서만 늘어짐
      const v = new THREE.Mesh(new THREE.PlaneGeometry(16, 64), vineMats[i % 3]);
      placeOnRing(v, x, b * BAND * T + 30, r); scene.add(v);
    }
  }
}
// B1(지상 출입층): 바깥 벽의 아치 창 너머로 바깥 정글이 보이고, 빛줄기가 비스듬히 들어옴
{
  const bgImg = await loadImg('assets/ch1-bg-2x.png').catch(() => null);
  const archMat = new THREE.MeshLambertMaterial({ map: W3.archWindowTex(), transparent: true, alphaTest: 0.5 });
  const shaftMat = new THREE.MeshBasicMaterial({ map: W3.shaftTex(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, side: THREE.DoubleSide, opacity: 0.45 });
  const AW = 48, AH = 72, yb = floorRow(0) * T - 26;
  [14, 26, 40, 54, 66, 78].forEach((col, i) => {
    const x = col * T + T / 2;
    if (bgImg) {                                        // 창 안쪽만 보이게 창틀 바로 뒤에 바깥 그림 조각
      const t = new THREE.Texture(bgImg); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
      t.repeat.set(0.16, 0.5); t.offset.set((i * 0.14) % 0.84, 0.3);
      const far = new THREE.Mesh(new THREE.PlaneGeometry(AW - 4, AH - 4), new THREE.MeshBasicMaterial({ map: t, color: '#c4d2bc', fog: false }));
      placeOnRing(far, x, yb - 2, ROUT - 0.5); scene.add(far);
    }
    const fr = new THREE.Mesh(new THREE.PlaneGeometry(AW, AH), archMat); placeOnRing(fr, x, yb, ROUT - 1.2); scene.add(fr);
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(18, 150), shaftMat);
    placeOnRing(sh, x - 22, yb - AH / 2 + 40, ROUT - 34); sh.rotation.z = 0.5; scene.add(sh);
  });
}
for (const v of stationLights) lamps.push({ v, cold: true });
const lampLights = Array.from({ length: 5 }, () => { const L = new THREE.PointLight('#ffb070', 900, 230, 1.4); scene.add(L); return L; });
const lantern = new THREE.PointLight('#bfe0a8', 260, 110, 1.4); scene.add(lantern);
scene.add(new THREE.HemisphereLight('#9fc4bc', '#2a2a22', 1.1));

// 도트 스프라이트: 걷는 면(RP)에 원통 접선 방향으로 세운 판. 좌우 반전은 scale.x
function makeSprite(img, fw, fh, ax, ay) {
  const t = new THREE.Texture(img);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true;
  t.repeat.set(fw / img.width, fh / img.height);
  const g = new THREE.PlaneGeometry(fw / RS, fh / RS); g.translate(-(ax - fw / 2) / RS, -(fh / 2 - ay) / RS, 0);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: t, alphaTest: 0.5, side: THREE.DoubleSide }));
  m.userData = { t, fw, fh, img }; scene.add(m); return m;
}
function setFrame(m, col, row) { const { t, fw, fh, img } = m.userData; t.offset.set(col * fw / img.width, 1 - (row + 1) * fh / img.height); }
const HERO = { fw: 80, fh: 60, ax: 32, ay: 57, rows: { idle: [0, 4], walk: [1, 8], jump: [2, 6], whip: [4, 4], crouch: [5, 4], cwalk: [6, 8] } };
const heroMesh = makeSprite(heroImg, HERO.fw, HERO.fh, HERO.ax, HERO.ay);
const blobMeshes = enemies.map(() => makeSprite(blobImg, 48, 40, 24, 38));
const slashMesh = new THREE.Mesh(new THREE.PlaneGeometry(22, 14), new THREE.MeshBasicMaterial({ map: canvasTex(44, 28, g => {
  g.strokeStyle = '#f2f6e6'; g.lineWidth = 3; g.beginPath(); g.arc(4, 26, 30, -1.25, -0.05); g.stroke();
}), transparent: true, alphaTest: 0.3, side: THREE.DoubleSide }));
scene.add(slashMesh);

function heroFrame() {
  if (P.act) { const n = HERO.rows.whip[1]; return ['whip', Math.min(n - 1, Math.floor(P.act.t / P.act.dur * n))]; }
  if (state === 'dying') return ['jump', 5];
  if (P.crouch) return Math.abs(P.vx) > 8 ? ['cwalk', Math.floor(P.walkT / 0.12) % 8] : ['crouch', Math.floor(timeNow / 0.35) % 4];
  if (!P.onGround) return ['jump', P.vy < -150 ? 1 : P.vy < -30 ? 2 : P.vy < 60 ? 3 : 4];
  if (P.landT > 0) return ['jump', 5];
  if (Math.abs(P.vx) > 10) return ['walk', Math.floor(P.walkT / 0.095) % 8];
  return ['idle', Math.floor(timeNow / 0.28) % 4];
}

function render3D() {
  // 주인공
  const [name, f] = heroFrame();
  setFrame(heroMesh, f, HERO.rows[name][0]);
  placeOnRing(heroMesh, P.x + P.w / 2, P.y + P.h, RP); heroMesh.scale.x = P.face;
  heroMesh.visible = state === 'play' ? !(P.inv > 0 && Math.floor(P.inv * 20) % 2 === 0) : state === 'dying' && deadT < 0.6 && Math.floor(deadT * 16) % 2 === 0;
  slashMesh.visible = slash > 0;
  if (slash > 0) { placeOnRing(slashMesh, P.x + P.w / 2 + P.face * 12, P.y + P.h / 2 - 2, RP - 2); slashMesh.scale.x = P.face; }
  // 적
  enemies.forEach((e, i) => {
    const m = blobMeshes[i];
    m.visible = e.hp > 0 && !(e.flash > 0 && Math.floor(e.flash * 30) % 2 === 0);
    if (!m.visible) return;
    setFrame(m, e.stun > 0 ? 0 : Math.floor(e.t / 0.15) % 4, e.stun > 0 ? 2 : 0);
    placeOnRing(m, e.x + e.w / 2, e.y + e.h, RP); m.scale.x = e.dir;
  });
  // 엘리베이터
  placeOnRing(elevMesh, elev.x + elev.w / 2, elev.y, (RIN + ROUT) / 2);
  for (const r of elevMesh.userData.ropes) { const len = elev.y + T; r.scale.y = len; r.position.y = len / 2; }
  for (const [i, fm] of fans.entries()) fm.rotation.z = timeNow * (3 + i * 0.4);
  // 카메라: 탑 중심 조금 뒤에서 바깥을 봄
  const th = camX / RP;
  // 조금 위에서 비스듬히 내려다봄 → 바닥 윗면·열차 지붕·선로가 보여 입체감이 남 (HD-2D)
  camera.position.set(-CB * Math.sin(th), -camY + CAM_LIFT, CB * Math.cos(th));
  camera.lookAt(Math.sin(th) * RP, -camY, -Math.cos(th) * RP);
  // 가까운 벽등에만 빛
  const look = new THREE.Vector3(...P3(RP, camX, camY));
  lamps.sort((a, b) => a.v.distanceToSquared(look) - b.v.distanceToSquared(look));
  lampLights.forEach((L, i) => { L.position.copy(lamps[i].v); L.color.set(lamps[i].cold ? '#d8ecd8' : '#ffb070'); });   // 역 형광등은 차가운 빛
  lantern.position.set(...P3(RP - 14, P.x + P.w / 2, P.y));
  renderer.render(scene, camera);
}

// ---------- HUD ----------
const hud = document.getElementById('hud'), hx = hud.getContext('2d');
function project(x, y, r = RP) { const v = new THREE.Vector3(...P3(r, x, y)).project(camera); return { x: (v.x + 1) / 2 * hud.width, y: (1 - v.y) / 2 * hud.height }; }
function bubble(text, x, y) {
  hx.font = '12px system-ui, sans-serif';
  const w = hx.measureText(text).width + 12;
  hx.fillStyle = 'rgba(10,16,14,.82)'; hx.fillRect(Math.round(x - w / 2), Math.round(y - 18), Math.round(w), 18);
  hx.fillStyle = '#e6efd8'; hx.textAlign = 'center'; hx.textBaseline = 'middle'; hx.fillText(text, x, y - 9);
}
function drawHud() {
  hx.clearRect(0, 0, hud.width, hud.height);
  // 체력
  hx.fillStyle = 'rgba(0,0,0,.5)'; hx.fillRect(12, 12, 124, 12);
  hx.fillStyle = '#7fbf5a'; hx.fillRect(14, 14, 120 * P.hp / 100, 8);
  // 원통 지도: 지금 층의 둘레, 화면에 보이는 호, 막힌 곳(빨강), 엘리베이터(노랑), 나(초록)
  const cx = 600, cy = 44, R = 26, ang = x => x / RP - Math.PI / 2;
  hx.lineWidth = 3; hx.strokeStyle = 'rgba(200,220,200,.25)'; hx.beginPath(); hx.arc(cx, cy, R, 0, 7); hx.stroke();
  hx.strokeStyle = 'rgba(200,230,190,.8)'; hx.beginPath(); hx.arc(cx, cy, R, ang(camX - HALF), ang(camX + HALF)); hx.stroke();
  const dot = (x, c, r = 3) => { hx.fillStyle = c; hx.beginPath(); hx.arc(cx + Math.cos(ang(x)) * R, cy + Math.sin(ang(x)) * R, r, 0, 7); hx.fill(); };
  dot(elev.x + elev.w / 2, '#e8c45a', 2.5);
  if (!camInfo.ring) { dot(camInfo.L, '#e05a4a', 2.5); dot(camInfo.R, '#e05a4a', 2.5); }
  dot(P.x + P.w / 2, '#9fe07a');
  hx.font = '11px system-ui, sans-serif'; hx.fillStyle = '#cfe3c8'; hx.textAlign = 'center'; hx.textBaseline = 'top';
  hx.fillText(`${camInfo.b < NB - 1 ? 'B' + (camInfo.b + 1) : '1역'} · ${camInfo.ring ? '360°' : '막힘'}`, cx, cy + R + 6);
  // 층 이름
  if (banner) {
    hx.globalAlpha = Math.min(1, banner.t * 2);
    hx.textAlign = 'center'; hx.textBaseline = 'top'; hx.fillStyle = '#e6efd8'; hx.font = 'bold 18px system-ui, sans-serif';
    hx.fillText(FLOORS[banner.b][0], 320, 40);
    hx.font = '12px system-ui, sans-serif'; hx.fillStyle = '#a9c0a0'; hx.fillText(FLOORS[banner.b][1], 320, 64);
    hx.globalAlpha = 1;
  }
  if (state === 'play') {
    if (P.near) { const p = project(P.near.col * T + T, floorRow(P.near.b) * T - 34); bubble(`W  ${P.near.label}`, p.x, p.y); }
    else if (P.onElev) { const p = project(P.x + P.w / 2, P.y - 6); bubble('W/S  도르래 감기', p.x, p.y); }
  }
  if (dialog) {
    hx.fillStyle = 'rgba(8,12,11,.85)'; hx.fillRect(60, 300, 520, 34);
    hx.fillStyle = '#e6efd8'; hx.font = '13px system-ui, sans-serif'; hx.textAlign = 'center'; hx.textBaseline = 'middle';
    hx.fillText(dialog.text, 320, 317);
  }
  if (state === 'dying') { const k = Math.min(1, deadT / 1.4); hx.fillStyle = `rgba(2,6,4,${(k * k * 0.9).toFixed(3)})`; hx.fillRect(0, 0, hud.width, hud.height); }
  if (state === 'dead') {
    hx.fillStyle = 'rgba(2,6,4,.9)'; hx.fillRect(0, 0, hud.width, hud.height);
    hx.font = '13px ui-monospace, monospace'; hx.fillStyle = '#7fe07a'; hx.textAlign = 'left'; hx.textBaseline = 'top';
    const lines = ['BANGDOK-OS v0.7', '> 착용자 생체 신호 확인 ...... 없음', `> 마지막 위치: 지하철 탑 ${FLOORS[bandOf(P.y)][0]}`, '> 정화통 기록을 출입층으로 되돌립니다', '', '[Enter] 다시 시작'];
    const n = Math.floor(deadT * 3);
    lines.slice(0, n).forEach((l, i) => hx.fillText(l, 40, 60 + i * 22));
  }
}

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else {
    deadT += dt; timeNow += dt;
    if (state === 'dying' && deadT >= 1.4) { state = 'dead'; deadT = 0; }
    else if (state === 'dead' && enterP && deadT > 1) respawn();
  }
  render3D(); drawHud();
  jumpP = upP = atkP = enterP = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__tower = { P, elev, enemies, get camX() { return camX; }, map };
